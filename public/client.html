function describeFilter(f) {
  var bits = [];
  if (Array.isArray(f.destinations) && f.destinations.length) {
    bits.push('to ' + f.destinations.slice(0, 3).join(', ') + (f.destinations.length > 3 ? '…' : ''));
  } else {
    bits.push('to anywhere');
  }
  if (Array.isArray(f.origins) && f.origins.length) {
    bits.push('from ' + f.origins.slice(0, 3).join(', ') + (f.origins.length > 3 ? '…' : ''));
  }
  if (f.type) {
    var typeLabels = {
      Accommodation: 'hotels', Flights: 'flights',
      DynamicPackages: 'dynamic packages', PackageHolidays: 'operator packages',
      BothPackages: 'packages', Any: 'anything',
    };
    if (typeLabels[f.type]) bits.push('· ' + typeLabels[f.type]);
  }
  if (f.ratingMin) bits.push('· ' + f.ratingMin + '★+');
  if (f.budgetMax) bits.push('· up to £' + f.budgetMax + 'pp');
  if (f.sort === 'price:desc') bits.push('· high to low');
  if (f.sort === 'random') bits.push('· randomised');
  return 'Pulling: ' + bits.join(' ');
}

// ── Generic chip row (used by destinations + origins) ───────────────
function buildChipRow(opts) {
  var section = opts.section;
  var listKey = opts.listKey;
  var f = getFilter(section);
  if (!Array.isArray(f[listKey])) f[listKey] = [];

  var wrap = document.createElement('div');
  wrap.className = 'of-row';

  var label = document.createElement('label');
  label.className = 'of-label';
  label.textContent = opts.label;
  wrap.appendChild(label);

  var chipsBox = document.createElement('div');
  chipsBox.className = 'of-chips';
  var input = document.createElement('input');
  input.className = 'of-chip-input';
  input.type = 'text';
  input.placeholder = opts.placeholder || '';
  input.autocomplete = 'off';

  function refresh() {
    chipsBox.querySelectorAll('.of-chip').forEach(function(c) { c.remove(); });
    f[listKey].forEach(function(v, i) {
      var chip = document.createElement('span');
      chip.className = 'of-chip';
      var span = document.createElement('span');
      span.textContent = opts.labelFromValue(v);
      chip.appendChild(span);
      var x = document.createElement('button');
      x.type = 'button';
      x.setAttribute('aria-label', 'Remove ' + v);
      x.textContent = '×';
      x.addEventListener('click', function() {
        f[listKey].splice(i, 1);
        refresh();
        triggerFilterPreview(section.id);
      });
      chip.appendChild(x);
      chipsBox.insertBefore(chip, input);
    });
  }

  // Suggestion dropdown
  var sugBox = document.createElement('div');
  sugBox.className = 'of-suggestions';
  sugBox.hidden = true;

  function commit(value) {
    if (!value) return;
    if (!f[listKey].includes(value)) f[listKey].push(value);
    input.value = '';
    sugBox.hidden = true;
    sugBox.innerHTML = '';
    refresh();
    triggerFilterPreview(section.id);
  }

  function showSuggestions(items) {
    sugBox.innerHTML = '';
    if (!items || !items.length) {
      sugBox.hidden = true;
      return;
    }
    items.forEach(function(item) {
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'of-suggestion';
      var kindEl = document.createElement('span');
      kindEl.className = 'of-suggestion-kind of-kind-' + (item.kind || 'x');
      kindEl.textContent =
        item.kind === 'country' ? 'Country' :
        item.kind === 'city' ? 'City' :
        item.kind === 'resort' ? 'Resort' :
        item.kind === 'airport' ? 'Airport' : '';
      var labelEl = document.createElement('span');
      labelEl.className = 'of-suggestion-label';
      labelEl.textContent = item.label;
      row.appendChild(kindEl);
      row.appendChild(labelEl);
      row.addEventListener('mousedown', function(e) {
        // mousedown not click — prevents the input's blur from firing first
        e.preventDefault();
        commit(opts.valueFromSuggestion(item));
      });
      sugBox.appendChild(row);
    });
    sugBox.hidden = false;
  }

  var debounceTimer = null;
  input.addEventListener('input', function() {
    var q = input.value.trim();
    if (!q) {
      sugBox.hidden = true;
      return;
    }
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      Promise.resolve(opts.suggestionFetcher(q)).then(showSuggestions).catch(function() {
        sugBox.hidden = true;
      });
    }, 150);
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      // If there's a top suggestion, take it; else use the raw input
      var firstSug = sugBox.querySelector('.of-suggestion');
      if (firstSug) firstSug.dispatchEvent(new MouseEvent('mousedown'));
      else if (input.value.trim()) commit(input.value.trim().toUpperCase());
    } else if (e.key === 'Backspace' && !input.value && f[listKey].length) {
      f[listKey].pop();
      refresh();
      triggerFilterPreview(section.id);
    } else if (e.key === 'Escape') {
      sugBox.hidden = true;
    }
  });
  input.addEventListener('blur', function() {
    // Defer hide so click on suggestion lands first
    setTimeout(function() { sugBox.hidden = true; }, 200);
  });

  chipsBox.appendChild(input);
  wrap.appendChild(chipsBox);
  wrap.appendChild(sugBox);

  if (opts.help) {
    var help = document.createElement('div');
    help.className = 'of-help';
    help.textContent = opts.help;
    wrap.appendChild(help);
  }

  refresh();
  return wrap;
}

// ── Single-select dropdown row ─────────────────────────────────────
function buildSelectRow(opts) {
  var section = opts.section;
  var f = getFilter(section);
  var current = f[opts.listKey];
  if (current === undefined || current === null) current = opts.defaultValue || '';

  var wrap = document.createElement('div');
  wrap.className = 'of-row';
  var label = document.createElement('label');
  label.className = 'of-label';
  label.textContent = opts.label;
  wrap.appendChild(label);

  var sel = document.createElement('select');
  sel.className = 'of-input';
  opts.options.forEach(function(o) {
    var op = document.createElement('option');
    op.value = o.value;
    op.textContent = o.label;
    if (String(current) === String(o.value)) op.selected = true;
    sel.appendChild(op);
  });
  sel.addEventListener('change', function() {
    var v = sel.value;
    if (v === '') {
      delete f[opts.listKey];
    } else if (opts.coerce === 'number') {
      var n = parseFloat(v);
      if (isFinite(n) && n > 0) f[opts.listKey] = n;
      else delete f[opts.listKey];
    } else {
      f[opts.listKey] = v;
    }
    triggerFilterPreview(section.id);
  });
  wrap.appendChild(sel);
  if (opts.help) {
    var help = document.createElement('div');
    help.className = 'of-help';
    help.textContent = opts.help;
    wrap.appendChild(help);
  }
  return wrap;
}

// ── Multi-select toggle row ────────────────────────────────────────
function buildMultiSelectRow(opts) {
  var section = opts.section;
  var f = getFilter(section);
  if (!Array.isArray(f[opts.listKey])) f[opts.listKey] = [];

  var wrap = document.createElement('div');
  wrap.className = 'of-row';
  var label = document.createElement('label');
  label.className = 'of-label';
  label.textContent = opts.label;
  wrap.appendChild(label);

  var togGrid = document.createElement('div');
  togGrid.className = 'of-toggles';
  opts.options.forEach(function(o) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'of-toggle' + (f[opts.listKey].includes(o.value) ? ' is-on' : '');
    btn.textContent = o.label;
    btn.addEventListener('click', function() {
      var idx = f[opts.listKey].indexOf(o.value);
      if (idx >= 0) f[opts.listKey].splice(idx, 1);
      else f[opts.listKey].push(o.value);
      // Clear key entirely if empty so we don't send []
      if (f[opts.listKey].length === 0) delete f[opts.listKey];
      btn.classList.toggle('is-on');
      triggerFilterPreview(section.id);
    });
    togGrid.appendChild(btn);
  });
  wrap.appendChild(togGrid);
  if (opts.help) {
    var help = document.createElement('div');
    help.className = 'of-help';
    help.textContent = opts.help;
    wrap.appendChild(help);
  }
  return wrap;
}

// ── Number-pair row (min/max) ──────────────────────────────────────
function buildNumberPairRow(opts) {
  var section = opts.section;
  var f = getFilter(section);
  var defaults = opts.defaults || {};

  var wrap = document.createElement('div');
  wrap.className = 'of-row';

  var rowLabel = document.createElement('label');
  rowLabel.className = 'of-label';
  rowLabel.textContent = opts.leftLabel.replace(/\s*\(.+\)\s*$/, '') + ' / ' + opts.rightLabel.replace(/\s*\(.+\)\s*$/, '');
  wrap.appendChild(rowLabel);

  function makeInput(key, placeholder) {
    var inp = document.createElement('input');
    inp.type = 'number';
    inp.min = '0';
    inp.placeholder = placeholder;
    inp.className = 'of-input';
    var current = f[key];
    if (current === undefined && defaults[key] !== undefined) current = defaults[key];
    if (typeof current === 'number') inp.value = String(current);
    inp.addEventListener('change', function() {
      var raw = inp.value.trim();
      if (raw === '') {
        delete f[key];
      } else {
        var n = parseInt(raw, 10);
        if (isFinite(n) && n >= 0) f[key] = n;
        else delete f[key];
      }
      triggerFilterPreview(section.id);
    });
    return inp;
  }

  var pair = document.createElement('div');
  pair.className = 'of-pair';
  pair.appendChild(makeInput(opts.leftKey, opts.leftLabel));
  pair.appendChild(makeInput(opts.rightKey, opts.rightLabel));
  wrap.appendChild(pair);

  if (opts.help) {
    var help = document.createElement('div');
    help.className = 'of-help';
    help.textContent = opts.help;
    wrap.appendChild(help);
  }
  return wrap;
}

// ── Destination typeahead — hits /api/destination-search ───────────
function fetchDestinationSuggestions(q) {
  if (destSearchFailed) {
    // Endpoint dead — fall back to raw uppercase commit only
    return Promise.resolve([]);
  }
  if (destSearchCache[q]) return Promise.resolve(destSearchCache[q]);
  if (destSearchInflight[q]) return destSearchInflight[q];
  var p = fetch('/api/destination-search?q=' + encodeURIComponent(q))
    .then(function(r) { return r.ok ? r.json() : { results: [] }; })
    .then(function(data) {
      var results = (data && Array.isArray(data.results)) ? data.results : [];
      destSearchCache[q] = results;
      delete destSearchInflight[q];
      return results;
    })
    .catch(function() {
      destSearchFailed = true; // give up gracefully — chip input still works as plain text
      delete destSearchInflight[q];
      return [];
    });
  destSearchInflight[q] = p;
  return p;
}

// Called by every offer-filter control after a change. Updates the
// summary line, the section list summary, and triggers the preview.
function triggerFilterPreview(sectionId) {
  var section = emailState.builderSections.find(function(s) { return s.id === sectionId; });
  if (!section) return;
  var f = getFilter(section);
  var sumEl = document.getElementById(offerFilterFid(section, 'summary'));
  if (sumEl) sumEl.textContent = describeFilter(f);
  updateSectionSummaryInDOM(sectionId);
  window.__builderPreviewDebounced();
}

// Hydrate every offer-filter host on the page. Called after the
// properties form is rendered.
function hydrateOfferFilters() {
  document.querySelectorAll('.of-editor:not(.of-editor-ready)').forEach(function(host) {
    var sectionId = host.getAttribute('data-section-id');
    var section = emailState.builderSections.find(function(s) { return s.id === sectionId; });
    if (section) buildOfferFilterDom(host, section);
  });
}

function updateSectionSummaryInDOM(sectionId) {
  var section = emailState.builderSections.find(function(s) { return s.id === sectionId; });
  if (!section) return;
  var row = document.querySelector('.email-builder-section-row[data-section-id="' + sectionId + '"]');
  if (!row) return;
  var summaryEl = row.querySelector('.email-builder-section-summary');
  if (summaryEl) summaryEl.textContent = sectionSummary(section);
}

window.__builderPreviewMode = function(mode) {
  emailState.previewMode = mode;
  var wrap = document.querySelector('.email-builder-preview-wrap');
  if (wrap) wrap.classList.toggle('is-mobile', mode === 'mobile');
  // Update button states
  document.querySelectorAll('.email-builder-preview-mode').forEach(function(b) { b.classList.remove('active'); });
  var ev = window.event;
  if (ev && ev.currentTarget) ev.currentTarget.classList.add('active');
};

var __builderPreviewTimer = null;
window.__builderPreviewDebounced = function() {
  if (__builderPreviewTimer) clearTimeout(__builderPreviewTimer);
  __builderPreviewTimer = setTimeout(function() {
    window.__builderRenderPreview();
  }, 500);
};

window.__builderRenderPreview = async function() {
  if (!state.profile || !state.profile.id) return;
  var sections = emailState.builderSections || [];
  if (sections.length === 0) return;
  var loading = document.getElementById('builderPreviewLoading');
  if (loading) loading.style.display = 'block';
  try {
    var r = await fetch('/api/email-render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        sections: sections.map(function(s) { return { type: s.type, props: s.props || {} }; }),
        previewText: emailState.composeData.previewText,
        title: emailState.composeData.subject,
      }),
    });
    var data = await r.json();
    if (!data.success) throw new Error(data.error || 'Render failed');
    emailState.previewHTML = data.html;
    emailState.previewPlain = data.plainText;
    var iframe = document.getElementById('builderPreviewFrame');
    if (iframe) {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(data.html);
      doc.close();
    }
  } catch (e) {
    console.error('Preview render failed:', e);
    var iframe2 = document.getElementById('builderPreviewFrame');
    if (iframe2) {
      var doc2 = iframe2.contentDocument || iframe2.contentWindow.document;
      doc2.open();
      doc2.write('<body style="font-family:-apple-system,sans-serif;padding:20px;color:#999"><em>Preview failed: ' + esc(e.message) + '</em></body>');
      doc2.close();
    }
  } finally {
    if (loading) loading.style.display = 'none';
  }
};

window.__builderApplyTemplate = function(templateId) {
  if (!templateId) return;
  var tmpl = (emailState.templates || []).find(function(t) { return t.id === templateId; });
  if (!tmpl || !tmpl.sections) {
    alert('Template not found or has no sections');
    return;
  }
  if (emailState.builderSections.length > 0 && !confirm('Apply this template? Your current sections will be replaced.')) {
    return;
  }
  // Clone sections, give each a new id
  emailState.builderSections = tmpl.sections.map(function(s) {
    return { id: genSectionId(), type: s.type, props: JSON.parse(JSON.stringify(s.props || {})) };
  });
  emailState.selectedSectionId = (emailState.builderSections[0] || {}).id || null;
  // Apply suggested subject and preview text if currently empty
  if (!emailState.composeData.subject && tmpl.subjectSuggestion) {
    emailState.composeData.subject = tmpl.subjectSuggestion;
  }
  if (!emailState.composeData.previewText && tmpl.previewSuggestion) {
    emailState.composeData.previewText = tmpl.previewSuggestion;
  }
  drawEmails();
};

async function loadEmailTemplates() {
  try {
    var r = await fetch('/api/email-templates?clientId=' + encodeURIComponent(state.profile && state.profile.id || ''));
    var d = await r.json();
    if (d.success && d.templates) {
      emailState.templates = d.templates;
    } else {
      emailState.templates = [];
    }
  } catch (e) {
    console.error('Templates load failed:', e);
    emailState.templates = [];
  }
}

window.__closeSaveAsTemplateModal = function() {
  var modal = document.getElementById('saveTemplateModal');
  if (modal) modal.remove();
};

window.__submitSaveAsTemplate = async function() {
  var nameEl = document.getElementById('tmplName');
  var descEl = document.getElementById('tmplDesc');
  var catEl = document.getElementById('tmplCategory');
  var btn = document.getElementById('tmplSaveBtn');
  if (!nameEl || !btn) return;

  var name = String(nameEl.value || '').trim();
  if (!name) {
    alert('Please enter a template name.');
    nameEl.focus();
    return;
  }

  // Build sections payload (strip ids — templates use fresh ids when applied)
  var sectionsPayload = (emailState.builderSections || []).map(function(s) {
    return { type: s.type, props: s.props || {} };
  });

  btn.disabled = true;
  btn.textContent = 'Saving...';
  btn.style.opacity = '0.6';

  try {
    var r = await fetch('/api/email-templates-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile && state.profile.id || '',
        templateName: name,
        description: String(descEl ? descEl.value : '').trim(),
        category: String(catEl ? catEl.value : '').trim(),
        sectionsJson: JSON.stringify(sectionsPayload),
        subjectSuggestion: (emailState.composeData && emailState.composeData.subject) || '',
        previewSuggestion: (emailState.composeData && emailState.composeData.previewText) || '',
      }),
    });
    var d = await r.json();
    if (!d.success) throw new Error(d.error || 'Save failed');

    window.__closeSaveAsTemplateModal();
    // Refresh templates so the new one appears in the dropdown
    await loadEmailTemplates();
    drawEmails();
    // Subtle confirmation — toast-ish (uses existing pattern from other handlers)
    alert('Template saved as "' + name + '". It now appears in the Start from template dropdown.');
  } catch (e) {
    console.error('[save template] error:', e);
    alert('Save failed: ' + e.message);
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Save template';
      btn.style.opacity = '1';
    }
  }
};

window.__emailComposeSave = async function() {
  var d = emailState.composeData;
  if ($('composeSubject')) d.subject = $('composeSubject').value;
  if ($('composePreview')) d.previewText = $('composePreview').value;
  if ($('composeRecipient')) d.recipientEmail = $('composeRecipient').value;
  if ($('composeSegment')) d.audienceSegment = $('composeSegment').value;

  // Validate
  if (!d.subject.trim()) { alert('Subject is required'); return; }
  var sections = emailState.builderSections || [];
  if (sections.length === 0) { alert('Add at least one section to the email'); return; }
  if (!d.audience) { alert('Pick an audience'); return; }
  if (d.recipientEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.recipientEmail)) {
    alert('Recipient email is not valid'); return;
  }

  // Required-field check on hero/cta sections
  for (var i = 0; i < sections.length; i++) {
    var s = sections[i];
    var meta = sectionMeta(s.type);
    for (var j = 0; j < meta.fields.length; j++) {
      var f = meta.fields[j];
      if (f.required) {
        var v = getNestedValue(s.props || {}, f.key);
        if (!v || (typeof v === 'string' && !v.trim())) {
          alert('Section "' + meta.label + '" is missing required field: ' + f.label);
          return;
        }
      }
    }
  }

  var btn = $('composeSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; btn.style.opacity = '0.6'; }

  try {
    // Step 1: render sections to HTML + plain via the render API
    var renderRes = await fetch('/api/email-render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        sections: sections.map(function(s) { return { type: s.type, props: s.props || {} }; }),
        previewText: d.previewText,
        title: d.subject,
      }),
    });
    var renderData = await renderRes.json();
    if (!renderData.success) throw new Error(renderData.error || 'Render failed');

    // Step 2: post to email-compose with rendered HTML + plain + sections JSON for round-tripping
    var payload = Object.assign({}, d, {
      clientId: state.profile.id,
      bodyHTML: renderData.html,
      bodyPlain: renderData.plainText,
      sectionsJson: JSON.stringify(sections.map(function(s) { return { type: s.type, props: s.props || {} }; })),
    });

    var r = await fetch('/api/email-compose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    var data = await r.json();
    if (!data.success) throw new Error(data.error || 'Save failed');

    showEmailToast('Email saved as Awaiting Approval', 'success');
    emailState.composeOpen = false;
    emailState.composeData = {
      subject: '', previewText: '', bodyHTML: '', bodyPlain: '',
      audience: 'Client', audienceSegment: '', recipientEmail: '',
      scheduledSend: '', emailType: 'Newsletter',
    };
    emailState.builderInitialised = false;
    emailState.builderSections = null;
    emailState.selectedSectionId = null;
    emailState.previewHTML = '';
    // Clear duplicate-from state — next compose is a fresh start
    emailState.duplicatedFromEmailId = null;
    emailState.duplicatedFromSubject = '';
    loadEmails();  // refresh queue
  } catch (e) {
    alert('Save failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Save as Draft'; btn.style.opacity = '1'; }
  }
};

window.__openTestSendModal = function(emailId, contextLabel) {

        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--tg-accent)" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +

      '</div>' +
      '<div style="font-size:12px;color:var(--tg-text-tertiary);margin-top:6px">' + esc(contextLabel || 'Sends a copy without changing the email\u2019s status. Subject will be prefixed [TEST].') + '</div>' +
    '</div>' +
    '<div style="padding:20px 24px">' +
      '<label style="display:block;font-size:11px;font-weight:600;color:var(--tg-text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Recipient emails (comma-separated, max 20)</label>' +
      '<textarea id="testSendInput" rows="4" placeholder="andy@example.com, darren@example.com, test@example.com" style="width:100%;padding:12px 14px;border:1px solid var(--tg-border);border-radius:8px;font-size:13px;font-family:var(--tg-font-mono);background:var(--tg-bg-primary);color:var(--tg-text-primary);box-sizing:border-box;resize:vertical;line-height:1.5"></textarea>' +
      '<div id="testSendCount" style="margin-top:8px;font-size:12px;color:var(--tg-text-tertiary);min-height:18px"></div>' +
    '</div>' +
    '<div style="padding:0 24px 20px;display:flex;gap:10px;justify-content:flex-end">' +
      '<button onclick="window.__closeTestSendModal()" class="btn btn-ghost btn-sm" style="padding:10px 18px">Cancel</button>' +
      '<button id="testSendSubmit" onclick="window.__submitTestSend(\'' + emailId + '\')" class="btn btn-primary btn-sm" style="padding:10px 18px" disabled>Send test</button>' +
    '</div>';

  bd.appendChild(box);
  document.body.appendChild(bd);

  // Live validation as the user types
  var input = document.getElementById('testSendInput');
  var submitBtn = document.getElementById('testSendSubmit');
  var counter = document.getElementById('testSendCount');
  function updateCount() {
    var raw = input.value || '';
    var parts = raw.split(',').map(function(s) { return s.trim().toLowerCase(); }).filter(function(s) { return s.length > 0; });
    var deduped = [];
    var seen = {};
    parts.forEach(function(p) { if (!seen[p]) { seen[p] = 1; deduped.push(p); } });
    var rxEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var valid = deduped.filter(function(e) { return rxEmail.test(e); });
    var invalid = deduped.filter(function(e) { return !rxEmail.test(e); });
    if (deduped.length === 0) {
      counter.textContent = '';
      counter.style.color = 'var(--tg-text-tertiary)';
      submitBtn.disabled = true;
    } else if (invalid.length > 0) {
      counter.innerHTML = '\u2717 ' + invalid.length + ' invalid: ' + esc(invalid.slice(0, 3).join(', ')) + (invalid.length > 3 ? '\u2026' : '');
      counter.style.color = 'var(--tg-error)';
      submitBtn.disabled = true;
    } else if (valid.length > 20) {
      counter.textContent = '\u2717 Too many — max 20 recipients per test send (you have ' + valid.length + ')';
      counter.style.color = 'var(--tg-error)';
      submitBtn.disabled = true;
    } else {
      counter.innerHTML = '\u2713 ' + valid.length + ' valid recipient' + (valid.length === 1 ? '' : 's');
      counter.style.color = 'var(--tg-success)';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send test to ' + valid.length;
    }
  }
  input.addEventListener('input', updateCount);
  setTimeout(function() { input.focus(); }, 50);
};

window.__closeTestSendModal = function() {

window.__submitTestSend = async function(emailId) {
  var input = document.getElementById('testSendInput');
  var submitBtn = document.getElementById('testSendSubmit');
  if (!input || !submitBtn) return;
  var raw = input.value || '';
  var recipients = raw.split(',').map(function(s) { return s.trim().toLowerCase(); }).filter(function(s) { return s.length > 0; });
  if (recipients.length === 0) return;

  submitBtn.disabled = true;
  var originalLabel = submitBtn.textContent;
  submitBtn.textContent = 'Sending\u2026';
  console.log('[EMAIL-TEST] sending to', recipients.length, 'recipients for emailId=', emailId);

  try {
    var r = await fetch('/api/email-send-now', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        emailId: emailId,
        testRecipients: recipients,
      }),
    });
    var d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || 'Test send failed');
    window.__closeTestSendModal();
    var msg = 'Test sent to ' + d.sent + ' recipient' + (d.sent === 1 ? '' : 's');

    console.error('[EMAIL-TEST] failed:', e);
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;
    alert('Test send failed: ' + e.message);
  }
};

window.__fireAudienceSend = async function() {
  var st = window.__audienceSendState;
  var ids = Object.keys(st.selected).map(function(id) { return parseInt(id, 10); }).filter(function(n) { return Number.isInteger(n); });
  if (ids.length === 0 || !st.emailId) return;
  var total = 0;
  ids.forEach(function(id) { total += st.selected[String(id)].subscribers || 0; });

  var btn = document.getElementById('audienceConfirmSend');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending\u2026'; btn.style.opacity = '0.7'; }
  console.log('[EMAIL-AUDIENCE] firing send for emailId=', st.emailId, 'listIds=', ids, 'recipientsCount=', total);

  try {
    var r = await fetch('/api/email-send-audience', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        emailId: st.emailId,
        listIds: ids,
        recipientsCount: total,
      }),
    });
    var d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || d.detail || 'Send failed');
    window.__closeAudienceSendModal();
    closeEmailDrawer();
    showEmailToast('Sent to ~' + (d.recipientsCount || total).toLocaleString() + ' subscribers \u00b7 campaign ' + (d.brevoCampaignId || ''), 'success');
    console.log('[EMAIL-AUDIENCE] sent:', d);
    if (typeof loadEmails === 'function') loadEmails();
  } catch (e) {
    console.error('[EMAIL-AUDIENCE] send failed:', e);
    if (btn) { btn.disabled = false; btn.textContent = 'Send to ' + total.toLocaleString(); btn.style.opacity = '1'; }
    alert('Send failed: ' + e.message);
  }
};

// WELCOME STATE — onboarding scaffolding for new clients

var WELCOME_STORAGE_KEY = 'luna_first_seen_at';
var SHOWCASE_STORAGE_KEY = 'luna_showcase_seen';
var WELCOME_GRADUATION_DAYS = 7;
var WELCOME_MIN_APPROVED_POSTS = 5;

// Compute everything the welcome panel needs to render. Centralised so
// drawDashboard, the help button, and graduation logic all read from the
// same source. Returns { show, steps[3], progress, hasMetrics, ... }.
function computeWelcomeState(d) {
  // PREVIEW MODE — owner exemption disabled so Travelgenix can see the full
  // welcome experience. Re-enable before going live to other clients (see
  // SETUP.md for the line to uncomment).
  var p = state.profile || {};
  // if (p.id === OWNER_CLIENT_ID) {
  //   return { show: false };
  // }

  // Step 1 — platforms connected? Check both standard + personal arrays.
  var platforms = (p.connected_platforms && p.connected_platforms.length) || 0;
  var personal  = (p.connected_platforms_personal && p.connected_platforms_personal.length) || 0;
  var step1Done = platforms > 0 || personal > 0;

  // Step 2 — first post reviewed? We count any post that's not in 'pending'
  // status as having been "reviewed" (approved, rejected, queued, posted).
  // state.allPosts is loaded by loadPosts() — may be empty if user hasn't
  // visited the Posts tab yet. We also fall back to dashboard hints.
  var allPosts = (state && state.allPosts) || [];
  var reviewedCount = allPosts.filter(function (p) {
    var s = (p.status || '').toLowerCase();
    return s && s !== 'pending' && s !== 'awaiting approval' && s !== 'awaiting_approval';
  }).length;
  var approvedCount = allPosts.filter(function (p) {
    var s = (p.status || '').toLowerCase();
    return s === 'approved' || s === 'queued' || s === 'posted' || s === 'published';
  }).length;
  var step2Done = reviewedCount > 0;

  // Step 3 — first week of approved posts done? 5+ approved + zero in queue.
  var stillToApprove = (d && d.actions && d.actions.postsAwaitingApproval) || 0;
  var step3Done = approvedCount >= WELCOME_MIN_APPROVED_POSTS && stillToApprove === 0;

  // First-seen timestamp — we record it the first time we ever render
  // the welcome state, so the 7-day graduation timer starts from real
  // user activity (not from when their account was created in Airtable).
  var firstSeenAt = 0;
  try {
    var stored = localStorage.getItem(WELCOME_STORAGE_KEY + ':' + p.id);
    if (stored) {
      firstSeenAt = parseInt(stored, 10) || 0;
    }
  } catch (e) { /* localStorage disabled — fine */ }

  if (!firstSeenAt) {
    firstSeenAt = Date.now();
    try { localStorage.setItem(WELCOME_STORAGE_KEY + ':' + p.id, String(firstSeenAt)); }
    catch (e) { /* fine, just means timer won't persist between sessions */ }
  }

  var daysSeen = Math.floor((Date.now() - firstSeenAt) / 86400000);
  var allStepsDone = step1Done && step2Done && step3Done;
  var hasGraduatedByTime = daysSeen >= WELCOME_GRADUATION_DAYS;

  // Hide welcome state once they've ticked all 3 AND been around at least
  // 7 days. The time guard ensures someone who clicks through fast still
  // gets the educational period.
  var graduated = allStepsDone && hasGraduatedByTime;

  // Also check: do they have ANY metric data yet? If yes, even partially,
  // the welcome panel makes less sense — they're already getting value.
  var k = (d && d.kpis) || {};
  var hasMetrics = (k.postsPublished > 0) || (k.postReach > 0) ||
                   (k.demoBookings > 0) || (k.websiteClicks > 0);

  // If they've been around 7+ days AND have metrics, we definitely graduate.
  if (hasGraduatedByTime && hasMetrics) {
    graduated = true;
  }

  return {
    show: !graduated,
    hasMetrics: hasMetrics,
    daysSeen: daysSeen,
    progress: [step1Done, step2Done, step3Done].filter(Boolean).length,
    progressTotal: 3,
    steps: [
      { done: step1Done, title: 'Connect your social platforms',  desc: 'Tell Luna where to post — Facebook, Instagram, LinkedIn and the rest.', target: 'platforms' },
      { done: step2Done, title: 'Review your first drafted posts', desc: 'We\'ve already written some based on your brand voice. Approve or refine.', target: 'posts' },
      { done: step3Done, title: 'Approve your first week',         desc: 'Get 5+ posts approved and queued. Then you\'re live.', target: 'posts' }
    ]
  };
}

function openShowcase(source) {
  showcaseState.chapters = buildShowcaseChapters();
  showcaseState.current = 0;
  showcaseState.visited = [0];

  var overlay = $('showcase-overlay');
  var stage = $('showcase-stage');
  if (!overlay || !stage) return;

  // Build chapter HTML
  var chaptersHtml = showcaseState.chapters.map(function (ch, idx) {
    if (ch.isClosing) {
      return '<div class="showcase-chapter" data-chapter-idx="' + idx + '">' + ch.visual + '</div>';
    }
    return '<div class="showcase-chapter" data-chapter-idx="' + idx + '">' +
      '<div class="showcase-chapter-grid">' +
        '<div class="showcase-text">' +
          '<div class="showcase-eyebrow">' + esc(ch.eyebrow) + '</div>' +
          '<h2 class="showcase-headline" id="showcase-headline-' + idx + '">' + ch.headline + '</h2>' +
          '<p class="showcase-body">' + esc(ch.body) + '</p>' +
        '</div>' +
        '<div class="showcase-visual">' + ch.visual + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  stage.innerHTML = chaptersHtml;

  // Build dots
  var dotsHtml = showcaseState.chapters.map(function (_, idx) {
    return '<button class="showcase-dot" data-dot-idx="' + idx + '" role="tab" aria-label="Chapter ' + (idx + 1) + '"></button>';
  }).join('');
  $('showcase-dots').innerHTML = dotsHtml;

  // Show
  overlay.hidden = false;
  setTimeout(function () { overlay.classList.add('active'); }, 10);
  setTimeout(function () { showcaseGoTo(0); }, 50);
  document.body.style.overflow = 'hidden';

  // Mark seen
  try { localStorage.setItem(SHOWCASE_STORAGE_KEY, '1'); } catch (e) {}

  // Focus management
  setTimeout(function () { $('showcase-modal').focus(); }, 100);
}

function closeShowcase() {
  var overlay = $('showcase-overlay');
  if (!overlay) return;
  overlay.classList.remove('active');
  setTimeout(function () { overlay.hidden = true; }, 300);
  document.body.style.overflow = '';
}

function showcaseGoTo(idx) {
  var max = showcaseState.chapters.length - 1;
  if (idx < 0) idx = 0;
  if (idx > max) idx = max;
  showcaseState.current = idx;
  if (showcaseState.visited.indexOf(idx) === -1) {
    showcaseState.visited.push(idx);
  }

  // Update chapters
  document.querySelectorAll('.showcase-chapter').forEach(function (el) {
    var i = parseInt(el.getAttribute('data-chapter-idx'), 10);
    el.classList.toggle('active', i === idx);
  });

  // Update dots
  document.querySelectorAll('.showcase-dot').forEach(function (el) {
    var i = parseInt(el.getAttribute('data-dot-idx'), 10);
    el.classList.toggle('active', i === idx);
    el.classList.toggle('visited', i !== idx && showcaseState.visited.indexOf(i) >= 0);
  });

  // Update buttons
  var prev = $('showcase-prev');
  var next = $('showcase-next');
  if (prev) prev.disabled = idx === 0;
  if (next) {
    if (idx === max) {
      next.innerHTML = 'Get started<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    } else {
      next.innerHTML = 'Next<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
    }
  }
}

// Wire showcase controls (one-time setup, runs on every render is harmless
// because we use closest() and ID-bound handlers).
function attachShowcaseHandlers() {
  var overlay = $('showcase-overlay');
  if (!overlay || overlay._wired) return;
  overlay._wired = true;

  $('showcase-close').addEventListener('click', closeShowcase);
  $('showcase-skip').addEventListener('click', closeShowcase);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeShowcase();
  });

  $('showcase-prev').addEventListener('click', function () {
    showcaseGoTo(showcaseState.current - 1);
  });
  $('showcase-next').addEventListener('click', function () {
    var max = showcaseState.chapters.length - 1;
    if (showcaseState.current === max) {
      closeShowcase();
    } else {
      showcaseGoTo(showcaseState.current + 1);
    }
  });

  $('showcase-dots').addEventListener('click', function (e) {
    var dot = e.target.closest('[data-dot-idx]');
    if (!dot) return;
    showcaseGoTo(parseInt(dot.getAttribute('data-dot-idx'), 10));
  });

  // Keyboard nav
  document.addEventListener('keydown', function (e) {
    if (overlay.hidden) return;
    if (e.key === 'Escape') closeShowcase();
    else if (e.key === 'ArrowRight') showcaseGoTo(showcaseState.current + 1);
    else if (e.key === 'ArrowLeft') showcaseGoTo(showcaseState.current - 1);
  });
}

function ceCloseEditModal() {
  var m = $('ce-modal-backdrop');
  if (m) m.remove();
  ceState.editing = null;
}

// Expose to global so onclick handlers on modal close work
window.ceCloseEditModal = ceCloseEditModal;

function ceCollectFields() {
  return {
    id: ceState.editing && ceState.editing.id,
    name: $('ce-f-name').value.trim(),
    status: $('ce-f-status').value,
    priority: parseInt($('ce-f-priority').value, 10) || 5,
    oneLiner: $('ce-f-oneLiner').value,
    problem: $('ce-f-problem').value,
    proof: $('ce-f-proof').value,
    ctaText: $('ce-f-ctaText').value.trim(),
    ctaUrl: $('ce-f-ctaUrl').value.trim(),
    topics: $('ce-f-topics').value,
    spotlight: $('ce-f-spotlight').checked ? (new Date().toISOString().slice(0,7) + '-01') : '',
    tierMatch: Array.from(document.querySelectorAll('.ce-f-tier:checked')).map(function(el){ return el.value; }),
    archetypes: Array.from(document.querySelectorAll('.ce-f-arch:checked')).map(function(el){ return el.value; })
  };
}

var cePreviewTimer = null;
async function ceUpdatePreview() {
  if (cePreviewTimer) clearTimeout(cePreviewTimer);
  cePreviewTimer = setTimeout(async function(){
    var fields = ceCollectFields();
    if (!fields.name) {
      $('ce-preview-output').innerHTML = '<div style="color:var(--tg-text-tertiary);font-size:var(--text-sm);text-align:center;padding:var(--space-6)">Enter a name to see the preview&hellip;</div>';
      return;
    }
    try {
      var r = await fetch('/api/content-engine-preview', {
        method: 'POST', credentials: 'include',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ productFields: fields, prominence: 'callout' })
      });
      var d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Preview failed');
      var activeTab = document.querySelector('.ce-preview-tab[data-preview]');
      document.querySelectorAll('.ce-preview-tab').forEach(function(t){
        if (t.style.background && t.style.background.indexOf('var(--tg-primary)') !== -1) activeTab = t;
      });
      var which = activeTab ? activeTab.dataset.preview : 'linkedin';
      var out = $('ce-preview-output');
      var pv = d.previews;
      var content;
      if (which === 'linkedin')       content = '<div style="font-family:var(--tg-font-body);font-size:14px;line-height:1.5;color:#1F2937;white-space:pre-line">' + esc(pv.linkedinPersonal || '(empty)') + '</div>';
      else if (which === 'twitter')   content = '<div style="font-family:var(--tg-font-body);font-size:14px;line-height:1.5;color:#1F2937;white-space:pre-line">' + esc(pv.twitter || '(empty)') + '</div><p style="margin:12px 0 0;font-size:11px;color:var(--tg-text-tertiary)">Length: ' + ((pv.twitter||'').length) + ' chars</p>';
      else if (which === 'pinterest') content = '<div style="font-family:var(--tg-font-body);font-size:14px;line-height:1.5;color:#1F2937;white-space:pre-line">' + esc(pv.pinterest || '(empty)') + '</div>';
      else if (which === 'instagram') content = '<div style="font-family:var(--tg-font-body);font-size:14px;line-height:1.5;color:#1F2937;white-space:pre-line">' + esc(pv.instagram || '(empty)') + '</div>';
      else if (which === 'facebook')  content = '<div style="font-family:var(--tg-font-body);font-size:14px;line-height:1.5;color:#1F2937;white-space:pre-line">' + esc(pv.facebook || '(empty)') + '</div>';
      else if (which === 'gbp')       content = '<div style="font-family:var(--tg-font-body);font-size:14px;line-height:1.5;color:#1F2937;white-space:pre-line">' + esc(pv.gbp || '(empty)') + '</div>';
      else if (which === 'email')     content = pv.emailCalloutHtml || '<div style="color:var(--tg-text-tertiary)">(no preview)</div>';
      else if (which === 'blog')      content = pv.blogBlockHtml || '<div style="color:var(--tg-text-tertiary)">(no preview)</div>';
      else content = '<div style="color:var(--tg-text-tertiary)">No preview</div>';
      out.innerHTML = content;
    } catch (e) {
      $('ce-preview-output').innerHTML = '<div style="color:var(--tg-error);font-size:var(--text-sm);padding:var(--space-3)">Preview error: ' + esc(e.message) + '</div>';
    }
  }, 250);
}

async function ceSaveProduct() {
  var btn = $('ce-save-btn');
  var origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    var fields = ceCollectFields();
    if (!fields.name) throw new Error('Name is required');
    var isNew = !fields.id;
    var action = isNew ? 'create' : 'update';
    var body = Object.assign({ tenantId: ceState.currentTenantId }, fields);
    var r = await fetch('/api/content-engine-products?action=' + action, {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    var d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Save failed');
    ceCloseEditModal();
    await ceLoadProducts();
  } catch (e) {
    alert('Could not save: ' + e.message);
    btn.disabled = false;
    btn.textContent = origText;
  }
}

async function ceDeleteProduct() {
  if (!ceState.editing || !ceState.editing.id) return;
  if (!confirm('Delete "' + ceState.editing.name + '"? This cannot be undone.')) return;
  try {
    var r = await fetch('/api/content-engine-products?action=delete', {
      method: 'POST', credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id: ceState.editing.id, tenantId: ceState.currentTenantId })
    });
    var d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Delete failed');
    ceCloseEditModal();
    await ceLoadProducts();
  } catch (e) {
    alert('Could not delete: ' + e.message);
  }
}

//

// and refinement loop. Saves to Email Queue via existing email-compose API.

// Built 18 May 2026. Backend at /api/email-compose-ai and /api/email-compose-refine.

var aiCompose = {
  open: false,
  state: 'brief',
  intent: '',
  archetype: 'marketing-newsletter',
  audience: 'Client',
  audienceSegment: '',
  featureProductIds: [],
  toneOverrides: '',
  draft: null,
  refinementHistory: [],
  refinementPrompt: '',
  refining: false,
  saving: false,
  generateError: null,
  productsForPicker: null,
  // Preview state
  previewHtml: null,
  previewLoading: false,
  previewError: null,
  previewDebounceTimer: null
};

window.__emailComposeAiOpen = function() {
  aiCompose.open = true;
  aiCompose.state = 'brief';
  aiCompose.intent = '';
  aiCompose.archetype = 'marketing-newsletter';
  aiCompose.audience = 'Client';
  aiCompose.audienceSegment = '';
  aiCompose.featureProductIds = [];
  aiCompose.toneOverrides = '';
  aiCompose.draft = null;
  aiCompose.refinementHistory = [];
  aiCompose.refinementPrompt = '';
  aiCompose.generateError = null;
  renderAiComposeModal();
  if (!aiCompose.productsForPicker) loadProductsForPicker();
};

window.__emailComposeAiClose = function() {
  if (aiCompose.state === 'draft' && aiCompose.draft && !confirm('Discard this draft? All AI-generated content will be lost.')) {
    return;
  }
  aiCompose.open = false;
  var backdrop = document.getElementById('ai-compose-backdrop');
  if (backdrop) backdrop.remove();
};

async function loadProductsForPicker() {
  if (!state.profile || !state.profile.id) return;
  try {
    var r = await fetch('/api/content-engine-products?action=list&tenantId=' + encodeURIComponent(state.profile.id), { credentials: 'include' });
    var d = await r.json();
    if (d.ok && d.products) {
      aiCompose.productsForPicker = d.products.filter(function(p) { return p.status === 'Active'; });
      if (aiCompose.open && aiCompose.state === 'brief') renderAiComposeModal();
    }
  } catch (e) {
    console.warn('Could not load products for picker:', e);
  }
}

function renderAiComposeModal() {
  // Preserve scroll position across rebuilds. The modal scroll container
  // is the flex:1 overflow-y:auto div; when we destroy and recreate the
  // backdrop, scroll resets to 0 unless we restore it. This was the cause
  // of "Generate button does nothing" — every click triggered re-renders
  // that yanked the user back to the top of the modal.
  var savedScroll = 0;
  var existing = document.getElementById('ai-compose-backdrop');
  if (existing) {
    var oldScrollEl = existing.querySelector('[data-ai-modal-scroll]');
    if (oldScrollEl) savedScroll = oldScrollEl.scrollTop;
    existing.remove();
  }
  if (!aiCompose.open) return;

  var html = '<div id="ai-compose-backdrop" style="position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:var(--space-4);overflow-y:auto" onclick="if(event.target===this)window.__emailComposeAiClose()">';
  html += '<div id="ai-compose-modal" style="background:var(--tg-bg-primary);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);max-width:920px;width:100%;max-height:92vh;display:flex;flex-direction:column">';

  var headerTitle, headerSubtitle;
  if (aiCompose.state === 'brief') {
    headerTitle = 'Compose with AI';
    headerSubtitle = 'Tell me what this email is for &mdash; I&rsquo;ll draft it in your voice.';
  } else if (aiCompose.state === 'generating') {
    headerTitle = 'Drafting your email&hellip;';
    headerSubtitle = 'Loading brand voice, checking the Product Library, structuring sections.';
  } else {
    headerTitle = 'Review your draft';
    headerSubtitle = 'Refine with a prompt or edit any section directly.';
  }

  html += '<div style="padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--tg-border);display:flex;align-items:center;justify-content:space-between">';
  html += '<div>';
  html += '<h2 style="margin:0;font-size:var(--text-xl);font-weight:700;color:var(--tg-text-primary)">' + headerTitle + '</h2>';
  html += '<p style="margin:4px 0 0;font-size:var(--text-xs);color:var(--tg-text-tertiary)">' + headerSubtitle + '</p>';
  html += '</div>';
  html += '<button onclick="window.__emailComposeAiClose()" style="background:none;border:none;cursor:pointer;padding:8px;border-radius:var(--radius-sm);color:var(--tg-text-tertiary)" aria-label="Close">';
  html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  html += '</button>';
  html += '</div>';

  html += '<div data-ai-modal-scroll style="flex:1;overflow-y:auto;min-height:0">';
  if (aiCompose.state === 'brief') html += renderAiBriefBody();
  else if (aiCompose.state === 'generating') html += renderAiGeneratingBody();
  else if (aiCompose.state === 'draft') html += renderAiDraftBody();
  html += '</div>';

  html += '<div style="padding:var(--space-4) var(--space-6);border-top:1px solid var(--tg-border);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);background:var(--tg-bg-secondary)">';
  if (aiCompose.state === 'brief') {
    html += '<div></div>';
    html += '<div style="display:flex;gap:var(--space-2)">';
    html += '<button class="btn" onclick="window.__emailComposeAiClose()">Cancel</button>';
    html += '<button class="btn btn-primary" id="ai-generate-btn" onclick="window.__emailComposeAiGenerate()">Generate draft</button>';
    html += '</div>';
  } else if (aiCompose.state === 'draft') {
    html += '<button class="btn" onclick="window.__emailComposeAiBack()">&larr; Back to brief</button>';
    html += '<div style="display:flex;gap:var(--space-2)">';
    html += '<button class="btn" onclick="window.__emailComposeAiRegenerate()">Generate again</button>';
    // Send test — enabled only after Save (we need an emailId to test against).
    // Title hint explains the disabled state to the user.
    var testBtnDisabled = aiCompose.savedEmailId ? '' : ' disabled';
    var testBtnTitle = aiCompose.savedEmailId ? 'Send a test copy to QA recipients' : 'Save as draft first, then you can send a test';
    html += '<button class="btn" id="ai-test-btn" onclick="window.__openTestSendModal(\'' + (aiCompose.savedEmailId || '') + '\')" title="' + testBtnTitle + '"' + testBtnDisabled + '>Send test</button>';
    html += '<button class="btn btn-primary" id="ai-save-btn" onclick="window.__emailComposeAiSave()">' + (aiCompose.savedEmailId ? 'Save changes' : 'Save as draft') + '</button>';
    html += '</div>';
  } else {
    html += '<div></div><div></div>';
  }
  html += '</div>';
  html += '</div></div>';

  document.body.insertAdjacentHTML('beforeend', html);

  // Restore scroll position after rebuild — prevents the modal from
  // jumping to the top on every re-render, which made Generate appear
  // unresponsive (button click triggered re-render → scroll to top →
  // user thought nothing happened).
  if (savedScroll > 0) {
    var newScrollEl = document.querySelector('#ai-compose-backdrop [data-ai-modal-scroll]');
    if (newScrollEl) newScrollEl.scrollTop = savedScroll;
  }

  if (aiCompose.state === 'brief') {
    var intent = document.getElementById('ai-intent');
    if (intent) {
      intent.addEventListener('input', function(e) { aiCompose.intent = e.target.value; });
      intent.focus();
    }
    var archetype = document.getElementById('ai-archetype');
    if (archetype) archetype.addEventListener('change', function(e) { aiCompose.archetype = e.target.value; });
    var audience = document.getElementById('ai-audience');
    if (audience) audience.addEventListener('change', function(e) { aiCompose.audience = e.target.value; });
    var segment = document.getElementById('ai-segment');
    if (segment) segment.addEventListener('input', function(e) { aiCompose.audienceSegment = e.target.value; });
    var tone = document.getElementById('ai-tone');
    if (tone) tone.addEventListener('input', function(e) { aiCompose.toneOverrides = e.target.value; });
  } else if (aiCompose.state === 'draft') {
    var refineInput = document.getElementById('ai-refine-input');
    if (refineInput) {
      refineInput.addEventListener('input', function(e) { aiCompose.refinementPrompt = e.target.value; });
      refineInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          window.__emailComposeAiRefine();
        }
      });
    }
    // Populate the preview iframe if HTML is ready.
    // Only set srcdoc if it actually changed — setting it every render
    // makes the preview flash on every redraw.
    var iframe = document.getElementById('ai-preview-iframe');
    if (iframe && aiCompose.previewHtml && iframe.getAttribute('data-current-html-hash') !== String(aiCompose.previewHtml.length)) {
      iframe.srcdoc = aiCompose.previewHtml;
      iframe.setAttribute('data-current-html-hash', String(aiCompose.previewHtml.length));
    }
  }
}

window.__aiImageSetStyle = function(idx, newStyle) {
  if (!aiCompose.draft || !aiCompose.draft.imagesNeeded) {
    aiCompose.draft.imagesNeeded = [];
  }
  var brief = aiCompose.draft.imagesNeeded.find(function(b) { return b.sectionIndex === idx; });
  if (brief) {
    brief.style = newStyle;
  } else {
    aiCompose.draft.imagesNeeded.push({ sectionIndex: idx, slot: 'image_url', style: newStyle, dimensions: 'hero', suggestion: '' });
  }
  renderAiComposeModal();
};

window.__aiImageSetUrl = function(idx, propKey, url) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  if (!aiCompose.draft.sections[idx].props) aiCompose.draft.sections[idx].props = {};
  aiCompose.draft.sections[idx].props[propKey] = url;
  schedulePreviewRefresh(800);
};

// Brief override — lets the user simplify or sharpen the AI's image
// suggestion before regenerating. Stored on the section's __image state
// so it persists for that section's slot across re-renders.
window.__aiImageSetBriefOverride = function(idx, value) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  var section = aiCompose.draft.sections[idx];
  if (!section.__image) section.__image = {};
  section.__image.briefOverride = value;
  // Don't re-render — we're inside an input; let the user keep typing
};

window.__aiImageToggleBriefOverride = function(idx, isOpen) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  var section = aiCompose.draft.sections[idx];
  if (!section.__image) section.__image = {};
  section.__image.briefOverrideOpen = !!isOpen;
};

// Ticker for AI compose image generation. SURGICAL DOM UPDATE ONLY —
// we do NOT re-render the whole modal here, because that caused scroll
// bouncing and preview flashing. We update the elapsed counter and the
// stage classes directly, by ID. Once no section is still loading, the
// ticker stops itself. Idempotent — starts only if not already running.
var __aiImageTickerHandle = null;
function scheduleAiImageTickerIfNeeded() {
  if (__aiImageTickerHandle) return;
  __aiImageTickerHandle = setInterval(function() {
    if (!aiCompose.draft || !aiCompose.draft.sections || !aiCompose.open) {
      clearInterval(__aiImageTickerHandle);
      __aiImageTickerHandle = null;
      return;
    }
    var anyLoading = false;
    aiCompose.draft.sections.forEach(function(section, idx) {
      if (!section.__image || !section.__image.loading) return;
      anyLoading = true;
      var startedAt = section.__image.startedAt;
      if (!startedAt) return;
      var elapsedSec = Math.round((Date.now() - startedAt) / 1000);

      // Update the elapsed counter text in place
      var elapsedEl = document.getElementById('ai-img-elapsed-' + idx);
      if (elapsedEl) elapsedEl.textContent = elapsedSec + 's';

      // Update stage classes in place
      var progressEl = document.getElementById('ai-img-progress-' + idx);
      if (!progressEl) return;
      var stage1Done = elapsedSec > 15;
      var stage2Done = elapsedSec > 90;
      var steps = progressEl.querySelectorAll('[data-stage]');
      steps.forEach(function(stepEl) {
        var stage = stepEl.getAttribute('data-stage');
        stepEl.classList.remove('is-active', 'is-done');
        if (stage === '1') {
          stepEl.classList.add(stage1Done ? 'is-done' : 'is-active');
        } else if (stage === '2') {
          if (stage2Done) stepEl.classList.add('is-done');
          else if (stage1Done) stepEl.classList.add('is-active');
        } else if (stage === '3') {
          if (stage2Done) stepEl.classList.add('is-active');
        }
      });
    });
    if (!anyLoading) {
      clearInterval(__aiImageTickerHandle);
      __aiImageTickerHandle = null;
    }
  }, 1000);
}

window.__aiImageGenerate = async function(idx) {

// ───────────────────────────────────────────────────────────────────────
// REACTIVE (Replicate) image generation — Phase 1 additive
// ───────────────────────────────────────────────────────────────────────
// The Stage B HTML-render pipeline is excellent for product mockups and
// data-driven cards, but slow (90-120s) and not photoreal. For lifestyle
// imagery — destination shots, hero photos, anything that wants to look
// like a real photograph — we call Replicate via /api/replicate-generate
// (the same endpoint the image lab uses). The endpoint takes a prompt
// and an aspect ratio string, returns a URL in 5-30 seconds.
//
// This function lives alongside the existing __aiImageGenerate (HTML
// render) rather than replacing it. The user picks via the new "Photo"
// button in the picker UI.

// Map the existing v2 pixel-slot system to Replicate's aspect-ratio
// string format. Constrained to the values Flux 2 Pro accepts (the
// default photoreal model): 1:1, 16:9, 3:2, 2:3, 4:5, 5:4, 9:16, 3:4,
// 4:3. The model's validator rejects unsupported values with HTTP 422
// (verified 19 May 2026 via Vercel logs). When a slot's native pixel
// ratio (e.g. banner 10:3) isn't in that list, we round to the nearest
// supported value — 16:9 for wide slots, 3:2 for the rest.
function aspectRatioForSlot(slot) {
  switch (slot) {
    case 'hero':           return '16:9';  // 1200x630 (1.905:1) → nearest 16:9
    case 'hero-square':    return '1:1';
    case 'hero-tall':      return '2:3';   // 1200x1500 portrait
    case 'hero-wide':      return '16:9';  // 1200x675 — exact 16:9
    case 'feature-story':  return '3:2';   // 1200x500 closest to 3:2
    case 'card':           return '3:2';
    case 'card-square':    return '1:1';
    case 'thumbnail':      return '1:1';
    case 'banner':         return '16:9';  // 1200x360 (10:3) → nearest 16:9
    case 'wide':           return '16:9';
    default:               return '3:2';
  }
}

// The regular property panel doesn't have a pre-built brief. The user is

// already, or the section might be empty. So this entry point opens a
// small inline prompt modal where they type what they want to see and
// pick an aspect ratio, then we fire the same /api/replicate-generate

var photoModal = {

// ─────────────────────────────────────────────────────────────────────
// Image upload from local file — fitter alongside __imageGenerateOpen
// (AI mockup) and __photoGenerateOpen (Reactive photo). User picks a
// file from their computer, we validate it client-side, POST to
// /api/upload-image which validates again server-side, uploads to
// Vercel Blob, and returns the persistent URL. URL is then written
// into the field via __builderUpdateField so it saves with the section.
// ─────────────────────────────────────────────────────────────────────
window.__imageUploadOpen = function(sectionId, fieldPath, fieldId) {
  // Client-side limits — mirror server. Server enforces final auth, but
  // catching bad files here saves the user a round-trip on obvious mistakes.
  var MAX_BYTES = 4 * 1024 * 1024;  // 4MB
  var ALLOWED_MIME = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

  // Create a hidden file input on the fly. Single-use — removed after the
  // selection is made (or cancelled). Avoids cluttering the DOM.
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = ALLOWED_MIME.join(',');
  input.style.display = 'none';
  document.body.appendChild(input);

  input.addEventListener('change', function() {
    var file = input.files && input.files[0];
    document.body.removeChild(input);
    if (!file) return;

    // Client-side validation
    if (!ALLOWED_MIME.includes(file.type)) {
      window.toast && window.toast('Unsupported file type. Use JPEG, PNG, GIF or WebP.', 'error');
      return;
    }
    if (file.size > MAX_BYTES) {
      window.toast && window.toast('File too large (max 4MB). Compress and try again.', 'error');
      return;
    }
    if (file.size === 0) {
      window.toast && window.toast('File is empty.', 'error');
      return;
    }

    // Find the Upload button so we can show a spinner state while uploading.
    var btn = document.getElementById(fieldId + '-upload-btn');
    var originalHtml = null;
    if (btn) {
      originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="email-builder-img-gen-spinner"></span><span class="email-builder-img-gen-label">Uploading…</span>';
    }

    // Build form data with the file
    var formData = new FormData();
    formData.append('file', file, file.name);

    // POST to upload endpoint. Auth header matches other endpoints.
    fetch('/api/upload-image', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer b2b-saas',
      },
      body: formData,
    })
    .then(function(r) {
      return r.json().then(function(body) {
        return { ok: r.ok, status: r.status, body: body };
      });
    })
    .then(function(result) {
      if (!result.ok) {
        var msg = (result.body && result.body.error) || 'Upload failed';
        window.toast && window.toast(msg, 'error');
        return;
      }
      var url = result.body && result.body.url;
      if (!url) {
        window.toast && window.toast('Upload succeeded but no URL returned', 'error');
        return;
      }
      // Write the URL into the input field AND into section state. Updating
      // the input value alone doesn't trigger the input event listener, so
      // we call __builderUpdateField directly. Then we reflect the value
      // into the input element so the user sees it immediately.
      window.__builderUpdateField(sectionId, fieldPath, url);
      var inputEl = document.getElementById(fieldId);
      if (inputEl) inputEl.value = url;
      window.toast && window.toast('Image uploaded', 'success');
    })
    .catch(function(err) {
      console.error('[image upload] error:', err);
      window.toast && window.toast('Upload failed. Please try again.', 'error');
    })
    .finally(function() {
      // Restore the button regardless of outcome
      if (btn && originalHtml !== null) {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    });
  });

  // Trigger the native file picker. Some browsers require this to be
  // a direct result of a user gesture — which it is, since we got here
  // from an onclick.
  input.click();
};

window.__photoGenerateOpen = function(sectionId, fieldPath) {

  if (hl) prefill.push(hl);

  // to be wide (16:9), card-style slots tend to be square or 3:2.
