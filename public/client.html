// Map AI compose section.type to a Stage B v2 sectionType.
// v2 expects: hero, feature-card, pricing-card, data-card, product-mockup,
// comparison, value-prop, destination-spotlight, other
function mapAiSectionToV2SectionType(aiSectionType, style) {
  if (style === 'product-mockup') return 'product-mockup';
  switch (aiSectionType) {
    case 'hero':
    case 'hero-image':
    case 'lead-story':
      return 'hero';
    case 'feature-story':
    case 'duo-grid':
      return 'feature-card';
    case 'destination-grid':
      return 'destination-spotlight';
    case 'pulse-stats':
      return 'data-card';
    case 'cta-banner':
      return 'value-prop';
    default:
      return 'other';
  }
}

// Map a dimensions label (the AI's choice) to a v2 slot label.
// v2 slots: hero, hero-square, hero-tall, feature-story, card, card-square,
//           thumbnail, banner, wide
function mapDimensionsToV2Slot(dimensions) {
  switch (dimensions) {
    case 'hero': return 'hero';
    case 'hero-square': return 'hero-square';
    case 'feature-story': return 'feature-story';
    case 'card': return 'card';
    case 'thumbnail': return 'thumbnail';
    case 'banner': return 'banner';
    default: return 'hero';
  }
}

window.__aiImageRefine = async function(idx) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  var section = aiCompose.draft.sections[idx];
  if (!section.__image || !section.__image.currentSvg) return;
  var imgState = section.__image;
  if (!imgState.refinementPrompt || imgState.refinementPrompt.trim().length === 0) return;

  var brief = (aiCompose.draft.imagesNeeded || []).find(function(b) { return b.sectionIndex === idx; });
  var style = brief ? brief.style : 'product-mockup';
  var dimensions = brief ? brief.dimensions : 'hero';

  imgState.loading = true;
  imgState.error = null;
  renderAiComposeModal();

  try {
    var r = await fetch('/api/image-refine', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tenantId: state.profile.id,
        existingSvg: imgState.currentSvg,
        refinementPrompt: imgState.refinementPrompt,
        style: style,
        slot: dimensions
      })
    });
    var d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || 'Refinement failed');

    var imageKey = 'image_url';
    if (section.props.imageUrl !== undefined) imageKey = 'imageUrl';
    if (section.props.heroImage !== undefined) imageKey = 'heroImage';

    section.props[imageKey] = d.pngUrl;
    imgState.currentSvg = d.svg;
    imgState.refinementPrompt = '';
    imgState.loading = false;
    imgState.error = null;
    renderAiComposeModal();
    schedulePreviewRefresh(200);
  } catch (e) {
    imgState.loading = false;
    imgState.error = e.message;
    renderAiComposeModal();
  }
};

window.__aiImageSetRefinementPrompt = function(idx, value) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  if (!aiCompose.draft.sections[idx].__image) aiCompose.draft.sections[idx].__image = {};
  aiCompose.draft.sections[idx].__image.refinementPrompt = value;
};

window.__aiImageOpenPexels = function(idx) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  if (!aiCompose.draft.sections[idx].__image) aiCompose.draft.sections[idx].__image = {};
  aiCompose.draft.sections[idx].__image.mode = 'pexels';
  // Default search from the brief
  var brief = (aiCompose.draft.imagesNeeded || []).find(function(b) { return b.sectionIndex === idx; });
  if (brief && brief.suggestion && !aiCompose.draft.sections[idx].__image.pexelsQuery) {
    // Extract just the key nouns — first 40 chars of suggestion
    aiCompose.draft.sections[idx].__image.pexelsQuery = brief.suggestion.split(/[.,]/)[0].slice(0, 40);
  }
  renderAiComposeModal();
};

window.__aiImageCloseMode = function(idx) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  if (!aiCompose.draft.sections[idx].__image) return;
  aiCompose.draft.sections[idx].__image.mode = null;
  renderAiComposeModal();
};

window.__aiPexelsSetQuery = function(idx, value) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  if (!aiCompose.draft.sections[idx].__image) aiCompose.draft.sections[idx].__image = {};
  aiCompose.draft.sections[idx].__image.pexelsQuery = value;
};

window.__aiPexelsSearch = async function(idx) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  var section = aiCompose.draft.sections[idx];
  if (!section.__image) section.__image = {};
  var imgState = section.__image;
  if (!imgState.pexelsQuery || imgState.pexelsQuery.trim().length === 0) return;

  var brief = (aiCompose.draft.imagesNeeded || []).find(function(b) { return b.sectionIndex === idx; });
  var dimensions = brief ? brief.dimensions : 'hero';

  imgState.loading = true;
  imgState.error = null;
  renderAiComposeModal();

  try {
    var r = await fetch('/api/pexels-search', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tenantId: state.profile.id,
        query: imgState.pexelsQuery,
        slot: dimensions,
        perPage: 12
      })
    });
    var d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || 'Pexels search failed');

    imgState.pexelsResults = d.photos || [];
    imgState.loading = false;
    renderAiComposeModal();
  } catch (e) {
    imgState.loading = false;
    imgState.error = e.message;
    renderAiComposeModal();
  }
};

window.__aiPexelsPick = function(idx, pIdx) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  var section = aiCompose.draft.sections[idx];
  if (!section.__image || !section.__image.pexelsResults) return;
  var photo = section.__image.pexelsResults[pIdx];
  if (!photo) return;

  var imageKey = 'image_url';
  if (section.props.imageUrl !== undefined) imageKey = 'imageUrl';
  if (section.props.heroImage !== undefined) imageKey = 'heroImage';

  section.props[imageKey] = photo.url;
  // Track Pexels attribution
  if (!aiCompose.draft.__pexelsAttributions) aiCompose.draft.__pexelsAttributions = [];
  aiCompose.draft.__pexelsAttributions.push({
    sectionIndex: idx,
    photographer: photo.photographer,
    photographerUrl: photo.photographerUrl,
    pexelsPageUrl: photo.pexelsPageUrl
  });
  section.__image.mode = null;
  section.__image.currentSvg = null; // not an SVG, so refinement N/A
  renderAiComposeModal();
  schedulePreviewRefresh(200);
};

// ─────────────────────────────────────────────────────────────────────
// INBOX-SIZE PREVIEW
// ─────────────────────────────────────────────────────────────────────
// Opens a dedicated modal showing the email rendered at TRUE inbox
// dimensions (600px desktop, 380px mobile) side-by-side. This is the
// only reliable way to evaluate how images, type and spacing will
// actually look in the recipient's inbox — the embedded live preview
// is constrained by the modal's right-hand column width and shrinks
// content below 600px, making images appear blurrier than they really
// will be in a real client.
//
// Works for both the AI compose modal and the regular email builder,
// since both store rendered email HTML in known places.

function __openInboxPreview(html, opts) {
  if (!html) return;
  opts = opts || {};
  var title = opts.title || 'Inbox preview';

  // Remove any existing instance
  var existing = document.getElementById('inbox-preview-backdrop');
  if (existing) existing.remove();

  // Build the backdrop. Pure CSS, no Tailwind — must be standalone.
  // Sits above the AI compose modal (z-index 1500 vs 1000 for the AI modal).
  var bg = '#e2e8f0'; // light slate, gmail-ish neutral
  var chromeBg = '#ffffff';

  var bd = document.createElement('div');
  bd.id = 'inbox-preview-backdrop';
  bd.setAttribute('role', 'dialog');
  bd.setAttribute('aria-modal', 'true');
  bd.setAttribute('aria-label', title);
  bd.style.cssText = [
    'position:fixed', 'inset:0', 'background:rgba(15,23,42,0.75)',
    'z-index:1500', 'display:flex', 'flex-direction:column',
    'overflow:hidden'
  ].join(';');

  // Header bar
  var header = document.createElement('div');
  header.style.cssText = [
    'flex:0 0 auto', 'padding:14px 20px', 'background:#0f172a',
    'color:#fff', 'display:flex', 'align-items:center',
    'justify-content:space-between', 'gap:16px'
  ].join(';');
  header.innerHTML =
    '<div style="display:flex;align-items:center;gap:14px">' +
      '<div style="font-size:14px;font-weight:600">' + title + '</div>' +
      '<div style="font-size:11px;color:#94a3b8;font-family:var(--tg-font-mono,monospace)">Desktop 600 \u00b7 Mobile 380</div>' +
    '</div>' +
    '<button id="inbox-preview-close" aria-label="Close" style="background:none;border:none;color:#fff;cursor:pointer;padding:6px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:inherit">' +
      '<span>Close</span>' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
    '</button>';

  // Two-column body — desktop iframe and mobile iframe at TRUE dimensions
  var body = document.createElement('div');
  body.style.cssText = [
    'flex:1', 'min-height:0', 'overflow:auto', 'background:' + bg,
    'padding:32px 24px', 'display:flex', 'gap:32px',
    'justify-content:center', 'align-items:flex-start'
  ].join(';');

  // Desktop column — 600px true width
  var desktopCol = document.createElement('div');
  desktopCol.style.cssText = 'flex:0 0 auto;display:flex;flex-direction:column;gap:10px;align-items:center';
  desktopCol.innerHTML =
    '<div style="font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.5px">Desktop \u00b7 600px</div>' +
    '<div style="background:' + chromeBg + ';border-radius:8px;box-shadow:0 8px 32px rgba(15,23,42,0.15);overflow:hidden;width:600px">' +
      '<iframe id="inbox-preview-desktop" sandbox="allow-same-origin" style="display:block;width:600px;height:780px;border:none;background:#fff"></iframe>' +
    '</div>';

  // Mobile column — 380px true width
  var mobileCol = document.createElement('div');
  mobileCol.style.cssText = 'flex:0 0 auto;display:flex;flex-direction:column;gap:10px;align-items:center';
  mobileCol.innerHTML =
    '<div style="font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.5px">Mobile \u00b7 380px</div>' +
    '<div style="background:' + chromeBg + ';border-radius:24px;box-shadow:0 8px 32px rgba(15,23,42,0.15);overflow:hidden;width:380px;border:8px solid #1e293b">' +
      '<iframe id="inbox-preview-mobile" sandbox="allow-same-origin" style="display:block;width:364px;height:780px;border:none;background:#fff"></iframe>' +
    '</div>';

  body.appendChild(desktopCol);
  body.appendChild(mobileCol);

  bd.appendChild(header);
  bd.appendChild(body);
  document.body.appendChild(bd);

  // Inject HTML into both iframes. srcdoc respects sandbox attribute.
  var dIframe = document.getElementById('inbox-preview-desktop');
  var mIframe = document.getElementById('inbox-preview-mobile');
  if (dIframe) dIframe.srcdoc = html;
  if (mIframe) mIframe.srcdoc = html;

  // Close handlers
  var closeBtn = document.getElementById('inbox-preview-close');
  function close() {
    var node = document.getElementById('inbox-preview-backdrop');
    if (node) node.remove();
    document.removeEventListener('keydown', escHandler);
  }
  function escHandler(e) { if (e.key === 'Escape') close(); }
  if (closeBtn) closeBtn.addEventListener('click', close);
  bd.addEventListener('click', function(e) { if (e.target === bd) close(); });
  document.addEventListener('keydown', escHandler);
}

// AI compose: open inbox preview using the already-rendered previewHtml
window.__aiOpenInboxPreview = function() {
  if (!aiCompose.previewHtml) return;
  __openInboxPreview(aiCompose.previewHtml, { title: 'AI compose \u2014 Inbox preview' });
};

// Regular builder: fetch current preview HTML (same call as the live
// preview makes) and open the inbox-size modal with the result.
window.__builderOpenInboxPreview = async function() {
  try {
    var iframe = document.getElementById('builderPreviewFrame');
    var html = null;
    // The builder iframe's srcdoc holds the most recently rendered email.
    // If the iframe has content, prefer that over a fresh fetch — avoids
    // re-fetching when the live preview is already up to date.
    if (iframe && iframe.srcdoc) {
      html = iframe.srcdoc;
    }
    if (!html) {
      // Trigger a fresh render via existing path. If drawEmails is the
      // builder's render entry it'll repaint the iframe; we then read it.
      if (typeof drawEmails === 'function') drawEmails();
      await new Promise(function(r) { setTimeout(r, 200); });
      iframe = document.getElementById('builderPreviewFrame');
      if (iframe) html = iframe.srcdoc;
    }
    if (!html) {
      alert('Preview not yet rendered. Click around in the builder once and try again.');
      return;
    }
    __openInboxPreview(html, { title: 'Email builder \u2014 Inbox preview' });
  } catch (e) {
    console.error('[inbox-preview] failed:', e);
    alert('Could not open inbox preview: ' + e.message);
  }
};

window.__aiToggleSection = function(idx) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  var sec = aiCompose.draft.sections[idx];
  sec.__expanded = !sec.__expanded;
  renderAiComposeModal();
};

// Generate from the "Images needed" callout. Expands the relevant
// section card so the in-section image slot UI shows progress, then
// fires the right flow based on style:
//   product-mockup / abstract → /api/image-generate-v2 (AI render)
//   lifestyle                  → Pexels stock picker
window.__aiImagesNeededGenerate = function(idx) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  var section = aiCompose.draft.sections[idx];
  // Make sure the section is expanded so the user sees the spinner/result.
  // Scroll position is preserved by the modal renderer, so we don't need
  // to do a separate scrollIntoView — the user clicked from somewhere in
  // the modal, so they're already in roughly the right place.
  if (!section.__expanded) {
    section.__expanded = true;
    renderAiComposeModal();
  }
  // Fire the right flow. The existing __aiImageGenerate already routes
  // lifestyle to the legacy v1 endpoint or Pexels per style toggle; here
  // we explicitly send lifestyle straight to the Pexels picker because
  // that matches the brief's intent for that style.
  var brief = (aiCompose.draft.imagesNeeded || []).find(function(b) { return b.sectionIndex === idx; });
  var style = brief ? brief.style : 'product-mockup';
  if (style === 'lifestyle') {
    if (typeof window.__aiImageOpenPexels === 'function') {
      window.__aiImageOpenPexels(idx);
      setTimeout(function() {
        if (typeof window.__aiPexelsSearch === 'function') {
          window.__aiPexelsSearch(idx);
        }
      }, 100);
    }
  } else {
    if (typeof window.__aiImageGenerate === 'function') {
      window.__aiImageGenerate(idx);
    }
  }
};

// Open the stock library picker directly from the "Images needed" rollup,
// regardless of style. Expands the section first so the Pexels search UI
// is visible, then opens the picker and auto-fires the initial search
// using Luna's suggestion as the query seed.
window.__aiImagesNeededOpenStock = function(idx) {
  console.log('[AI-STOCK] called with idx=', idx, 'draft?', !!aiCompose.draft, 'section?', !!(aiCompose.draft && aiCompose.draft.sections && aiCompose.draft.sections[idx]));
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) { console.error('[AI-STOCK] guard failed, exiting silently'); return; }
  var section = aiCompose.draft.sections[idx];
  if (!section.__expanded) {
    section.__expanded = true;
    renderAiComposeModal();
  }
  if (typeof window.__aiImageOpenPexels === 'function') {
    window.__aiImageOpenPexels(idx);
    setTimeout(function() {
      if (typeof window.__aiPexelsSearch === 'function') {
        window.__aiPexelsSearch(idx);
      }
    }, 100);
  }
};

window.__aiUpdateCta = function(idx, key, value) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  if (!aiCompose.draft.sections[idx].props) aiCompose.draft.sections[idx].props = {};
  if (!aiCompose.draft.sections[idx].props.cta) aiCompose.draft.sections[idx].props.cta = {};
  aiCompose.draft.sections[idx].props.cta[key] = value;
  // Debounced preview refresh after section edits
  schedulePreviewRefresh(800);
};

// Override the prop updater to also schedule preview refresh
window.__aiUpdateProp = function(idx, prop, value) {
  if (!aiCompose.draft || !aiCompose.draft.sections[idx]) return;
  if (!aiCompose.draft.sections[idx].props) aiCompose.draft.sections[idx].props = {};
  aiCompose.draft.sections[idx].props[prop] = value;
  schedulePreviewRefresh(800);
};

function schedulePreviewRefresh(delay) {
  if (aiCompose.previewDebounceTimer) clearTimeout(aiCompose.previewDebounceTimer);
  aiCompose.previewDebounceTimer = setTimeout(function() {
    window.__aiRefreshPreview();
  }, delay || 600);
}

window.__aiRefreshPreview = async function() {
  if (!aiCompose.draft || !aiCompose.draft.sections) return;
  if (aiCompose.previewLoading) return;

  aiCompose.previewLoading = true;
  aiCompose.previewError = null;
  // Update the loading indicator in place (don't re-render whole modal — keeps focus)
  updatePreviewLoadingUI(true);

  try {
    var r = await fetch('/api/email-preview-render', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tenantId: state.profile.id,
        sections: aiCompose.draft.sections,
        subject: aiCompose.draft.subject,
        previewText: aiCompose.draft.previewText
      })
    });
    var d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || 'Render failed');
    aiCompose.previewHtml = d.html;
    aiCompose.previewError = null;
  } catch (e) {
    aiCompose.previewError = e.message;
    aiCompose.previewHtml = null;
  }

  aiCompose.previewLoading = false;
  updatePreviewIframe();
  updatePreviewLoadingUI(false);
};

function updatePreviewLoadingUI(loading) {
  // Best-effort UI update without full re-render so we don't lose focus on inputs
  var rightHeader = document.querySelector('#ai-compose-modal [id^="ai-preview-iframe"]');
  // The loading indicator is the small element near "Live preview" — easier to just
  // trigger a partial re-render if state moved
}

function updatePreviewIframe() {
  var iframe = document.getElementById('ai-preview-iframe');
  if (!iframe) {
    // The iframe isn't in the DOM yet because preview was empty — re-render the modal
    renderAiComposeModal();
    // After re-render, find it and populate
    setTimeout(function() {
      var iframe2 = document.getElementById('ai-preview-iframe');
      if (iframe2 && aiCompose.previewHtml) iframe2.srcdoc = aiCompose.previewHtml;
    }, 50);
    return;
  }
  if (aiCompose.previewHtml) {
    iframe.srcdoc = aiCompose.previewHtml;
  }
}

window.__emailComposeAiGenerate = async function() {
  if (!aiCompose.intent || aiCompose.intent.trim().length === 0) {
    aiCompose.generateError = 'Please describe what this email is for';
    renderAiComposeModal();
    return;
  }
  aiCompose.state = 'generating';
  aiCompose.generateError = null;
  renderAiComposeModal();

  try {
    var r = await fetch('/api/email-compose-ai', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tenantId: state.profile.id,
        intent: aiCompose.intent,
        archetype: aiCompose.archetype,
        audience: aiCompose.audience,
        audienceSegment: aiCompose.audienceSegment || undefined,
        featureProductIds: aiCompose.featureProductIds.length > 0 ? aiCompose.featureProductIds : undefined,
        toneOverrides: aiCompose.toneOverrides || undefined
      })
    });
    var d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || 'Generation failed');
    aiCompose.draft = d.draft;
    aiCompose.refinementHistory = [];
    aiCompose.state = 'draft';
    aiCompose.previewHtml = null;
    aiCompose.previewError = null;
    renderAiComposeModal();
    // Kick off the first preview render right away
    window.__aiRefreshPreview();
  } catch (e) {
    aiCompose.state = 'brief';
    aiCompose.generateError = e.message;
    renderAiComposeModal();
  }
};

window.__emailComposeAiBack = function() {
  if (aiCompose.draft && !confirm('Go back to the brief? Your current draft will be lost.')) return;
  aiCompose.state = 'brief';
  aiCompose.draft = null;
  aiCompose.refinementHistory = [];
  renderAiComposeModal();
};

window.__emailComposeAiRegenerate = async function() {
  if (!confirm('Generate a new draft from scratch? The current draft will be replaced.')) return;
  await window.__emailComposeAiGenerate();
};

window.__emailComposeAiRefine = async function() {
  if (!aiCompose.refinementPrompt || aiCompose.refinementPrompt.trim().length === 0) return;
  if (aiCompose.refinementHistory.length >= 10) {
    alert('You have reached 10 refinements. Start a new draft for a clearer brief.');
    return;
  }
  aiCompose.refining = true;
  renderAiComposeModal();
  try {
    var r = await fetch('/api/email-compose-refine', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tenantId: state.profile.id,
        currentDraft: aiCompose.draft,
        refinementPrompt: aiCompose.refinementPrompt,
        refinementHistory: aiCompose.refinementHistory
      })
    });
    var d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || 'Refinement failed');
    aiCompose.refinementHistory.push({
      prompt: aiCompose.refinementPrompt,
      result: aiCompose.draft
    });
    aiCompose.draft = d.draft;
    aiCompose.refinementPrompt = '';
    aiCompose.refining = false;
    aiCompose.previewHtml = null;
    renderAiComposeModal();
    // Re-render the preview with the new draft
    window.__aiRefreshPreview();
  } catch (e) {
    aiCompose.refining = false;
    alert('Refinement failed: ' + e.message);
    renderAiComposeModal();
  }
};

window.__emailComposeAiSave = async function() {
  if (!aiCompose.draft) return;
  if (aiCompose.draft.validationErrors && aiCompose.draft.validationErrors.length > 0) {
    alert('Please fix the validation errors before saving.');
    return;
  }
  aiCompose.saving = true;
  var btn = document.getElementById('ai-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
  try {
    var cleanSections = (aiCompose.draft.sections || []).map(function(s) {
      var copy = { type: s.type, props: {} };
      Object.keys(s.props || {}).forEach(function(k) {
        if (k.indexOf('__') !== 0) copy.props[k] = s.props[k];
      });
      return copy;
    });
    var r = await fetch('/api/email-compose', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        subject: aiCompose.draft.subject,
        previewText: aiCompose.draft.previewText,
        sectionsJson: JSON.stringify(cleanSections),
        audience: aiCompose.audience,
        status: 'Draft',
        source: 'ai-composer'
      })
    });
    var d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || 'Save failed');
    // Capture the saved email's record ID so the Send test button can enable.
    // The composer stays open so the user can fire a test, or close manually.
    aiCompose.savedEmailId = d.emailId || d.id || d.recordId || null;
    aiCompose.saving = false;
    console.log('[EMAIL-COMPOSE] saved as draft, emailId=', aiCompose.savedEmailId);
    if (typeof loadEmails === 'function') loadEmails();
    // Re-render so the Send test button enables and the Save label updates.
    renderAiComposeModal();
    // Brief confirmation toast so the user knows the save actually happened.
    if (typeof showEmailToast === 'function') {
      showEmailToast('Saved as draft', 'success');
    }
  } catch (e) {
    aiCompose.saving = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Save as draft'; }
    alert('Could not save: ' + e.message);
  }
};

// STAGE C — PER-SLOT IMAGE GENERATION (regular builder)
// ════════════════════════════════════════════════════════════════════
//
// The existing aiCompose modal already has image generation (now ported
// to v2 above). This block adds the same capability to the REGULAR
// builder — every imageUrl/image_url field across hero, hero-image,
// feature-story, destination-grid cards, two-column cells, lead-story,
// trip-card, and the new generated-image section.
//
// The flow:
//   1. User clicks Generate next to an image field
//   2. Modal opens, prefilled from the section's existing copy
//   3. User edits facts/headline/subhead, clicks Generate image
//   4. Job registers in emailState.imageJobs, fetch fires
//   5. Modal can be closed; the job continues
//   6. On success, URL drops into the field; toast appears
//
// All Stage B endpoint contract terms documented in stage-c-handover.md.

// ── helpers ─────────────────────────────────────────────────────────

// Does this field key look like an image url?
// Matches: imageUrl, image_url, logoUrl, logo_url, heroImage, pinterest_image_url
window.isImageFieldKey = function(key) {
  if (!key || typeof key !== 'string') return false;
  var lower = key.toLowerCase();
  // Trailing-segment match so left.imageUrl and cards.0.image_url both qualify
  var segments = lower.split('.');
  var last = segments[segments.length - 1];
  // Numeric array indices: look one segment further left
  if (/^\d+$/.test(last) && segments.length >= 2) last = segments[segments.length - 2] + '.' + last;
  return /(^|_|\.)image(_)?url$/.test(last)
      || /(^|_|\.)logo(_)?url$/.test(last)
      || /heroimage$/.test(last)
      || /pinterest_image_url$/.test(last)
      || /^image_url$/.test(last)
      || /^imageurl$/.test(last)
      // image-duo: image_one_url and image_two_url (and future image_N_url variants)
      || /^image_(one|two|three|four|five|[0-9]+)_url$/.test(last);
};
// Function-style alias for the inline isImageFieldKey() call in renderField
function isImageFieldKey(k) { return window.isImageFieldKey(k); }

// Look up the active image job for a given (sectionId, fieldPath)
window.getActiveImageJob = function(sectionId, fieldPath) {
  if (!emailState.imageJobs) return null;
  var jobs = Object.values(emailState.imageJobs);
  for (var i = 0; i < jobs.length; i++) {
    var j = jobs[i];
    if (j.sectionId === sectionId && j.fieldPath === fieldPath && (j.status === 'pending' || j.status === 'running')) {
      return j;
    }
  }
  return null;
};
function getActiveImageJob(sectionId, fieldPath) { return window.getActiveImageJob(sectionId, fieldPath); }

// Pick a sensible v2 slot from a section type + field path
function pickDefaultSlot(sectionType, fieldPath) {
  if (!sectionType) return 'hero';
  // Inside a destination-grid card or two-column cell, use card slot
  if (fieldPath && /cards\.\d+/.test(fieldPath)) return 'card';
  if (fieldPath && /(^|\.)(left|right)\./.test(fieldPath)) return 'card-square';
  switch (sectionType) {
    case 'hero': return 'hero';
    case 'hero-image': return 'hero';
    case 'feature-story': return 'feature-story';
    case 'destination-grid': return 'card';
    case 'lead-story': return 'hero';
    case 'trip-card': return 'banner';
    case 'generated-image': return 'hero';
    case 'two-column': return 'card-square';
    default: return 'hero';
  }
}

// Pick a sensible v2 sectionType from the email section type
function pickDefaultV2SectionType(sectionType) {
  switch (sectionType) {
    case 'hero': return 'hero';
    case 'hero-image': return 'hero';
    case 'feature-story': return 'feature-card';
    case 'destination-grid': return 'destination-spotlight';
    case 'lead-story': return 'hero';
    case 'trip-card': return 'other';
    case 'generated-image': return 'product-mockup';
    case 'two-column': return 'feature-card';
    case 'pulse-stats': return 'data-card';
    default: return 'other';
  }
}

// Extract context from a section to prefill the modal. Handles nested
// paths like left.imageUrl by reading sibling fields on the same nesting
// level (left.headline, left.body).
function extractSectionContext(section, fieldPath) {
  var props = section.props || {};

  // Walk down to the immediate parent of the field, then read siblings.
  var pathParts = fieldPath.split('.');
  pathParts.pop(); // drop the imageUrl segment
  var parent = props;
  for (var i = 0; i < pathParts.length; i++) {
    if (parent && typeof parent === 'object') parent = parent[pathParts[i]];
  }
  if (!parent || typeof parent !== 'object') parent = props;

  return {
    headline: parent.headline || parent.title || parent.body_title || parent.name || props.headline || props.title || '',
    subhead:  parent.subhead || parent.deck || parent.lede || parent.meta || props.subhead || props.deck || props.lede || '',
    bodyText: parent.body || parent.excerpt || parent.text || props.body || props.excerpt || '',
    cta:      (parent.cta && parent.cta.text) || parent.ctaText || (props.cta && props.cta.text) || props.ctaText || '',
  };
}

// ── open the modal ──────────────────────────────────────────────────

window.__imageGenerateOpen = function(sectionId, fieldPath) {
  var section = (emailState.builderSections || []).find(function(s) { return s.id === sectionId; });
  if (!section) return;

  // Prefill inputs from the section's existing copy
  var ctx = extractSectionContext(section, fieldPath);
  imgModal.open = true;
  imgModal.sectionId = sectionId;
  imgModal.fieldPath = fieldPath;
  imgModal.jobId = null;
  imgModal.submitting = false;
  imgModal.inputs = {
    sectionType: pickDefaultV2SectionType(section.type),
    slot: pickDefaultSlot(section.type, fieldPath),
    headline: ctx.headline,
    subhead: ctx.subhead,
    bodyText: ctx.bodyText,
    facts: '',
    cta: ctx.cta,
  };
  renderImageGenerateModal();
};

window.__imageGenerateClose = function() {
  // If a job is running, closing the modal does NOT cancel it. The job
  // continues and the URL will land in the field when ready.
  imgModal.open = false;
  var bd = document.getElementById('tg-img-gen-backdrop');
  if (bd) bd.remove();
};

window.__imageGenerateUpdateInput = function(key, value) {
  imgModal.inputs[key] = value;
};

// ── submit ──────────────────────────────────────────────────────────

window.__imageGenerateSubmit = async function() {
  if (!imgModal.sectionId || !imgModal.fieldPath) return;
  if (imgModal.submitting) return;
  if (!state.profile || !state.profile.id) { alert('No tenant context.'); return; }

  // Parse facts: one per line, trimmed, non-empty
  var factsArr = (imgModal.inputs.facts || '')
    .split('\n')
    .map(function(s) { return s.trim(); })
    .filter(function(s) { return s.length > 0; });

  // Build sectionContent with ONLY non-empty fields. The v2 pipeline
  // gives best output when given clean inputs — empty strings in
  // subhead/bodyText/cta confuse the brief generator into producing
  // padding text that ends up baked into the image.
  var sectionContent = {};
  var hl = (imgModal.inputs.headline || '').trim();
  var sh = (imgModal.inputs.subhead || '').trim();
  var bt = (imgModal.inputs.bodyText || '').trim();
  var cta = (imgModal.inputs.cta || '').trim();
  if (hl) sectionContent.headline = hl;
  if (sh) sectionContent.subhead = sh;
  if (bt) sectionContent.bodyText = bt;
  if (cta) sectionContent.cta = cta;
  if (factsArr.length > 0) sectionContent.facts = factsArr;

  // Register the job
  var jobId = 'job-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  var job = {
    jobId: jobId,
    sectionId: imgModal.sectionId,
    fieldPath: imgModal.fieldPath,
    status: 'running',
    startedAt: Date.now(),
    elapsedSec: 0,
    briefInputs: {
      sectionType: imgModal.inputs.sectionType,
      slot: imgModal.inputs.slot,
      sectionContent: sectionContent,
    },
    result: null,
    error: null,
  };
  emailState.imageJobs[jobId] = job;
  imgModal.jobId = jobId;
  imgModal.submitting = true;
  startImageJobTicker();
  renderImageGenerateModal();
  // Also refresh the properties form so the field shows the Generating pill
  refreshSectionFieldsInDOM(imgModal.sectionId);

  try {
    var r = await fetch('/api/image-generate-v2', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tenantId: state.profile.id,
        sectionType: imgModal.inputs.sectionType,
        sectionContent: sectionContent,
        slot: imgModal.inputs.slot,
        source: 'composer',
        outputContext: 'email',
      }),
    });
    var d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));

    // Apply the URL to the field
    applyGeneratedUrlToField(job.sectionId, job.fieldPath, d.pngUrl, d);
    job.status = 'done';
    job.result = d;
    showImageJobToast('Image ready for ' + summariseFieldPath(job.fieldPath));
  } catch (e) {
    job.status = 'error';
    job.error = e && e.message ? e.message : String(e);
  } finally {
    imgModal.submitting = false;
    // If the modal is still showing this job, re-render to show result/error.
    if (imgModal.open && imgModal.jobId === jobId) renderImageGenerateModal();
    // Always refresh the field on the underlying form
    refreshSectionFieldsInDOM(job.sectionId);
    // Clean up: drop the job after a short delay so the spinner can settle
    setTimeout(function() {
      if (emailState.imageJobs[jobId] && (emailState.imageJobs[jobId].status === 'done' || emailState.imageJobs[jobId].status === 'error')) {
        delete emailState.imageJobs[jobId];
        refreshSectionFieldsInDOM(job.sectionId);
      }
    }, 1500);
  }
};

// Apply a generated image URL to the section's field path. Also stores
// _briefSpec on the section if it's a generated-image section so the
// user can regenerate later from the same inputs.
function applyGeneratedUrlToField(sectionId, fieldPath, url, v2Response) {
  var section = (emailState.builderSections || []).find(function(s) { return s.id === sectionId; });
  if (!section) return;
  if (!section.props) section.props = {};
  setNestedValue(section.props, fieldPath, url);

  // For generated-image sections, mirror width/height + stash _briefSpec
  if (section.type === 'generated-image') {
    if (v2Response && v2Response.width) section.props.width = String(v2Response.width);
    if (v2Response && v2Response.height) section.props.height = String(v2Response.height);
    var job = imgModal.jobId ? emailState.imageJobs[imgModal.jobId] : null;
    if (job && job.briefInputs) {
      section.props._briefSpec = {
        sectionType: job.briefInputs.sectionType,
        sectionContent: job.briefInputs.sectionContent,
        slot: job.briefInputs.slot,
      };
    }
  }
  updateSectionSummaryInDOM(sectionId);
  if (typeof window.__builderPreviewDebounced === 'function') {
    window.__builderPreviewDebounced();
  }
}

// Re-render the properties form for a section. The original Stage C
// implementation tried to do surgical DOM updates here, which corrupted
// the right panel and broke subsequent section selection. The simple
// drawEmails() redraw is what every other state change does and it
// works; properties panels don't typically scroll so we lose nothing.
function refreshSectionFieldsInDOM(sectionId) {
  if (typeof drawEmails === 'function') drawEmails();
}

// Short label for a field path, used in toasts
function summariseFieldPath(fp) {
  if (!fp) return 'image';
  var parts = fp.split('.');
  if (parts.length === 1) return parts[0];
  // cards.0.image_url -> 'card 1 image'
  if (parts[0] === 'cards' && /^\d+$/.test(parts[1])) {
    return 'card ' + (parseInt(parts[1], 10) + 1);
  }
  if (parts[0] === 'left') return 'left column';
  if (parts[0] === 'right') return 'right column';
  return parts[0];
}

// ── modal render ────────────────────────────────────────────────────

function renderImageGenerateModal() {
  var existing = document.getElementById('tg-img-gen-backdrop');
  if (existing) existing.remove();
  if (!imgModal.open) return;

  var bd = document.createElement('div');
  bd.id = 'tg-img-gen-backdrop';
  bd.className = 'tg-img-gen-backdrop';
  bd.setAttribute('role', 'dialog');
  bd.setAttribute('aria-modal', 'true');
  bd.setAttribute('aria-labelledby', 'tg-img-gen-title');
  bd.addEventListener('click', function(e) { if (e.target === bd) window.__imageGenerateClose(); });

  var modal = document.createElement('div');
  modal.className = 'tg-img-gen-modal';
  modal.setAttribute('tabindex', '-1');

  var job = imgModal.jobId ? emailState.imageJobs[imgModal.jobId] : null;
  var inProgress = job && (job.status === 'running' || job.status === 'pending');
  var resultDone = job && job.status === 'done';
  var resultError = job && job.status === 'error';

  // Header
  var header = '';
  header += '<div class="tg-img-gen-header">';
  header += '<h3 id="tg-img-gen-title" class="tg-img-gen-title">';
  if (inProgress) header += 'Generating image\u2026';
  else if (resultDone) header += 'Image ready';
  else if (resultError) header += 'Generation failed';
  else header += 'Generate image';
  header += '</h3>';
  header += '<button type="button" class="tg-img-gen-close" aria-label="Close" onclick="window.__imageGenerateClose()">';
  header += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  header += '</button>';
  header += '</div>';

  var body = '<div class="tg-img-gen-body">';

  if (inProgress) {
    // Progress view
    var elapsed = job ? Math.round((Date.now() - job.startedAt) / 1000) : 0;
    var stage1Done = elapsed > 15;
    var stage2Done = elapsed > 90;
    body += '<p style="font-size:13px;color:var(--tg-text-secondary);margin:0 0 14px">Usually takes 90 to 120 seconds. You can close this and keep editing. The image will drop in when ready.</p>';
    body += '<div class="tg-img-gen-progress">';
    body += '<div class="tg-img-gen-step ' + (stage1Done ? 'is-done' : 'is-active') + '"><div class="tg-img-gen-step-icon"></div><span>Writing the brief</span><span class="tg-img-gen-elapsed">' + elapsed + 's</span></div>';
    body += '<div class="tg-img-gen-step ' + (stage2Done ? 'is-done' : (stage1Done ? 'is-active' : '')) + '"><div class="tg-img-gen-step-icon"></div><span>Rendering the design</span></div>';
    body += '<div class="tg-img-gen-step ' + (stage2Done ? 'is-active' : '') + '"><div class="tg-img-gen-step-icon"></div><span>Uploading</span></div>';
    body += '</div>';
  } else if (resultDone) {
    body += '<div style="text-align:center"><img src="' + esc(job.result.pngUrl) + '" alt="Generated" style="max-width:100%;max-height:320px;border-radius:8px;border:1px solid var(--tg-border)"></div>';
    body += '<p style="font-size:12px;color:var(--tg-text-tertiary);text-align:center;margin:8px 0 0">URL applied to ' + esc(summariseFieldPath(job.fieldPath)) + '. Total ' + Math.round((job.result.totalMs || 0) / 1000) + 's.</p>';
  } else if (resultError) {
    body += '<div class="tg-img-gen-error"><strong>Could not generate:</strong> ' + esc(job.error || 'Unknown error') + '</div>';
    body += '<p style="font-size:13px;color:var(--tg-text-secondary);margin:0">Adjust the inputs below and try again, or close this modal and paste a URL manually.</p>';
    body += renderImageGenerateForm();
  } else {
    // Initial form
    body += renderImageGenerateForm();
  }

  body += '</div>';

  // Footer
  var footer = '<div class="tg-img-gen-footer">';
  if (inProgress) {
    footer += '<button type="button" class="tg-img-gen-btn tg-img-gen-btn-ghost" onclick="window.__imageGenerateClose()">Close, keep generating</button>';
  } else if (resultDone) {
    footer += '<button type="button" class="tg-img-gen-btn tg-img-gen-btn-primary" onclick="window.__imageGenerateClose()">Done</button>';
  } else if (resultError) {
    footer += '<button type="button" class="tg-img-gen-btn tg-img-gen-btn-ghost" onclick="window.__imageGenerateClose()">Cancel</button>';
    footer += '<button type="button" class="tg-img-gen-btn tg-img-gen-btn-primary" onclick="window.__imageGenerateSubmit()">Try again</button>';
  } else {
    footer += '<button type="button" class="tg-img-gen-btn tg-img-gen-btn-ghost" onclick="window.__imageGenerateClose()">Cancel</button>';
    footer += '<button type="button" class="tg-img-gen-btn tg-img-gen-btn-primary" onclick="window.__imageGenerateSubmit()">Generate image</button>';
  }
  footer += '</div>';

  modal.innerHTML = header + body + footer;
  bd.appendChild(modal);
  document.body.appendChild(bd);

  // Focus the headline input on initial open for keyboard users
  setTimeout(function() {
    if (!inProgress && !resultDone && !resultError) {
      var hl = document.getElementById('tg-img-gen-headline-input');
      if (hl) hl.focus();
    } else {
      modal.focus();
    }
  }, 50);
}

function renderImageGenerateForm() {

  var ctxLabel = section ? (sectionMeta(section.type).label || section.type) : 'section';
  var fpLabel = summariseFieldPath(imgModal.fieldPath);

  h += '<div style="padding:10px 12px;background:var(--tg-bg-secondary);border-radius:6px;font-size:12px;color:var(--tg-text-secondary);margin-bottom:14px">';

  // the slot canvas — a wide hero with only a headline becomes a tiny
  // centred block on lots of white space. Count substantive inputs.

  var slot = imgModal.inputs.slot;

  h += '<select id="tg-img-gen-slot" class="tg-img-gen-select" onchange="window.__imageGenerateUpdateInput(\'slot\', this.value);window.__imageGenerateRerenderForm()">';
  V2_SLOTS.forEach(function(opt) {
    h += '<option value="' + opt.value + '"' + (imgModal.inputs.slot === opt.value ? ' selected' : '') + '>' + esc(opt.label) + '</option>';
  });
  h += '</select>';

  h += '<label class="tg-img-gen-label" for="tg-img-gen-facts-input">Facts to include (one per line)</label>';
  h += '<textarea id="tg-img-gen-facts-input" class="tg-img-gen-textarea" rows="4" placeholder="Spark \u00a3159/mo &#10;Boost \u00a3229/mo, most popular&#10;Ignite \u00a3299/mo" oninput="window.__imageGenerateUpdateInput(\'facts\', this.value);window.__imageGenerateRerenderForm()">' + esc(imgModal.inputs.facts) + '</textarea>';
  h += '<p class="tg-img-gen-help">These appear verbatim in the image. For wide slots, aim for 3+ facts so the design has enough to fill the canvas.</p>';
  h += '</div>';

  // Body text
  h += '<div class="tg-img-gen-field">';
  h += '<label class="tg-img-gen-label" for="tg-img-gen-body-input">Body text (optional)</label>';
  h += '<textarea id="tg-img-gen-body-input" class="tg-img-gen-textarea" rows="2" placeholder="Context for the design, not text that appears in the image" oninput="window.__imageGenerateUpdateInput(\'bodyText\', this.value);window.__imageGenerateRerenderForm()">' + esc(imgModal.inputs.bodyText) + '</textarea>';
  h += '</div>';

  // CTA
  h += '<div class="tg-img-gen-field">';
  h += '<label class="tg-img-gen-label" for="tg-img-gen-cta-input">CTA label (optional)</label>';
  h += '<input id="tg-img-gen-cta-input" type="text" class="tg-img-gen-input" value="' + esc(imgModal.inputs.cta) + '" oninput="window.__imageGenerateUpdateInput(\'cta\', this.value)" placeholder="See full pricing">';
  h += '</div>';

  return h;
}

// The nudge banner is reactive — it appears/disappears as the user types.
// But we can't rerender the whole modal on every keystroke (would steal
// focus). Instead, debounce a tiny refresh of just the warning area.
var __imgFormRerenderTimer = null;
window.__imageGenerateRerenderForm = function() {
  if (__imgFormRerenderTimer) clearTimeout(__imgFormRerenderTimer);
  __imgFormRerenderTimer = setTimeout(function() {
    // Just update the nudge banner area, not the whole form, so inputs
    // keep focus and don't lose cursor position.
    updateBriefNudgeBanner();
  }, 400);
};

function updateBriefNudgeBanner() {
  if (!imgModal.open || imgModal.submitting) return;
  var modal = document.querySelector('.tg-img-gen-modal');
  if (!modal) return;
  var body = modal.querySelector('.tg-img-gen-body');
  if (!body) return;

  // Compute the same input count as the form renderer
  var inputCount = 0;
  var hl = (imgModal.inputs.headline || '').trim();
  var sh = (imgModal.inputs.subhead || '').trim();
  var bt = (imgModal.inputs.bodyText || '').trim();
  var factsArr = (imgModal.inputs.facts || '').split('\n').map(function(s){return s.trim();}).filter(function(s){return s.length > 0;});
  if (hl.length > 3) inputCount++;
  if (sh.length > 3) inputCount++;
  if (bt.length > 10) inputCount++;
  if (factsArr.length >= 2) inputCount += 2;
  else if (factsArr.length === 1) inputCount++;
  var slot = imgModal.inputs.slot;
  var isWideSlot = (slot === 'hero' || slot === 'hero-tall' || slot === 'feature-story' || slot === 'banner' || slot === 'wide');

  // Remove any existing nudge
  var existing = body.querySelector('[data-stage-c-nudge]');
  if (existing) existing.remove();

  var newNudge = null;
  if (inputCount < 2 && isWideSlot) {
    newNudge = document.createElement('div');
    newNudge.setAttribute('data-stage-c-nudge', '1');
    newNudge.style.cssText = 'padding:10px 12px;background:rgba(245,158,11,0.10);border:1px solid rgba(245,158,11,0.35);border-radius:6px;font-size:12px;color:#92400E;margin-bottom:14px;line-height:1.5';
    newNudge.innerHTML = '<strong>Thin brief, wide slot.</strong> You\u2019ve picked a ' + esc(slot) + ' slot (wide layout) but only filled one field. The generator will produce a small centred block on a mostly-empty canvas. Add 2 or 3 facts, or fill in the subhead and body text, so the design has enough to fill the frame.';
  } else if (inputCount === 0) {
    newNudge = document.createElement('div');
    newNudge.setAttribute('data-stage-c-nudge', '1');
    newNudge.style.cssText = 'padding:10px 12px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.30);border-radius:6px;font-size:12px;color:var(--tg-error,#EF4444);margin-bottom:14px;line-height:1.5';
    newNudge.innerHTML = '<strong>Empty brief.</strong> Add at least a headline or one fact before generating.';
  }

  if (newNudge) {
    // Insert just before the first .tg-img-gen-field or grid row
    var firstField = body.querySelector('.tg-img-gen-field, [style*="grid-template-columns"]');
    if (firstField) {
      body.insertBefore(newNudge, firstField);
    } else {
      body.appendChild(newNudge);
    }
  }
}

// ── job ticker ──────────────────────────────────────────────────────
// Updates elapsed seconds on every running job once per second so the
// "Generating 12s" pill on the field and the progress stages in the
// modal stay current. Stops itself when no jobs are running.

var __imageJobTicker = null;
function startImageJobTicker() {
  if (__imageJobTicker) return;
  __imageJobTicker = setInterval(function() {
    var anyRunning = false;
    Object.keys(emailState.imageJobs || {}).forEach(function(jobId) {
      var j = emailState.imageJobs[jobId];
      if (j && (j.status === 'running' || j.status === 'pending')) {
        j.elapsedSec = Math.round((Date.now() - j.startedAt) / 1000);
        anyRunning = true;
        // Update the elapsed indicator on the field pill, cheaply
        updateImageJobFieldPill(j);
      }
    });
    // Update modal progress steps if open
    if (imgModal.open && imgModal.jobId && emailState.imageJobs[imgModal.jobId]
        && (emailState.imageJobs[imgModal.jobId].status === 'running' || emailState.imageJobs[imgModal.jobId].status === 'pending')) {
      renderImageGenerateModal();
    }
    if (!anyRunning) {
      clearInterval(__imageJobTicker);
      __imageJobTicker = null;
    }
  }, 1000);
}

// Surgical DOM update for a running job's pill — avoids re-rendering the
// whole properties form on every tick (which would steal focus).
function updateImageJobFieldPill(job) {
  // Match by section-id + path on the .email-builder-img-gen-btn-running.
  // We re-find the button each tick because re-renders may have happened.
  var btns = document.querySelectorAll('.email-builder-img-gen-btn-running');
  for (var i = 0; i < btns.length; i++) {
    var label = btns[i].querySelector('.email-builder-img-gen-label');
    if (label) label.textContent = 'Generating ' + job.elapsedSec + 's';
  }
}

// ── toast ───────────────────────────────────────────────────────────

function showImageJobToast(message) {
  // Diagnostic: log every time the toast fires. Easy to disable later.
  if (window.console && console.log) console.log('[stage-c] toast:', message);
  var t = document.createElement('div');
  // Match the existing app's toast convention: bottom-centre, z-index 9999.
  // This is where all other toasts in the app appear (see showEvtToast etc).
  // The top-right placement of the previous version was being missed by users
  // because nothing else in the app uses that location.
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#059669;color:#fff;padding:14px 22px 14px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 12px 32px rgba(5,150,105,0.35),0 4px 12px rgba(0,0,0,0.12);max-width:420px;opacity:0;transition:opacity 0.25s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);display:flex;align-items:center;gap:10px;font-family:var(--tg-font-body,inherit)';
  t.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg><span>' + esc(message) + '</span>';
  document.body.appendChild(t);
  // Tiny delay lets the browser commit the initial style before the transition fires
  setTimeout(function() {
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
  }, 10);
  setTimeout(function() {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 350);
  }, 5000);
}
// Exposed on window so it can be tested from DevTools Console.
window.__stageCTestToast = showImageJobToast;

// ── ESC key + focus trap ────────────────────────────────────────────

document.addEventListener('keydown', function(e) {
  if (e.key !== 'Escape') return;
  if (imgModal.open) {
    e.preventDefault();
    window.__imageGenerateClose();
  }
});

// ════════════════════════════════════════════════════════════════════
// END STAGE C
// ════════════════════════════════════════════════════════════════════


})();
</script>
