.scene-timeline { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
.scene-timeline-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255,255,255,0.05); border-left: 3px solid var(--tg-accent); border-radius: 6px; }
.scene-timeline-date { font-size: 10px; font-weight: 700; color: var(--tg-accent-light); font-family: var(--tg-font-mono); white-space: nowrap; }
.scene-timeline-event { font-size: 12px; color: #fff; flex: 1; }
.scene-timeline-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: rgba(0,180,216,0.2); color: var(--tg-accent-light); font-weight: 600; }

.scene-lead { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-lg); padding: var(--space-4); width: 100%; max-width: 360px; }
.scene-lead-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.scene-lead-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #ec4899, #8b5cf6); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
.scene-lead-name { font-size: 13px; font-weight: 600; color: #fff; }
.scene-lead-meta { font-size: 10px; color: rgba(255,255,255,0.5); font-family: var(--tg-font-mono); }
.scene-lead-quote { font-size: 12px; color: rgba(255,255,255,0.85); line-height: 1.5; padding: 10px; background: rgba(255,255,255,0.03); border-left: 2px solid var(--tg-accent); border-radius: 4px; margin-bottom: 10px; }
.scene-lead-reply { padding: 10px; background: rgba(0,180,216,0.1); border: 1px solid rgba(0,180,216,0.25); border-radius: 6px; font-size: 11px; color: rgba(255,255,255,0.9); line-height: 1.5; }
.scene-lead-reply-label { font-size: 9px; font-weight: 700; color: var(--tg-accent-light); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; font-family: var(--tg-font-mono); }
.scene-lead-score { display: inline-block; padding: 3px 8px; border-radius: 10px; background: rgba(16,185,129,0.18); color: #6EE7B7; font-size: 10px; font-weight: 700; font-family: var(--tg-font-mono); margin-left: auto; }

.scene-email-stack { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); width: 100%; max-width: 380px; }
.scene-email-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); padding: var(--space-3); }
.scene-email-bar { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
.scene-email-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tg-accent); }
.scene-email-line { height: 6px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 5px; }
.scene-email-line.short { width: 60%; }
.scene-email-line.med { width: 85%; }
.scene-email-stat { font-size: 18px; font-weight: 700; color: var(--tg-accent-light); margin-bottom: 2px; font-family: var(--tg-font-mono); }
.scene-email-stat-lbl { font-size: 9px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; font-family: var(--tg-font-mono); }

.scene-payoff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); width: 100%; max-width: 380px; }
.scene-payoff-card { padding: var(--space-4); background: linear-gradient(135deg, rgba(0,180,216,0.08), rgba(0,180,216,0.02)); border: 1px solid rgba(0,180,216,0.2); border-radius: var(--radius-lg); text-align: center; }
.scene-payoff-num { font-size: 28px; font-weight: 800; color: var(--tg-accent-light); font-family: var(--tg-font-mono); line-height: 1; margin-bottom: 4px; letter-spacing: -1px; }
.scene-payoff-lbl { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 500; }
.scene-payoff-sub { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 4px; font-family: var(--tg-font-mono); }

.scene-closing { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--space-8); }
.scene-closing-mark { width: 72px; height: 72px; margin: 0 auto var(--space-5); border-radius: 50%; background: linear-gradient(135deg, var(--tg-accent), var(--tg-accent-dark)); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(0,180,216,0.4); }

.showcase-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-6);
  border-top: 1px solid rgba(255,255,255,0.06);
  gap: var(--space-3);
  flex-shrink: 0;
}

.showcase-dots { display: flex; gap: 6px; }
.showcase-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: none; cursor: pointer;
  padding: 0;
  transition: all var(--duration-fast);
}
.showcase-dot:hover { background: rgba(255,255,255,0.3); }
.showcase-dot.active { background: var(--tg-accent); width: 24px; border-radius: 4px; }
.showcase-dot.visited { background: rgba(0,180,216,0.4); }

.showcase-nav { display: flex; gap: var(--space-2); }
.showcase-btn {
  height: 38px; padding: 0 16px;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.85);
  font-size: var(--text-sm); font-weight: 600;
  font-family: var(--tg-font-body);
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all var(--duration-fast);
}
.showcase-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.25); }
.showcase-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.showcase-btn.primary { background: var(--tg-accent); border-color: var(--tg-accent); color: #fff; }
.showcase-btn.primary:hover { background: var(--tg-accent-light); border-color: var(--tg-accent-light); }

@media (max-width: 768px) {
  .showcase-modal { height: 100vh; max-height: 100vh; border-radius: 0; }
  .showcase-headline { font-size: 22px; }
  .showcase-body { font-size: 14px; }
}

/* ═══ EMAIL BUILDER — three-panel section editor ═══ */

.email-builder-topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-3);
}
.email-builder-topbar-right { display: flex; gap: 8px; }
.email-builder-btn {
  height: 38px; padding: 0 18px;
  border-radius: var(--radius-md);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  font-family: var(--tg-font-body);
  transition: all var(--duration-fast);
  border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: 6px;
}
.email-builder-btn-ghost {
  background: transparent;
  border-color: var(--tg-border);
  color: var(--tg-text-secondary);
}
.email-builder-btn-ghost:hover { border-color: var(--tg-text-tertiary); color: var(--tg-text-primary); }
.email-builder-btn-primary { background: var(--tg-accent); color: #fff; }
.email-builder-btn-primary:hover { background: var(--tg-accent-light); }
.email-builder-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

/* Metadata strip */
.email-builder-metastrip {
  display: flex; gap: 12px; flex-wrap: wrap;
  background: var(--tg-bg-primary);
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 12px;
  align-items: flex-end;
}
.email-builder-meta-field { flex: 1 1 200px; min-width: 0; }
.email-builder-meta-label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--tg-text-tertiary);
  text-transform: uppercase; letter-spacing: 0.6px;
  margin-bottom: 4px; font-family: var(--tg-font-mono);
}
.email-builder-input {
  width: 100%; height: 36px; padding: 0 10px;
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-sm);
  font-family: var(--tg-font-body); font-size: 13px;
  background: var(--tg-bg-primary);
  color: var(--tg-text-primary);
  transition: border-color var(--duration-fast);
}
.email-builder-input:focus { border-color: var(--tg-accent); outline: none; }
textarea.email-builder-input { padding: 8px 10px; height: auto; line-height: 1.5; resize: vertical; min-height: 60px; }
select.email-builder-input { cursor: pointer; }

.email-builder-recipient-strip {
  display: flex; align-items: center;
  background: var(--tg-bg-secondary);
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  margin-bottom: 16px;
  flex-wrap: wrap; gap: 8px;
}

/* Three panels */
.email-builder-panels {
  display: grid;
  grid-template-columns: 280px 320px 1fr;
  gap: 12px;
  height: calc(100vh - 360px);
  min-height: 540px;
}
.email-builder-left, .email-builder-middle, .email-builder-right {
  background: var(--tg-bg-primary);
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-md);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.email-builder-panel-header {
  padding: 12px 16px;
  font-size: 11px; font-weight: 700;
  color: var(--tg-text-tertiary);
  text-transform: uppercase; letter-spacing: 0.6px;
  font-family: var(--tg-font-mono);
  border-bottom: 1px solid var(--tg-border);
  flex-shrink: 0;
}

/* Section list */
/* Section list — always visible, scrolls internally if many sections */
.email-builder-section-list {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 8px;
  min-height: 120px;
}
.email-builder-empty {
  padding: 24px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--tg-text-tertiary);
}
.email-builder-section-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--duration-fast);
  margin-bottom: 4px;
  border: 1px solid transparent;
}
.email-builder-section-row:hover { background: var(--tg-bg-secondary); }
.email-builder-section-row.active {
  background: rgba(0,180,216,0.08);
  border-color: rgba(0,180,216,0.3);
}
.email-builder-section-row.drop-target-above { box-shadow: 0 -2px 0 var(--tg-accent); }
.email-builder-section-row.drop-target-below { box-shadow: 0 2px 0 var(--tg-accent); }
.email-builder-section-handle {
  flex-shrink: 0;
  color: var(--tg-text-tertiary);
  cursor: grab;
  padding: 4px;
  display: flex; align-items: center;
}
.email-builder-section-handle:active { cursor: grabbing; }
.email-builder-section-info { flex: 1; min-width: 0; }
.email-builder-section-type {
  font-size: 13px; font-weight: 600;
  color: var(--tg-text-primary);
  margin-bottom: 2px;
}
.email-builder-section-summary {
  font-size: 11px;
  color: var(--tg-text-tertiary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--tg-font-mono);
}
.email-builder-section-delete {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 4px;
  background: transparent;
  border: none;
  color: var(--tg-text-tertiary);
  cursor: pointer;
  opacity: 0.5;
  transition: all var(--duration-fast);
  display: flex; align-items: center; justify-content: center;
}
.email-builder-section-row:hover .email-builder-section-delete { opacity: 1; }
.email-builder-section-delete:hover { background: rgba(239,68,68,0.1); color: var(--tg-error); }

/* Add section panel — capped at 45% of the left column so the
   section list above it always remains visible. Scrolls internally
   when there are many section types (48+). */
.email-builder-add-section {
  border-top: 1px solid var(--tg-border);
  padding: 8px 12px 12px;
  flex-shrink: 1;
  max-height: 45%;
  overflow-y: auto;
  background: var(--tg-bg-secondary);
}
.email-builder-add-section .email-builder-panel-header {
  background: transparent; border: none;
  padding: 8px 4px; margin-bottom: 4px;
}
.email-builder-section-types {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.email-builder-section-type-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 6px;
  background: var(--tg-bg-primary);
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--tg-font-body);
  font-size: 11px; font-weight: 500;
  color: var(--tg-text-secondary);
  transition: all var(--duration-fast);
}
.email-builder-section-type-btn:hover {
  border-color: var(--tg-accent);
  color: var(--tg-accent-dark);
  background: rgba(0,180,216,0.04);
}

/* Properties panel */
.email-builder-properties {
  flex: 1; overflow-y: auto;
}
.email-builder-prop-header {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--tg-border);
}
.email-builder-prop-title {
  font-size: 14px; font-weight: 700;
  color: var(--tg-text-primary);
  margin-bottom: 2px;
}
.email-builder-prop-desc {
  font-size: 12px;
  color: var(--tg-text-tertiary);
}
.email-builder-prop-fields { padding: 14px 16px; }
.email-builder-prop-field { margin-bottom: 14px; }
.email-builder-prop-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--tg-text-secondary);
  margin-bottom: 4px;
}
.email-builder-prop-input {
  width: 100%; height: 34px; padding: 0 10px;
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-sm);
  font-family: var(--tg-font-body); font-size: 13px;
  background: var(--tg-bg-primary);
  color: var(--tg-text-primary);
  transition: border-color var(--duration-fast);
}
.email-builder-prop-input:focus { border-color: var(--tg-accent); outline: none; }
textarea.email-builder-prop-input { padding: 8px 10px; height: auto; line-height: 1.5; resize: vertical; min-height: 70px; }
select.email-builder-prop-input { cursor: pointer; height: 34px; }
.email-builder-prop-checkbox {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--tg-text-secondary);
  cursor: pointer; user-select: none;
}
.email-builder-prop-checkbox input { cursor: pointer; }

/* ── Group (object) field: nested set of fields with a thin left rule ─── */
.email-builder-prop-group {
  margin-bottom: 14px;
  padding: 10px 12px 4px 12px;
  background: var(--tg-bg-secondary, #F8FAFC);
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-sm);
}
.email-builder-prop-group-label {
  font-size: 11px; font-weight: 700;
  color: var(--tg-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0 0 8px 0;
}
.email-builder-prop-group-body { }
.email-builder-prop-group-body .email-builder-prop-field { margin-bottom: 10px; }
.email-builder-prop-group-body .email-builder-prop-field:last-child { margin-bottom: 0; }

/* ── Array field: list of repeating items with add button ────────────── */
.email-builder-prop-array {
  margin-bottom: 14px;
  padding: 10px 12px 12px 12px;
  background: var(--tg-bg-secondary, #F8FAFC);
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-sm);
}
.email-builder-prop-array-label {
  font-size: 11px; font-weight: 700;
  color: var(--tg-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0 0 8px 0;
}
.email-builder-prop-array-meta {
  font-weight: 500;
  color: var(--tg-text-tertiary);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
}
.email-builder-prop-array-empty {
  font-size: 12px;
  color: var(--tg-text-tertiary);
  font-style: italic;
  padding: 8px 0 12px 0;
}
.email-builder-prop-array-item {
  background: var(--tg-bg-primary);
  border: 1px solid var(--tg-border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  overflow: hidden;
}
.email-builder-prop-array-item-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px;
  background: var(--tg-bg-tertiary, #F1F5F9);
  border-bottom: 1px solid var(--tg-border);
}
.email-builder-prop-array-item-num {
  font-size: 11px; font-weight: 700;
  color: var(--tg-text-secondary);
}
.email-builder-prop-array-item-actions {
  display: flex; gap: 4px;
}
.email-builder-prop-array-btn {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid var(--tg-border);
  border-radius: 4px;
  font-size: 13px;
  color: var(--tg-text-secondary);
  cursor: pointer;
  transition: all var(--duration-fast);
  padding: 0;
}
.email-builder-prop-array-btn:hover:not(:disabled) {
  background: var(--tg-bg-primary);
  border-color: var(--tg-accent);
  color: var(--tg-accent);
}
.email-builder-prop-array-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.email-builder-prop-array-btn-remove:hover:not(:disabled) {
  border-color: var(--tg-error, #dc2626);
  color: var(--tg-error, #dc2626);
}
.email-builder-prop-array-item-body {
  padding: 10px 12px;
}
.email-builder-prop-array-item-body .email-builder-prop-field { margin-bottom: 10px; }
.email-builder-prop-array-item-body .email-builder-prop-field:last-child { margin-bottom: 0; }
.email-builder-prop-array-add {
  width: 100%;
  padding: 7px 12px;
  background: var(--tg-bg-primary);
  border: 1px dashed var(--tg-border);
  border-radius: var(--radius-sm);
  font-family: var(--tg-font-body); font-size: 12px; font-weight: 600;
  color: var(--tg-text-secondary);
  cursor: pointer;
  transition: all var(--duration-fast);
}
.email-builder-prop-array-add:hover {
  border-color: var(--tg-accent);
  border-style: solid;
  color: var(--tg-accent);
  background: var(--tg-bg-primary);
}

/* ── Offer filter editor ─────────────────────────────────────── */
.of-editor { display: flex; flex-direction: column; gap: 12px; }
.of-loading { padding: 12px; color: var(--tg-text-tertiary); font-size: 13px; font-style: italic; }
.of-row { display: flex; flex-direction: column; gap: 4px; }
.of-label { font-size: 11px; font-weight: 700; color: var(--tg-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
.of-input {
  width: 100%; min-height: 34px; padding: 0 10px;
  border: 1px solid var(--tg-border); border-radius: var(--radius-sm);
  font-family: var(--tg-font-body); font-size: 13px;
  background: var(--tg-bg-primary); color: var(--tg-text-primary);
  transition: border-color var(--duration-fast);
}
.of-input:focus { border-color: var(--tg-accent); outline: none; }
select.of-input { cursor: pointer; height: 34px; }
.of-help { font-size: 11px; color: var(--tg-text-tertiary); line-height: 1.4; margin-top: 2px; }

.of-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.of-chips {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 6px;
  border: 1px solid var(--tg-border); border-radius: var(--radius-sm);
  background: var(--tg-bg-primary); min-height: 36px;
  cursor: text;
}
.of-chips:focus-within { border-color: var(--tg-accent); }
.of-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 4px 3px 10px; border-radius: 999px;

.tg-img-gen-elapsed {

/* Banner shown at the top of the AI compose modal when Luna flagged

.tg-img-needs-banner {

(function(){
'use strict';
var SK='luna_client_session',TK='luna_client_theme',MAX=4*3600000;
var state={profile:null,posts:[],allPosts:[],selected:{},calOff:0,theme:'light',dragPid:null,postImage:{},postsFilter:'Queued'};
// Travelgenix's own client record. Only this account sees the admin
// sub-tabs inside Events. Everyone else just sees the standard view.
var OWNER_CLIENT_ID = 'recFXQY7be6gMr4In';
function isOwner() { return state.profile && state.profile.id === OWNER_CLIENT_ID; }
// Admin sub-tab state — only ever populated when isOwner() is true.
// events-admin uses the SSO cookie directly (credentials: 'include'),
// so we no longer capture/forward an email + code pair.
var evtAdminState = { tab: 'all', adminEvents: [], adminFilter: 'pending', loading: false };
var $=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// Theme — light default per design skill
try{state.theme=localStorage.getItem(TK)||'light'}catch(e){}
function applyTheme(){document.body.setAttribute('data-theme',state.theme);$('sunIcon').classList.toggle('hide',state.theme==='light');$('moonIcon').classList.toggle('hide',state.theme!=='light')}
applyTheme();
$('themeBtn').onclick=function(){state.theme=state.theme==='light'?'dark':'light';try{localStorage.setItem(TK,state.theme)}catch(e){}applyTheme()};

// Logout — uses the unified gate to clear SSO cookie and bounce to signin.
$('logoutBtn').onclick=function(){if(window.tgAuth&&window.tgAuth.signOut){window.tgAuth.signOut()}else{window.location.href='https://id.travelify.io/signin.html'}};

// Auth — wait for tg-auth-gate.js to confirm the SSO session, then call our
// /api/auth-session to look up which Luna Marketing client this user owns.
window.addEventListener('tg-auth-ready',async function(){
  try{
    var r=await fetch('/api/auth-session',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||'Sign in failed');
    if(!d.profile){
      // Multiple candidates — should be rare. Take the first by default.
      if(d.candidates&&d.candidates.length){
        var pick=await fetch('/api/auth-session',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:d.candidates[0].id})});
        d=await pick.json();
        if(!pick.ok||!d.profile)throw new Error(d.error||'Could not load client');

    document.body.innerHTML='<div style="font-family:system-ui;max-width:520px;margin:80px auto;padding:32px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 6px rgba(0,0,0,.06)"><h1 style="font-size:20px;margin:0 0 12px;color:#0F172A">Could not load your portal</h1><p style="color:#64748B;line-height:1.5;margin:0 0 24px">'+e.message+'</p><a href="https://id.travelify.io" style="display:inline-block;padding:10px 20px;background:#00B4D8;color:#fff;text-decoration:none;border-radius:8px;font-weight:600">Back to Apps</a></div>';
  }
});

// Resolve the best image URL for a given post + platform.
// Looks up the platform's preferred bucket field (e.g. image_url_landscape
// for Facebook), then falls back to the legacy image_url field if that
// bucket isn't populated. This keeps old posts working while letting new
// per-platform-generated posts show the right image per tab.
function getImageForPost(p, pl) {
  if (!p || !pl) return '';
  if (pl.vid) return p[pl.img] || '';
  var bucketField = pl.img;
  return p[bucketField] || p.image_url || '';
}

// Map a post's target_channel to the platform key(s) it should display.
// Returns null when there's no specific channel set — caller should fall
// back to "show every populated caption" (legacy multi-channel behaviour).
var CHANNEL_TO_PLAT_KEYS = {
  'LinkedIn Personal': ['linkedin'],
  'LinkedIn Company': ['linkedin'],
  'Facebook': ['facebook'],
  'Instagram': ['instagram'],
  'Twitter/X': ['twitter'],
  'Twitter': ['twitter'],
  'Pinterest': ['pinterest'],
  'TikTok': ['tiktok'],
  'Google Business Profile': ['gbp'],
  'GBP': ['gbp']
};
function platformKeysForPost(p) {
  if (!p) return null;
  var ch = p.target_channel;
  if (ch && CHANNEL_TO_PLAT_KEYS[ch]) return CHANNEL_TO_PLAT_KEYS[ch];
  return null; // fall back to legacy behaviour
}
function shouldShowPlat(p, platKey) {
  var keys = platformKeysForPost(p);
  if (keys) return keys.indexOf(platKey) !== -1;
  // legacy: show whichever captions are populated
  var cap = p['caption_' + platKey] || '';
  return !!cap.trim();
}

// SOCIAL POST IMAGE CONTROLS
// Generate (Stage B HTML) / Photo (Replicate) / Stock (Pexels)
// Mirrors the email composer's image pipeline but flatter:
//  - No briefs object (we build a brief at call-time from caption + dest)
//  - No anti-pattern validator (short prompts, not user-authored)
//  - Per-post transient state stored in state.postImage[pid]
//  - Aspect ratio derived from the active platform tab on the card
// ─────────────────────────────────────────────────────────────────

// Map a platform's CSS aspect-ratio string to an image-generate-v2 slot.
// Each branch is the platform's preferred aspect for AI-generated imagery.
// All produced images satisfy Instagram's 1.91:1–4:5 envelope (the strictest
// social platform) so a single image can also be safely cross-published.
function postImagePlatToSlot(ratioStr) {
  if (!ratioStr) return 'hero-square';        // safest universal default
  if (ratioStr === '1/1') return 'hero-square';     // 1:1  — Instagram, universal
  if (ratioStr === '16/9') return 'hero-wide';      // 16:9 — X / Twitter
  if (ratioStr === '2/3' || ratioStr === '9/16') return 'hero-tall'; // 2:3 — Pinterest / TikTok (portrait)
  return 'hero';                              // 1.91:1 — Facebook / LinkedIn / GBP
}

// Resolve the currently-active platform key on a post card from the DOM.
function postImageActivePlatKey(pid, post) {
  var card = document.getElementById('cp-' + pid);
  if (card) {
    var activeTab = card.querySelector('.plat-tab.active');
    if (activeTab) {
      var onclick = activeTab.getAttribute('onclick') || '';
      var m = onclick.match(/'[^']*-([a-z]+)'/);
      if (m && m[1]) return m[1];
    }
  }
  for (var i = 0; i < PLATS.length; i++) {
    if (post && post['caption_' + PLATS[i].key]) return PLATS[i].key;
  }
  return 'instagram';
}

// Build a short on-brand brief from caption + destination + pillar.
function postImageBuildBrief(post, platKey, mode) {
  var caption = (post['caption_' + platKey] || post.caption_facebook || post.caption_instagram || '').trim();
  var captionSnip = caption.slice(0, 240).replace(/\s+/g, ' ');
  var dest = (post.destination || '').trim();
  var pillar = (post.content_pillar || '').trim();
  var contentType = (post.content_type || '').trim();
  var parts = [];
  if (mode === 'photo') {
    parts.push('Photoreal travel marketing image.');
  } else {
    parts.push('On-brand social media visual for a ' + (contentType || 'travel') + ' post.');
  }
  if (dest) parts.push('Destination: ' + dest + '.');
  if (pillar) parts.push('Theme: ' + pillar + '.');
  if (captionSnip) parts.push('Post angle: ' + captionSnip);
  return parts.join(' ');
}

// Per-second ticker that advances stage classes on any post currently generating.
var __postImageTickerHandle = null;
function schedulePostImageTickerIfNeeded() {
  if (__postImageTickerHandle) return;
  __postImageTickerHandle = setInterval(function() {
    var anyLoading = false;
    Object.keys(state.postImage || {}).forEach(function(pid) {
      var s = state.postImage[pid];
      if (!s || !s.loading) return;
      anyLoading = true;
      var elapsedSec = Math.round((Date.now() - (s.startedAt || Date.now())) / 1000);
      var elapsedEl = document.getElementById('post-img-elapsed-' + pid);
      if (elapsedEl) elapsedEl.textContent = elapsedSec + 's';
      var progressEl = document.getElementById('post-img-progress-' + pid);
      if (!progressEl) return;
      var fast = s.mode === 'photo';
      var stage1Done = fast ? elapsedSec > 5 : elapsedSec > 15;
      var stage2Done = fast ? elapsedSec > 20 : elapsedSec > 90;
      var steps = progressEl.querySelectorAll('[data-stage]');
      steps.forEach(function(stepEl) {
        var stage = stepEl.getAttribute('data-stage');
        var active = false, done = false;
        if (stage === '1') { active = !stage1Done; done = stage1Done; }
        else if (stage === '2') { active = stage1Done && !stage2Done; done = stage2Done; }
        else if (stage === '3') { active = stage2Done; done = false; }
        stepEl.style.background = done ? 'rgba(16,185,129,0.12)' : (active ? 'rgba(0,180,216,0.1)' : 'var(--tg-bg-secondary)');
        stepEl.style.color = done ? '#059669' : (active ? 'var(--tg-text-secondary)' : 'var(--tg-text-tertiary)');
      });
    });
    if (!anyLoading) {
      clearInterval(__postImageTickerHandle);
      __postImageTickerHandle = null;
    }
  }, 1000);
}

async function loadPosts(){
  if(!state.profile)return;
  try{
    var r=await fetch('/api/posts');
    var d=await r.json();
    if(!d.success&&!d.posts)throw new Error(d.error||'Failed to load posts');
    state.allPosts=(d.posts||[]).filter(function(p){return p.client_id===state.profile.id});
    state.posts=state.allPosts.filter(function(p){return p.status===state.postsFilter});
    state.selected={};
    renderStats();
    renderPosts();
    // Top-nav badge counts ONLY Queued (awaiting review), regardless of which sub-tab is open
    var queuedCount=state.allPosts.filter(function(p){return p.status==='Queued'}).length;
    var badge=$('postsTab').querySelector('.tab-badge');
    if(!badge){badge=document.createElement('span');badge.className='tab-badge';$('postsTab').appendChild(badge)}
    badge.textContent=queuedCount;
    badge.style.display=queuedCount>0?'inline':'none';
    $('postsTab').classList.toggle('has-badge',queuedCount>0);
  }catch(e){
    $('view-posts').innerHTML='<div class="card" style="text-align:center;padding:var(--space-10);color:var(--tg-error)">'+e.message+'</div>';
  }
}

/* ── CALENDAR ── */
var CAL_S=6,CAL_E=22,CAL_H=60;var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function getWeek(off){var n=new Date();var d=n.getDay();var mo=1-d+(d===0?-6:0);var m=new Date(n);m.setDate(n.getDate()+mo+off*7);var ds=[];for(var i=0;i<7;i++){var x=new Date(m);x.setDate(m.getDate()+i);ds.push(x)}return ds}
function isToday(d){var n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}
function pad2(n){return n<10?'0'+n:''+n}function timeTop(h,m){return((h-CAL_S)+m/60)*CAL_H}function parseTime(t){var p=(t||'09:00').split(':');return{h:parseInt(p[0])||9,m:parseInt(p[1])||0}}
function matchDay(p,di){var days=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];return(p.title||'').toLowerCase().includes(days[di])}
function stClass(s){s=(s||'').toLowerCase();return s==='approved'?'cal-status-approved':s==='rejected'||s==='replaced'?'cal-status-rejected':s==='suppressed'?'cal-status-suppressed':'cal-status-queued'}

var EVT_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var EVT_CAT_COLORS={'Sporting Event':'#3B82F6','Cultural Festival':'#8B5CF6','Religious Festival':'#F59E0B','Public Holiday':'#10B981','School Holiday':'#EC4899','Awareness Day':'#6366F1','Music Festival':'#EF4444','Food & Drink':'#F97316','Major Anniversary':'#14B8A6','Conference/Expo':'#64748B'};
var evtState={events:[],filter:'all',postedIds:[],selected:{}};
function evtDate(d){if(!d)return'';var p=d.split('-');return parseInt(p[2])+' '+EVT_MONTHS[parseInt(p[1])-1].substring(0,3)}
function evtDay(d){return d?parseInt(d.split('-')[2]):''}
function evtMon(d){return d?EVT_MONTHS[parseInt(d.split('-')[1])-1].substring(0,3).toUpperCase():''}
function evtMonthYear(d){if(!d)return'';var p=d.split('-');return EVT_MONTHS[parseInt(p[1])-1]+' '+p[0]}
function evtImpact(i){if(!i)return['minor','Awareness'];if(i.includes('Major'))return['major','Drives Bookings'];if(i.includes('Moderate'))return['mod','Content Hook'];return['minor','Awareness']}

// Event delegation for filters, toggles, checkboxes, and generate buttons
document.addEventListener('click',function(e){
  var fb=e.target.closest('[data-evt-filter]');
  if(fb){evtState.filter=fb.getAttribute('data-evt-filter');drawEventsClient();return}
  var tb=e.target.closest('[data-evt-toggle]');
  if(tb){var id=tb.getAttribute('data-evt-toggle');var card=document.getElementById('evt-'+id);if(card)card.classList.toggle('evt-open');return}
  var gb=e.target.closest('[data-evt-generate]');
  if(gb){var eid=gb.getAttribute('data-evt-generate');generateEventPosts([eid]);return}
  var batch=e.target.closest('#evtBatchGenerate');
  if(batch){var ids=Object.keys(evtState.selected).filter(function(k){return evtState.selected[k]});if(ids.length)generateEventPosts(ids);return}
});
document.addEventListener('change',function(e){
  if(e.target.matches('.evt-checkbox')){
    var id=e.target.getAttribute('data-evt-check');
    evtState.selected[id]=e.target.checked;
    updateBatchBar();
  }
});

function updateBatchBar(){
  var bar=document.getElementById('evtBatchBar');
  if(!bar)return;
  var count=Object.keys(evtState.selected).filter(function(k){return evtState.selected[k]}).length;
  bar.style.display=count>0?'flex':'none';
  var label=document.getElementById('evtBatchCount');
  if(label)label.textContent=count+' event'+(count!==1?'s':'')+' selected';
}

async function generateEventPosts(eventIds){
  // Show generating state
  eventIds.forEach(function(id){
    var btn=document.querySelector('[data-evt-generate="'+id+'"]');
    if(btn){btn.textContent='Generating...';btn.style.opacity='0.6';btn.style.pointerEvents='none'}
  });
  var bar=document.getElementById('evtBatchGenerate');
  if(bar){bar.textContent='Generating...';bar.style.opacity='0.6'}

  try{
    var res=await fetch('/api/event-post',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'generate',clientId:state.profile.id,eventIds:eventIds})
    });
    var d=await res.json();
    if(!d.success)throw new Error(d.error);

    // Update posted IDs and refresh
    d.results.forEach(function(r){
      if(r.status==='created'&&evtState.postedIds.indexOf(r.eventId)===-1)evtState.postedIds.push(r.eventId);
    });
    evtState.selected={};

    // Show success toast
    var msg=d.generated+' post'+(d.generated!==1?'s':'')+' created';
    if(d.skipped>0)msg+=' ('+d.skipped+' already posted)';
    showEvtToast(msg,'success');
    loadPosts(); // Refresh My Posts so the new post appears

    drawEventsClient();
  }catch(err){
    showEvtToast('Error: '+err.message,'error');
    eventIds.forEach(function(id){
      var btn=document.querySelector('[data-evt-generate="'+id+'"]');
      if(btn){btn.textContent='Create Post';btn.style.opacity='1';btn.style.pointerEvents='auto'}
    });
    if(bar){bar.textContent='Generate Posts for Selected';bar.style.opacity='1'}
  }
}

function showEvtToast(msg,type){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;animation:fadeIn 0.3s;font-family:var(--tg-font-body);box-shadow:0 8px 24px rgba(0,0,0,0.15);';
  t.style.background=type==='success'?'#059669':'#DC2626';
  t.style.color='#fff';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove()},300)},3000);
}

async function renderEventsView(){
  var el=$('view-events');
  el.innerHTML='<div style="text-align:center;padding:40px;color:var(--tg-text-tertiary)">Loading events...</div>';
  try{
    var res=await fetch('/api/events?months=12');var d=await res.json();if(!d.success)throw new Error(d.error);evtState.events=d.events;
    // Fetch posted event IDs
    var pr=await fetch('/api/event-post?action=posted&clientId='+state.profile.id);var pd=await pr.json();

// Top-level wrapper that renders the appropriate sub-tab content

// Sub-tab switcher — wires up the buttons rendered above
document.addEventListener('click',function(e){

    var res=await fetch('/api/events-admin',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'list',status:evtAdminState.adminFilter})

    var d=await res.json();
    if(!d.success)throw new Error(d.error||'Failed to load');
    evtAdminState.adminEvents=d.events||[];

      target.innerHTML='<div style="text-align:center;padding:40px;color:var(--tg-error);font-size:13px">Could not load: '+esc(e.message)+'</div>';
    }
  }
}

// Render the AI verification panel for a single event card. Returns HTML string.
function renderVerificationPanel(e){
  var conf=(e.verificationConfidence||'').toLowerCase();
  var palette={
    high:      {bg:'rgba(16,185,129,0.08)',  bd:'rgba(16,185,129,0.25)', fg:'#059669', label:'High confidence'},
    medium:    {bg:'rgba(245,158,11,0.08)',  bd:'rgba(245,158,11,0.25)', fg:'#B45309', label:'Medium confidence'},
    low:       {bg:'rgba(249,115,22,0.08)',  bd:'rgba(249,115,22,0.25)', fg:'#C2410C', label:'Low confidence'},
    not_found: {bg:'rgba(239,68,68,0.08)',   bd:'rgba(239,68,68,0.25)',  fg:'#DC2626', label:'Not found'}
  };
  var p=palette[conf]||palette.low;

  var notes=e.verificationNotes||'';
  // Parse notes structure: lines until "Sources:" are summary; after are sources
  var parsed=parseVerificationNotes(notes);

  var icon=conf==='high'
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
    : conf==='not_found'
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

  var h='';
  h+='<div style="margin-bottom:14px;background:'+p.bg+';border:1px solid '+p.bd+';border-radius:8px;padding:12px 14px">';

  // Header row: badge + summary action
  h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">';
  h+='<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:11px;background:'+p.fg+';color:#fff;font-size:11px;font-weight:600">'+icon+esc(p.label)+'</span>';
  if(parsed.recommendedAction){
    var actionLabel={approve:'Auto-approved',update_dates:'Dates corrected & approved',reject:'Auto-rejected',manual_review:'Needs your review'}[parsed.recommendedAction]||parsed.recommendedAction;
    h+='<span style="font-size:11px;color:'+p.fg+';font-weight:600">'+esc(actionLabel)+'</span>';
  }
  if(parsed.verifiedDateStart&&parsed.datesMatch===false){
    var range=parsed.verifiedDateStart;
    if(parsed.verifiedDateEnd&&parsed.verifiedDateEnd!==parsed.verifiedDateStart){
      range+=' to '+parsed.verifiedDateEnd;
    }
    h+='<span style="font-size:11px;color:var(--tg-text-secondary);font-variant-numeric:tabular-nums">Verifier suggests: <strong style="color:var(--tg-text-primary)">'+esc(range)+'</strong></span>';
  }
  h+='</div>';

  // Summary text
  if(parsed.summary){
    h+='<div style="font-size:12px;color:var(--tg-text-primary);line-height:1.55;margin-bottom:'+(parsed.sources.length?'10px':'0')+'">'+esc(parsed.summary)+'</div>';
  }

  // Sources (collapsed by default)
  if(parsed.sources.length){
    h+='<details style="margin-top:6px"><summary style="cursor:pointer;font-size:11px;font-weight:600;color:'+p.fg+';list-style:none;display:inline-flex;align-items:center;gap:4px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:transform 0.15s"><polyline points="9 18 15 12 9 6"/></svg>'+parsed.sources.length+' source'+(parsed.sources.length===1?'':'s')+' cited</summary>';
    h+='<div style="margin-top:8px;padding-top:8px;border-top:1px dashed '+p.bd+';font-size:11px;line-height:1.6">';
    parsed.sources.forEach(function(s,i){
      h+='<div style="margin-bottom:6px"><span style="color:var(--tg-text-tertiary)">'+(i+1)+'.</span> ';
      if(s.url){
        h+='<a href="'+esc(s.url)+'" target="_blank" rel="noopener" style="color:'+p.fg+';font-weight:500;text-decoration:none">'+esc(s.publisher||s.url)+'</a>';
      }else{
        h+='<span style="color:var(--tg-text-primary);font-weight:500">'+esc(s.publisher||'Unknown')+'</span>';
      }
      if(s.claim){
        h+='<div style="margin-left:14px;margin-top:2px;color:var(--tg-text-secondary)">'+esc(s.claim)+'</div>';
      }
      h+='</div>';
    });
    h+='</div></details>';
  }

  h+='</div>';
  return h;
}

// Parse the structured Verification Notes block written by events-verify-batch.
// Format follows buildNotesText() in that file. This is a forgiving parser —
// missing pieces fall back to defaults.
function parseVerificationNotes(notes){
  var out={summary:'',sources:[],recommendedAction:'',datesMatch:null,verifiedDateStart:'',verifiedDateEnd:''};
  if(!notes)return out;
  // Header lines
  var headerMatch={};
  notes.split('\n').slice(0,6).forEach(function(line){
    var m=line.match(/^(Confidence|Dates match stored|Verified start|Verified end|Action taken):\s*(.+)$/);
    if(m)headerMatch[m[1]]=m[2].trim();
  });
  out.recommendedAction=headerMatch['Action taken']||'';
  if(headerMatch['Dates match stored'])out.datesMatch=headerMatch['Dates match stored']==='yes';
  out.verifiedDateStart=headerMatch['Verified start']||'';
  out.verifiedDateEnd=headerMatch['Verified end']||'';

  // Summary block: between "Summary:" and "Sources:" (or end)
  var sumIdx=notes.indexOf('\nSummary:');
  var srcIdx=notes.indexOf('\nSources:');
  if(sumIdx>=0){
    var sumStart=sumIdx+'\nSummary:'.length;
    var sumEnd=srcIdx>=0?srcIdx:notes.length;
    out.summary=notes.slice(sumStart,sumEnd).trim();
  }

  // Sources block: each entry is "  N. Publisher — url" then "     Claim..."
  if(srcIdx>=0){
    var srcText=notes.slice(srcIdx+'\nSources:'.length).trim();
    var lines=srcText.split('\n');
    var current=null;
    lines.forEach(function(line){
      var m=line.match(/^\s*\d+\.\s+(.+?)(?:\s+—\s+(https?:\/\/\S+))?$/);
      if(m){
        if(current)out.sources.push(current);
        current={publisher:m[1].trim(),url:m[2]||'',claim:''};
      }else if(current){
        var t=line.trim();
        if(t)current.claim=(current.claim?current.claim+' ':'')+t;
      }
    });
    if(current)out.sources.push(current);
  }
  return out;
}

// Verify driver — chunked loop, polls /api/events-verify-batch until done.
// Updates the progress panel live, then renders a post-run summary.
var evtVerifyState={running:false,totals:{approve:0,update_dates:0,reject:0,manual_review:0,error:0,ok:0,errors:0,total:0}};
async function runVerifyBatch(force){
  if(evtVerifyState.running)return;
  evtVerifyState.running=true;
  evtVerifyState.totals={approve:0,update_dates:0,reject:0,manual_review:0,error:0,ok:0,errors:0,total:0};

  var startBtn=$('evt-verify-start');
  var rerunBtn=$('evt-verify-rerun');
  if(startBtn){startBtn.disabled=true;startBtn.textContent='Verifying...';}
  if(rerunBtn){rerunBtn.disabled=true;rerunBtn.style.opacity='0.5';}

  var prog=$('evt-verify-progress');
  if(prog){
    prog.style.display='block';
    prog.innerHTML='<div style="font-size:12px;color:var(--tg-text-secondary)">Starting verification — checking each event against authoritative web sources. This typically takes 8-12 seconds per event.</div>';
  }

  var processed=[];
  var safetyMax=40; // hard cap on chunk loops (40 × 5 = 200 events max)
  var loops=0;
  while(loops<safetyMax){
    loops++;
    try{
      var res=await fetch('/api/events-verify-batch',{
        method:'POST',
        credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chunk:3,force:force})
      });
      var d=await res.json();
      if(!d.success){
        if(prog)prog.innerHTML+='<div style="margin-top:8px;color:var(--tg-error);font-size:12px">Error: '+esc(d.error||'unknown')+'</div>';
        break;
      }
      (d.processed||[]).forEach(function(p){
        processed.push(p);
        var key=p.action||'manual_review';
        if(typeof evtVerifyState.totals[key]==='number'){evtVerifyState.totals[key]++;}
        if(p.action==='error'){evtVerifyState.totals.errors++;}else{evtVerifyState.totals.ok++;}
        evtVerifyState.totals.total++;
      });
      renderVerifyProgress(processed,d.remaining);
      if(d.done||(d.processed||[]).length===0)break;
    }catch(err){
      if(prog)prog.innerHTML+='<div style="margin-top:8px;color:var(--tg-error);font-size:12px">Network error: '+esc(err.message)+'</div>';
      break;
    }
  }

  evtVerifyState.running=false;
  renderVerifySummary(processed);
  // Note: we deliberately do NOT auto-reload the pending list here.
  // That would wipe the post-run summary the user just got. The summary
  // includes a "Refresh list" button which calls loadAdminEvents() on demand.
}

function renderVerifyProgress(processed,remaining){
  var prog=$('evt-verify-progress');if(!prog)return;
  var t=evtVerifyState.totals;
  var done=processed.length;
  var total=done+(remaining||0);
  var pct=total>0?Math.round((done/total)*100):0;
  var bar='<div style="height:6px;background:var(--tg-bg-tertiary);border-radius:3px;overflow:hidden;margin-bottom:10px"><div style="height:100%;background:var(--tg-accent);width:'+pct+'%;transition:width 0.3s"></div></div>';
  var statline='<div style="font-size:12px;color:var(--tg-text-secondary);margin-bottom:8px">'+done+' processed · '+(remaining||0)+' remaining · '+t.approve+' approved, '+t.update_dates+' date-corrected, '+t.reject+' rejected, '+t.manual_review+' flagged'+(t.errors?', '+t.errors+' errors':'')+'</div>';
  // Show last 5 results as a live ticker
  var recent=processed.slice(-5).reverse();
  var ticker='<div style="font-size:11px;color:var(--tg-text-tertiary);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.7">';
  recent.forEach(function(p){
    var icon='·';var color='var(--tg-text-tertiary)';
    if(p.action==='approve'){icon='✓';color='#16a34a';}
    else if(p.action==='update_dates'){icon='✎';color='#0891b2';}
    else if(p.action==='reject'){icon='✗';color='#dc2626';}
    else if(p.action==='manual_review'){icon='?';color='#ea580c';}
    else if(p.action==='error'){icon='!';color='#dc2626';}
    ticker+='<div><span style="color:'+color+';font-weight:600">'+icon+'</span> '+esc((p.name||'').slice(0,80))+' <span style="color:var(--tg-text-tertiary)">— '+esc(p.action||'')+(p.confidence?' ('+esc(p.confidence)+')':'')+'</span></div>';
  });
  ticker+='</div>';
  prog.innerHTML=bar+statline+ticker;
}

function renderVerifySummary(processed){
  var prog=$('evt-verify-progress');if(!prog)return;
  var t=evtVerifyState.totals;
  var groups={approve:[],update_dates:[],reject:[],manual_review:[],error:[]};
  processed.forEach(function(p){var k=p.action||'manual_review';if(groups[k])groups[k].push(p);});

  var h='<div style="margin-top:6px"><div style="font-size:13px;font-weight:600;color:var(--tg-text-primary);margin-bottom:8px">Verification complete</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px">';
  var tiles=[
    ['Approved',t.approve,'#16a34a'],
    ['Dates fixed',t.update_dates,'#0891b2'],
    ['Rejected',t.reject,'#dc2626'],
    ['For review',t.manual_review,'#ea580c'],
    ['Errors',t.errors,'#dc2626']
  ];
  tiles.forEach(function(tl){
    h+='<div style="padding:10px 12px;border:1px solid var(--tg-border);border-radius:8px;background:var(--tg-bg-secondary)"><div style="font-size:20px;font-weight:700;color:'+tl[2]+';line-height:1">'+tl[1]+'</div><div style="font-size:11px;color:var(--tg-text-tertiary);margin-top:4px">'+tl[0]+'</div></div>';
  });
  h+='</div>';

  // Detail accordions for non-empty non-approved buckets
  function bucket(label,key,colour,note){
    if(!groups[key]||!groups[key].length)return '';
    var s='<details style="margin-bottom:6px;border:1px solid var(--tg-border);border-radius:8px;background:var(--tg-bg-secondary)">';
    s+='<summary style="padding:10px 12px;cursor:pointer;font-size:12px;font-weight:600;color:'+colour+'">'+label+' ('+groups[key].length+')</summary>';
    s+='<div style="padding:0 12px 12px;font-size:11px;color:var(--tg-text-secondary);line-height:1.6">';
    if(note)s+='<div style="margin-bottom:8px;color:var(--tg-text-tertiary)">'+esc(note)+'</div>';
    groups[key].forEach(function(p){
      s+='<div style="padding:4px 0;border-bottom:1px dashed var(--tg-border)">';
      s+=esc(p.name||'(unnamed)');
      if(p.confidence)s+=' <span style="color:var(--tg-text-tertiary)">— '+esc(p.confidence)+'</span>';
      if(p.error)s+=' <span style="color:var(--tg-error)">— '+esc(p.error)+'</span>';
      s+='</div>';
    });
    s+='</div></details>';
    return s;
  }
  h+=bucket('Date corrected & approved','update_dates','#0891b2','Dates were updated to match authoritative sources, then auto-approved.');
  h+=bucket('Auto-rejected','reject','#dc2626','No credible sources found — these events likely don\'t exist as stored.');
  h+=bucket('Flagged for manual review','manual_review','#ea580c','Sources disagreed or only one source was found. Open the table to read the verification notes and decide.');
  h+=bucket('Errors','error','#dc2626','These events errored during verification. They\'ve been stamped so future runs skip them. Click "Re-verify all" to retry.');
  h+='<div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
  h+=  '<button id="evt-verify-refresh-list" style="height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--tg-accent);background:var(--tg-accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--tg-font-body)">Refresh pending list</button>';
  h+=  '<span style="font-size:11px;color:var(--tg-text-tertiary)">Auto-approved events are removed from this list once you refresh.</span>';
  h+='</div>';
  h+='</div>';
  prog.innerHTML=h;
}


async function handleAdminAction(action,id){
  // Local-only actions: just toggle the inline edit form, no API call
  if(action==='edit'){
    var editBox=document.querySelector('[data-edit-id="'+CSS.escape(id)+'"]');
    if(editBox){
      var isOpen=editBox.style.display!=='none';
      editBox.style.display=isOpen?'none':'block';
    }
    return;
  }
  if(action==='cancel-edit'){
    var box=document.querySelector('[data-edit-id="'+CSS.escape(id)+'"]');
    if(box)box.style.display='none';
    return;
  }
  if(action==='save-edit'){
    return saveEditedEvent(id);
  }

  if(action==='delete'){
    if(!confirm('Delete this event permanently? This cannot be undone.'))return;
  }
  var card=document.querySelector('.evt-admin-card[data-admin-id="'+CSS.escape(id)+'"]');
  if(card)card.classList.add('processing');

  try{
    var res=await fetch('/api/events-admin',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:action,id:id})
    });
    var d=await res.json();
    if(!d.success)throw new Error(d.error||'Failed');

    var verb=action==='approve'?'approved':action==='reject'?'rejected':'deleted';
    showEvtToast('Event '+verb,'success');

    if(card){
      card.classList.add('fade-out');
      setTimeout(function(){
        evtAdminState.adminEvents=evtAdminState.adminEvents.filter(function(x){return x.id!==id});
        drawEventsView();
      },280);
    }
  }catch(err){
    showEvtToast('Error: '+err.message,'error');
    if(card)card.classList.remove('processing');
  }
}

// Save inline edits to the event. Reads all data-edit-field inputs in the
// matching edit box, posts them to /api/events-admin action=update, then
// reflects the changes locally and re-renders so the card shows fresh values.
async function saveEditedEvent(id){
  var box=document.querySelector('[data-edit-id="'+CSS.escape(id)+'"]');
  if(!box)return;
  var statusEl=box.querySelector('[data-edit-status="'+CSS.escape(id)+'"]');

  var updates={};
  box.querySelectorAll('[data-edit-field]').forEach(function(input){
    updates[input.getAttribute('data-edit-field')]=input.value;
  });

  // Light client-side validation
  var dateRe=/^\d{4}-\d{2}-\d{2}$/;
  if(updates.dateStart&&!dateRe.test(updates.dateStart)){
    if(statusEl){statusEl.textContent='Start date must be YYYY-MM-DD';statusEl.style.color='var(--tg-error)';}
    return;
  }
  if(updates.dateEnd&&!dateRe.test(updates.dateEnd)){
    if(statusEl){statusEl.textContent='End date must be YYYY-MM-DD';statusEl.style.color='var(--tg-error)';}
    return;
  }

  if(statusEl){statusEl.textContent='Saving...';statusEl.style.color='var(--tg-text-tertiary)';}

  try{
    var res=await fetch('/api/events-admin',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'update',id:id,updates:updates})
    });
    var d=await res.json();
    if(!d.success)throw new Error(d.error||'Save failed');

    // Reflect changes in local state so the card re-renders with new values
    var idx=evtAdminState.adminEvents.findIndex(function(x){return x.id===id});
    if(idx>=0){
      Object.keys(updates).forEach(function(k){
        evtAdminState.adminEvents[idx][k]=updates[k];
      });
    }
    showEvtToast('Event updated','success');
    drawEventsView(); // closes the form via re-render
  }catch(err){
    if(statusEl){statusEl.textContent='Error: '+err.message;statusEl.style.color='var(--tg-error)';}
    showEvtToast('Error: '+err.message,'error');
  }
}
function renderCalendar(){

function renderPlatforms() {
  var el = $('view-platforms');
  var isB2B = (state.profile.client_type || '').toLowerCase() === 'b2b-saas';
  var hasPersonal = isB2B && state.profile.metricool_blog_id_personal;
  el.innerHTML = '<div style="text-align:center;padding:var(--space-8);color:var(--tg-text-tertiary)">Loading platform connections...</div>';

  function safeJson(r) {
    var ct = r.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      return r.text().then(function(t) { throw new Error('Non-JSON response (status ' + r.status + ')'); });
    }
    return r.json();
  }

  // Fetch company connections
  fetch('/api/connections', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'get_connection_url', clientId: state.profile.id })
  }).then(safeJson).then(function(companyData) {
    if (!companyData.success) { el.innerHTML = '<p style="color:var(--tg-error);padding:var(--space-4)">Error: ' + (companyData.error || 'Unknown') + '</p>'; return; }

    var personalPromise = hasPersonal ?
      fetch('/api/connections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_connection_url', clientId: state.profile.id, blogId: state.profile.metricool_blog_id_personal })
      }).then(safeJson).catch(function() { return { success: false }; }) :
      Promise.resolve(null);

    personalPromise.then(function(personalData) {
      var h = '';

      if (hasPersonal) {
        // ── B2B: Side-by-side layout ──
        h += '<div class="plat-grid-2col" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);margin-bottom:var(--space-6)">';

        // Company column
        h += '<div>';
        h += '<div style="margin-bottom:var(--space-4)"><h2 style="font-size:var(--text-lg);font-weight:700;color:var(--tg-text-primary);margin:0 0 var(--space-1)">Company Platforms</h2>';
        h += '<p style="font-size:var(--text-xs);color:var(--tg-text-tertiary);margin:0">Travelgenix brand page accounts</p></div>';
        h += renderPlatformList(companyData.connectedPlatforms || [], companyData.connectionUrl);
        h += '</div>';

        // Personal column
        h += '<div>';
        h += '<div style="margin-bottom:var(--space-4)"><h2 style="font-size:var(--text-lg);font-weight:700;color:var(--tg-text-primary);margin:0 0 var(--space-1)">Personal Platforms</h2>';
        h += '<p style="font-size:var(--text-xs);color:var(--tg-text-tertiary);margin:0">Andy Speight personal accounts</p></div>';
        if (personalData && personalData.success) {
          h += renderPlatformList(personalData.connectedPlatforms || [], personalData.connectionUrl);
        } else {
          h += '<div style="padding:var(--space-6);text-align:center;border:1px dashed var(--tg-border);border-radius:var(--radius-lg);color:var(--tg-text-tertiary);font-size:var(--text-sm)">Could not load personal connections</div>';
        }
        h += '</div>';

        h += '</div>'; // close grid

        // ── Duda Blog Connection ──
        h += '<div style="background:var(--tg-bg-primary);border:1px solid var(--tg-border);border-radius:var(--radius-lg);padding:var(--space-5);margin-bottom:var(--space-6)">';
        h += '<div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)">';
        h += '<div style="width:44px;height:44px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;background:rgba(59,130,246,0.08);flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg></div>';
        h += '<div style="flex:1"><div style="font-weight:600;font-size:var(--text-sm);color:var(--tg-text-primary)">Travelgenix Blog (Duda)</div>';
        h += '<div style="font-size:var(--text-xs);color:var(--tg-success)">Connected via API</div></div>';
        h += '<div style="width:10px;height:10px;border-radius:50%;background:var(--tg-success)"></div>';
        h += '</div>';
        h += '<p style="font-size:var(--text-xs);color:var(--tg-text-tertiary);margin:0;line-height:1.5">Luna publishes a weekly blog article directly to the Travelgenix website via the Duda API. Blog posts are generated alongside your social content and published as drafts for review.</p>';
        h += '</div>';

        // Responsive: stack on mobile (handled by platGridStyle)

      } else {
        // ── B2C: Single centred column ──
        h += '<div style="max-width:640px;margin:0 auto">';
        h += '<div style="margin-bottom:var(--space-6)"><h2 style="font-size:var(--text-lg);font-weight:700;color:var(--tg-text-primary);margin:0 0 var(--space-2)">Connected Platforms</h2>';
        h += '<p style="font-size:var(--text-sm);color:var(--tg-text-tertiary);margin:0">Connect your social media accounts so Luna can publish content directly to your channels.</p></div>';
        h += renderPlatformList(companyData.connectedPlatforms || [], companyData.connectionUrl);
        h += '</div>';
      }

      h += '<div style="margin-top:var(--space-4)"><button onclick="renderPlatforms()" style="height:44px;padding:0 var(--space-5);border-radius:var(--radius-md);border:1px solid var(--tg-border);background:var(--tg-bg-primary);color:var(--tg-text-secondary);font-weight:500;font-size:var(--text-sm);cursor:pointer;font-family:var(--tg-font-body)">Refresh Status</button></div>';

      el.innerHTML = h;
      // Inject responsive style once
      if (!document.getElementById('platGridStyle')) {
        var s = document.createElement('style');
        s.id = 'platGridStyle';
        s.textContent = '@media(max-width:768px){.plat-grid-2col{grid-template-columns:1fr !important}}';
        document.head.appendChild(s);
      }
    });
  }).catch(function(e) {
    el.innerHTML = '<p style="color:var(--tg-error);padding:var(--space-4)">Error loading platforms: ' + e.message + '</p>';
  });
}

function renderPlatformList(connected, connUrl) {
  var h = '<div style="display:flex;flex-direction:column;gap:var(--space-2)">';
  PLAT_INFO.forEach(function(p) {
    var isConn = connected.indexOf(p.key) !== -1;
    h += '<div style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border:1px solid var(--tg-border);border-radius:var(--radius-md);background:var(--tg-bg-primary)">';
    h += '<div style="width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:' + p.color + ';background:' + p.color + '10;flex-shrink:0">' + p.icon + '</div>';
    h += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:var(--text-sm);color:var(--tg-text-primary)">' + p.key + '</div>';
    h += isConn ? '<div style="font-size:var(--text-xs);color:var(--tg-success)">Connected</div>' : '<div style="font-size:var(--text-xs);color:var(--tg-text-tertiary)">Not connected</div>';
    h += '</div>';
    h += '<div style="width:8px;height:8px;border-radius:50%;background:' + (isConn ? 'var(--tg-success)' : 'var(--tg-text-tertiary)') + ';opacity:' + (isConn ? '1' : '0.3') + '"></div>';
    h += '</div>';
  });
  h += '</div>';
  if (connUrl) {
    h += '<div style="margin-top:var(--space-3)"><a href="' + connUrl + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:var(--space-2);height:36px;padding:0 var(--space-4);border-radius:var(--radius-md);background:var(--tg-accent);color:#fff;font-weight:600;font-size:var(--text-xs);text-decoration:none;font-family:var(--tg-font-body)">Connect / Manage</a></div>';
  }
  return h;
}

// Brand-kit text-style inputs. Saves to the C.setText handler on blur
// (not on every keystroke — text inputs would otherwise spam Airtable).
// type can be 'text'|'url'|'email'|'tel'. Returns a label + input + help.
function settingText(label,key,val,type,help,placeholder){
  var t=type||'text';
  var p=placeholder?(' placeholder="'+esc(placeholder)+'"'):'';
  return '<div style="margin-bottom:var(--space-4)">'
    +'<div class="input-label">'+esc(label)+'</div>'
    +'<input type="'+t+'" id="bk-'+key+'" value="'+esc(val||'')+'"'+p
    +' style="width:100%;font-family:inherit;font-size:var(--text-sm);height:36px;padding:0 var(--space-3);border-radius:var(--radius-sm);border:1px solid var(--tg-border);background:var(--tg-bg-primary);color:var(--tg-text-primary)"'

    +'</div>';
}

// Single-select dropdown — used for Brand Font. Saves on change.
function settingSelect(label,key,val,options){

// URL fields (social URLs etc) still use settingText.

    +'<button type="button" id="bk-'+key+'-btn" onclick="document.getElementById(\'bk-'+key+'-file\').click()"'
    +' style="display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:var(--text-sm);height:36px;padding:0 var(--space-3);border-radius:var(--radius-sm);border:1px solid var(--tg-border);background:var(--tg-bg-tertiary);color:var(--tg-text-primary);cursor:pointer;white-space:nowrap">'
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>'
    +'Upload</button>'
    +'</div>'
    +'<img id="bk-'+key+'-preview" src="'+esc(val||'')+'" alt="Logo preview" style="'+previewStyle+'" onerror="this.style.display=\'none\'">'
    +'<div id="bk-'+key+'-feedback" style="font-size:var(--text-xs);margin-top:var(--space-1);line-height:1.5;min-height:14px"></div>'
    +(help?'<div style="font-size:var(--text-xs);color:var(--tg-text-tertiary);margin-top:var(--space-1);line-height:1.5">'+help+'</div>':'')
    +'</div>';
}

  imgGenerate:async function(pid){
    var post=state.posts.find(function(p){return p.id===pid})||state.allPosts.find(function(p){return p.id===pid});
    if(!post){console.error('[POST-AI-GEN] post not found',pid);return}
    var platKey=postImageActivePlatKey(pid,post);
    var brief=postImageBuildBrief(post,platKey,'generate');
    // Generate ONE image per ratio bucket so every platform gets a properly-
    // composed graphic. 4 parallel calls; ~25-40s end-to-end matches a single
    // generation since they run concurrently.
    var BUCKETS=[
      {bucket:'landscape',slot:'hero',        field:'image_url_landscape', patch:'imageUrlLandscape'},
      {bucket:'square',   slot:'hero-square', field:'image_url_square',    patch:'imageUrlSquare'},
      {bucket:'wide',     slot:'hero-wide',   field:'image_url_wide',      patch:'imageUrlWide'},
      {bucket:'portrait', slot:'hero-tall',   field:'image_url_portrait',  patch:'imageUrlPortrait'}
    ];
    console.log('[POST-AI-GEN] pid=',pid,'starting',BUCKETS.length,'parallel generations');
    if(!state.postImage[pid])state.postImage[pid]={};
    state.postImage[pid].loading=true;
    state.postImage[pid].mode='generate';
    state.postImage[pid].error=null;
    state.postImage[pid].startedAt=Date.now();
    state.postImage[pid].stockOpen=false;
    state.postImage[pid].bucketsTotal=BUCKETS.length;
    state.postImage[pid].bucketsDone=0;
    renderPosts();
    schedulePostImageTickerIfNeeded();
    var results=await Promise.allSettled(BUCKETS.map(async function(b){
      var r=await fetch('/api/image-generate-v2',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        tenantId:state.profile.id,
        sectionType:'hero',
        slot:b.slot,
        briefOverride:brief,
        source:'composer',
        outputContext:'social'
      })});
      var d=await r.json();
      if(!r.ok||!d.ok)throw new Error(d.error||('Generation failed for '+b.bucket));
      // Persist this bucket's URL to its Airtable field
      var patchBody={recordId:pid};
      patchBody[b.patch]=d.pngUrl;
      await fetch('/api/posts',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patchBody)});
      // Update local state — same field name used by getImageForPost
      post[b.field]=d.pngUrl;
      var p2=state.posts.find(function(x){return x.id===pid});if(p2)p2[b.field]=d.pngUrl;
      var p3=state.allPosts.find(function(x){return x.id===pid});if(p3)p3[b.field]=d.pngUrl;
      state.postImage[pid].bucketsDone=(state.postImage[pid].bucketsDone||0)+1;
      return {bucket:b.bucket,url:d.pngUrl};
    }));
    var succeeded=results.filter(function(x){return x.status==='fulfilled'});
    var failed=results.filter(function(x){return x.status==='rejected'});
    if(failed.length){
      console.error('[POST-AI-GEN] '+failed.length+'/'+BUCKETS.length+' bucket(s) failed:',failed.map(function(x){return x.reason&&x.reason.message}));
    }
    state.postImage[pid].loading=false;
    state.postImage[pid].mode=null;
    if(succeeded.length===0){
      state.postImage[pid].error=(failed[0]&&failed[0].reason&&failed[0].reason.message)||'Generation failed';
    }else if(failed.length){
      state.postImage[pid].error=failed.length+' of '+BUCKETS.length+' image variants failed — others succeeded';
    }else{
      state.postImage[pid].error=null;
    }
    renderPosts();
  },

  // Cloudinary upload using an unsigned upload preset. Browser POSTs the
  // file directly to Cloudinary (no Vercel roundtrip, no 4.5MB limit, no
  // signature dance). The preset "luna-marketing-logos" is configured in
  // the Cloudinary dashboard with the size/format restrictions.
  uploadLogo:async function(key,fileInput){
    var file=fileInput.files&&fileInput.files[0];
    if(!file)return;
    var fb=document.getElementById('bk-'+key+'-feedback');
    var btn=document.getElementById('bk-'+key+'-btn');
    var input=document.getElementById('bk-'+key);
    function setFeedback(msg,color){if(fb){fb.textContent=msg;fb.style.color=color||'var(--tg-text-tertiary)'}}
    function setBusy(busy){if(btn){btn.disabled=busy;btn.style.opacity=busy?'0.6':'1';btn.style.cursor=busy?'wait':'pointer'}}

    // Validate locally — Cloudinary doesn't enforce types on unsigned uploads
    // unless the preset is configured to, so the browser is our only line.
    var allowedTypes=['image/png','image/jpeg','image/jpg','image/svg+xml','image/webp'];
    if(allowedTypes.indexOf(file.type)===-1){
      setFeedback('File type not supported. Use PNG, JPG, SVG, or WebP.','var(--tg-error)');
      fileInput.value='';return;
    }
    var maxBytes=5*1024*1024;
    if(file.size>maxBytes){
      setFeedback('File is too large ('+(file.size/1024/1024).toFixed(1)+'MB). Max 5MB.','var(--tg-error)');
      fileInput.value='';return;
    }

    setBusy(true);
    setFeedback('Uploading to Cloudinary…');

    // Unsigned upload — browser POSTs directly to Cloudinary with just the
    // preset name. No signature, no server roundtrip. The preset
    // ("luna-marketing-logos") is configured in the Cloudinary dashboard
    // with restrictions (allowed formats, max size, folder). Public id
    // is deterministic per (client × field) so re-uploads overwrite.
    var CLOUD_NAME='diivxkrcz';
    var UPLOAD_PRESET='luna-marketing-logos';
    var fieldSlug={logo_url:'logo',logo_dark_url:'logo-dark',logo_mark_url:'logo-mark'}[key];
    var publicId='luna-marketing/'+state.profile.id+'/'+fieldSlug;

    try{
      var fd=new FormData();
      fd.append('file',file);
      fd.append('upload_preset',UPLOAD_PRESET);
      fd.append('public_id',publicId);
      var upRes=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload',{method:'POST',body:fd});
      var up=await upRes.json();
      if(!upRes.ok||up.error)throw new Error((up.error&&up.error.message)||'Cloudinary rejected the upload');

      // Drop the URL into the field and fire the existing save handler.
      var url=up.secure_url;
      input.value=url;
      C.setText(key,url);
      C.updateLogoPreview(key,url);
      setFeedback('✓ Uploaded','var(--tg-success)');
      setTimeout(function(){setFeedback('')},4000);
    }catch(e){
      console.error('uploadLogo error:',e);
      setFeedback('Upload failed: '+e.message,'var(--tg-error)');
    }finally{
      setBusy(false);
      fileInput.value='';  // allow re-selecting the same file
    }
  },

  addDest:function(){var d=prompt('Enter destination name:');if(!d||!d.trim())return;d=d.trim();var ds=(state.profile.destinations||'').split(',').map(function(x){return x.trim()}).filter(Boolean);if(ds.indexOf(d)===-1)ds.push(d);state.profile.destinations=ds.join(', ');save({destinations:ds.join(', ')});renderSettings()},
  setFreq:function(n,btn){btn.parentElement.querySelectorAll('.ps-btn').forEach(function(p){p.classList.remove('active')});btn.classList.add('active');state.profile.posting_frequency=n;save({postingFrequency:n});renderStats()},
  toggleDay:function(btn,d){btn.classList.toggle('active');var ds=[];btn.parentElement.querySelectorAll('.ps-btn.active').forEach(function(p){ds.push(p.textContent.trim())});state.profile.posting_days=ds.join(',');save({postingDays:ds.join(',')})},

var dashState = { data: null, loading: false, lastLoaded: 0 };

async function renderDashboard() {
  var el = $('view-dashboard');
  if (!el) return;

  // Show skeleton on first load OR refresh if older than 60 seconds
  var stale = Date.now() - dashState.lastLoaded > 60000;
  var firstLoad = !dashState.data;

  if (firstLoad) {
    el.innerHTML = dashboardSkeletonHTML();
  }

  if (firstLoad || stale) {
    if (dashState.loading) return;
    dashState.loading = true;
    try {
      var r = await fetch('/api/dashboard-data?clientId=' + encodeURIComponent(state.profile.id));
      if (!r.ok) {
        var err = await r.json().catch(function(){return{error:'Server error '+r.status}});
        el.innerHTML = '<div class="dash-empty" style="color:var(--tg-error)">Could not load dashboard: ' + esc(err.error) + '</div>';
        return;
      }
      dashState.data = await r.json();
      dashState.lastLoaded = Date.now();
    } catch (e) {
      el.innerHTML = '<div class="dash-empty" style="color:var(--tg-error)">' + esc(e.message) + '</div>';
      return;
    } finally {
      dashState.loading = false;
    }
  }

  drawDashboard(el, dashState.data);
}

function dashboardSkeletonHTML() {
  return '<div class="dash-skeleton" style="height:44px;margin-bottom:24px"></div>' +
    '<div class="dash-section"><div class="dash-skeleton" style="height:80px"></div></div>' +
    '<div class="dash-section"><div class="dash-skeleton" style="height:72px;margin-bottom:8px"></div><div class="dash-skeleton" style="height:72px;margin-bottom:8px"></div><div class="dash-skeleton" style="height:72px"></div></div>' +
    '<div class="dash-section"><div class="dash-skeleton" style="height:120px"></div></div>';
}

function drawDashboard(el, d) {
  var h = '';

  // ── Welcome state (new clients only) ──
  // Renders the welcome hero + checklist when the client hasn't yet graduated.
  // Graduation: 3/3 steps complete + 5+ approved posts + 7+ days since first login.
  var welcomeState = computeWelcomeState(d);
  if (welcomeState.show) {
    h += welcomeHeroHTML(welcomeState);
    if (!welcomeState.hasMetrics) {
      h += welcomeNumbersPanelHTML();
    }
  }

  // ── Live ticker ──
  h += tickerHTML(d.kpis);

  // ── Lede ──
  h += '<div class="dash-section">';
  h += '<div class="dash-section-title">Your Day at a Glance</div>';
  h += '<p class="dash-lede">' + ledeText(d) + '</p>';
  h += '</div>';

  // ── Action cards ──
  h += '<div class="dash-section">';
  h += '<div class="dash-section-title">Today\'s Actions \u00b7 ' + d.actions.total + '</div>';
  h += actionCardsHTML(d.actions);
  h += '</div>';

  // ── KPI strip ──
  h += '<div class="dash-section">';
  h += '<div class="dash-section-title">Last 30 Days</div>';
  h += kpiStripHTML(d.kpis);
  h += '</div>';

  // ── Hot Leads ──
  h += '<div class="dash-section">';
  h += '<div class="dash-section-title">Hot Leads \u00b7 Top 3</div>';
  h += hotLeadsHTML(d.hotLeads);
  h += '</div>';

  // ── Posts ──
  h += '<div class="dash-section">';
  h += '<div class="dash-section-title">Posts Going Out</div>';
  h += postsListHTML(d.pendingPosts);
  h += '</div>';

  // ── Top performer ──
  if (d.topPost) {
    h += '<div class="dash-section">';
    h += '<div class="dash-section-title">Top Performer \u00b7 Last 30 Days</div>';
    h += topPerformerHTML(d.topPost);
    h += '</div>';
  }

  // ── Recent activity ──
  h += '<div class="dash-section">';
  h += '<div class="dash-section-title">Recent Activity</div>';
  h += activityHTML(d.recentActivity);
  h += '</div>';

  el.innerHTML = h;
  attachDashboardHandlers();
  // Welcome state + showcase wiring (no-op when not in welcome state)
  attachWelcomeHandlers();
  attachShowcaseHandlers();
  maybeAutoShowShowcase();
}

function ledeText(d) {
  var total = d.actions.total;
  var top = d.hotLeads[0];
  if (total === 0) {
    return 'Nothing pressing right now. Luna is queuing your next batch of content. <em>Check back tomorrow morning.</em>';
  }
  if (top) {
    var matters = d.hotLeads.length;
    var verb = top.type === 'Buying Intent' ? 'matched on a buying intent signal'
      : top.type === 'Brand Mention' ? 'mentioned Travelgenix'
      : top.type === 'Competitor Mention' ? 'flagged a competitor discussion'
      : 'is worth a look';
    return total + ' thing' + (total === 1 ? '' : 's') + ' ready for you' +
      (matters > 0 ? ', and ' + matters + ' of them really matter' : '') + '. <strong>' +
      esc(top.author) + '</strong> from ' + esc(top.company || 'their company') + ' ' +
      verb + ' and scored <strong>' + top.score + ' out of 10</strong>. <em>Worth your morning.</em>';
  }
  return total + ' thing' + (total === 1 ? '' : 's') + ' ready for you. Tap the cards below to work through them.';
}
