function formatBig(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function kpiStripHTML(k) {
  function delta(d) {
    if (!d) return '';
    var up = d.charAt(0) === '+';
    var arrow = up ? '\u2191' : '\u2193';
    return '<div class="dash-kpi-delta ' + (up ? 'up' : 'down') + '">' + arrow + ' ' + d.replace(/^[+\-]/, '') + ' vs prev 30d</div>';
  }
  // For tiles with no data yet, show a neutral "no data" line instead of a
  // red ↓ 0% which makes new clients feel like they're failing on day one.
  function deltaOrEmpty(value, deltaStr) {
    if (!value || value === 0) {
      return '<div class="dash-kpi-delta neutral">No data yet</div>';
    }
    return delta(deltaStr);
  }
  return '<div class="dash-kpi-grid">' +
    '<div class="dash-kpi"><div class="dash-kpi-label">Demos booked</div><div class="dash-kpi-value">' + k.demoBookings + '</div>' + deltaOrEmpty(k.demoBookings, k.demoBookingsDelta) + '</div>' +
    '<div class="dash-kpi"><div class="dash-kpi-label">Reach</div><div class="dash-kpi-value">' + formatBig(k.postReach) + '</div>' + deltaOrEmpty(k.postReach, k.postReachDelta) + '</div>' +
    '<div class="dash-kpi"><div class="dash-kpi-label">Site clicks</div><div class="dash-kpi-value">' + k.websiteClicks + '</div>' + deltaOrEmpty(k.websiteClicks, k.websiteClicksDelta) + '</div>' +
    '</div>';
}

function tickerHTML(k) {
  function deltaPill(d, value) {
    // No delta at all → flat dash
    if (!d) return '<span class="dash-ticker-delta flat">\u2013</span>';
    // No data yet (value is 0) → flat dash regardless of what delta says.
    // Avoids "↓ 0%" looking like things are getting worse on day one.
    if (!value || value === 0 || value === '0' || value === '0%' || value === '0.0%') {
      return '<span class="dash-ticker-delta flat">\u2013</span>';
    }
    var ch = d.charAt(0);
    var up = ch === '+';
    var down = ch === '-';
    // Treat ±0% as flat
    var num = parseFloat(d.replace(/^[+\-]/, ''));
    if (num === 0) {
      return '<span class="dash-ticker-delta flat">\u2013</span>';
    }
    var cls = up ? 'up' : (down ? 'down' : 'flat');
    var arrow = up ? '\u25B2' : (down ? '\u25BC' : '\u2013');
    return '<span class="dash-ticker-delta ' + cls + '">' + arrow + ' ' + d.replace(/^[+\-]/, '') + '</span>';
  }
  function pct(s) {
    if (!s) return '0%';
    return s;
  }
  function item(label, value, deltaStr) {
    var d = (deltaStr === undefined || deltaStr === null) ? '' : deltaPill(deltaStr, value);
    return '<div class="dash-ticker-item"><span class="dash-ticker-label">' + label + '</span><span class="dash-ticker-value">' + value + '</span>' + d + '</div>';
  }
  // Build the ticker payload once
  var items = [
    item('POSTS PUB', String(k.postsPublished || 0), k.postsPublishedDelta),
    item('REACH', formatBig(k.postReach || 0), k.postReachDelta),
    item('CLICKS', String(k.websiteClicks || 0), k.websiteClicksDelta),
    item('DEMOS', String(k.demoBookings || 0), k.demoBookingsDelta),
    item('VISITS', String(k.profileVisits || 0), k.profileVisitsDelta),
    item('EMAIL OPEN', pct(k.emailOpenRate)),
    item('EMAIL CLICK', pct(k.emailClickRate))
  ];
  var sep = '<span class="dash-ticker-sep">\u25CF</span>';
  var oneLoop = items.join(sep);
  // Duplicate the loop so the scroll wraps seamlessly (the keyframe translates -50%)
  return '<div class="dash-ticker" role="region" aria-label="Live metrics ticker">' +
    '<div class="dash-ticker-track">' + oneLoop + sep + oneLoop + sep + '</div>' +
    '</div>';
}

function leadColour(score) {
  if (score >= 9) return 'var(--tg-accent-dark)';
  if (score >= 7) return 'var(--tg-warning)';
  return '#7C3AED';
}

function hotLeadsHTML(leads) {
  if (!leads || leads.length === 0) {
    return '<div class="dash-empty">We\'re scanning LinkedIn for buying signals, brand mentions and competitor chatter. Hot leads will appear here as they\'re found \u2014 typically within the first few weeks.</div>';
  }
  return leads.map(function(l, i) {
    var colour = leadColour(l.score);
    return '<div class="dash-lead-card" data-lead-idx="' + i + '">' +
      '<div class="dash-lead-grid">' +
      '<div><div class="dash-lead-score" style="color:' + colour + '">' + l.score + '.0</div><div class="dash-lead-type">' + esc(l.type) + '</div></div>' +
      '<div>' +
      '<div class="dash-lead-author">' + esc(l.author) + (l.title ? ' \u00b7 ' + esc(l.title) : '') + (l.company ? ', ' + esc(l.company) : '') + '</div>' +
      '<div class="dash-lead-quote" style="border-left-color:' + colour + '">"' + esc(l.snippet) + (l.snippet.length >= 220 ? '\u2026' : '') + '"</div>' +
      '<div class="dash-lead-meta">LinkedIn \u00b7 ' + esc(l.capturedAgo) + '</div>' +
      '</div></div></div>';
  }).join('');
}

function postsListHTML(posts) {

      : '';
    var timeStyle = p.isOverdue
      ? 'color:var(--tg-error);font-weight:600'
      : '';
    return '<div class="dash-post-row" data-post-idx="' + i + '"' + (p.isOverdue ? ' style="background:rgba(239,68,68,0.025)"' : '') + '>' +
      '<div style="flex:1;min-width:0">' +
      '<div class="dash-post-title">' + overdueBadge + esc(p.title) + '</div>' +
      '<div class="dash-post-meta"><strong>' + esc(p.targetChannel) + '</strong>' + (p.contentPillar ? ' \u00b7 ' + esc(p.contentPillar) : '') + '</div>' +
      '</div>' +
      '<div class="dash-post-time" style="' + timeStyle + '">' + esc(p.scheduledFor) + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

function topPerformerHTML(p) {
  return '<div class="dash-top-post-card">' +
    '<div class="dash-top-post-title">"' + esc(p.title) + '"</div>' +
    '<div style="font-size:var(--text-sm);color:var(--tg-text-tertiary)">' + esc(p.targetChannel) + ' \u2014 your best-reaching post in the last 30 days.</div>' +
    '<div class="dash-top-post-stats">' +
    '<div><div class="dash-top-post-stat-value">' + formatBig(p.reach) + '</div><div class="dash-top-post-stat-label">Reach</div></div>' +
    '<div><div class="dash-top-post-stat-value">' + p.engagement + '</div><div class="dash-top-post-stat-label">Engagements</div></div>' +

function activityHTML(items) {
  if (!items || items.length === 0) {
    return '<div class="dash-empty">No activity in the last week.</div>';
  }
  return items.map(function(item) {
    return '<div class="dash-activity">' +
      '<div class="dash-activity-time">' + esc(item.timeAgo) + '</div>' +
      '<div class="dash-activity-text">' + item.text + '</div>' +
      '</div>';
  }).join('');
}

function attachDashboardHandlers() {
  // Action cards — switch tabs
  document.querySelectorAll('[data-action-target]').forEach(function(btn) {
    btn.onclick = function() {
      var target = btn.getAttribute('data-action-target');
      if (target === 'posts') {
        document.querySelector('[data-view=posts]').click();
      } else if (target === 'leads') {
        // Scroll to hot leads section within dashboard
        var firstLead = document.querySelector('[data-lead-idx]');
        if (firstLead) firstLead.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else if (target === 'emails') {
        toast('Open the Email Queue table in Airtable to review pending emails');
      }
    };
  });
  // Hot lead cards — open drawer
  document.querySelectorAll('[data-lead-idx]').forEach(function(el) {
    el.onclick = function() {
      var idx = parseInt(el.getAttribute('data-lead-idx'), 10);
      openLeadDrawer(dashState.data.hotLeads[idx]);
    };
  });
  // Post rows — open drawer
  document.querySelectorAll('[data-post-idx]').forEach(function(el) {
    el.onclick = function() {
      var idx = parseInt(el.getAttribute('data-post-idx'), 10);
      openPostDrawer(dashState.data.pendingPosts[idx]);
    };
  });
}

function toast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;background:var(--tg-text-primary);color:var(--tg-bg-primary);box-shadow:var(--shadow-lg);font-family:var(--tg-font-body)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() {
    t.style.transition = 'opacity 0.3s';
    t.style.opacity = '0';
    setTimeout(function() { t.remove(); }, 300);
  }, 3000);
}

function showDrawer(title, bodyHTML) {
  closeDrawer();

  currentSubTab: 'queue',     // 'queue' | 'sent'
  currentFilter: 'awaiting',  // queue: awaiting | all | approved | quality-hold | failed
                              // sent:  all (only one option for now)
  emails: [],
  loading: false,
  drawerOpen: false,
  currentEmail: null,
  previewMode: 'html',  // 'html' | 'plain'
  editing: false,
  editedFields: {},
  // ── Stage C: per-slot image generation jobs ─────────────────────

  // Status values: 'pending' | 'running' | 'done' | 'error'
  // Jobs survive modal close so the URL can land after the modal is shut.

};

function renderEmails() {
  var el = $('view-emails');
  if (!el) return;
  el.innerHTML = '<div class="dash-skeleton" style="height:40px;margin-bottom:16px"></div>' +
    '<div class="dash-skeleton" style="height:60px;margin-bottom:8px"></div>' +
    '<div class="dash-skeleton" style="height:60px;margin-bottom:8px"></div>' +
    '<div class="dash-skeleton" style="height:60px"></div>';
  loadEmails();
  // Eagerly load email templates in the background so they're ready when Compose is clicked
  if (typeof loadEmailTemplates === 'function' && !emailState.templates) {
    loadEmailTemplates();
  }
}

async function loadEmails() {
  if (!state.profile || !state.profile.id) return;
  emailState.loading = true;

  var clientId = state.profile.id;
  var view = emailState.currentSubTab;
  var status = '';
  if (view === 'queue') {
    if (emailState.currentFilter === 'awaiting') status = 'Awaiting Approval';
    else if (emailState.currentFilter === 'approved') status = 'Approved';
    else if (emailState.currentFilter === 'quality-hold') status = 'Quality Hold';
    else if (emailState.currentFilter === 'failed') status = 'Failed';
    else if (emailState.currentFilter === 'cancelled') status = 'Cancelled';
    // 'all' = no status filter
  }

  var params = 'clientId=' + encodeURIComponent(clientId) + '&view=' + view;
  if (status) params += '&status=' + encodeURIComponent(status);

  try {
    var r = await fetch('/api/email-list?' + params);
    var d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed to load');
    emailState.emails = d.emails || [];
  } catch (e) {
    emailState.emails = [];
    console.error('Email load error:', e);
  } finally {
    emailState.loading = false;
    drawEmails();
  }
}

function drawEmails() {
  var el = $('view-emails');
  if (!el) return;

  var h = '';

  // Sub-tabs
  h += '<div class="email-subtabs">';
  h += '<button class="email-subtab' + (emailState.currentSubTab === 'queue' ? ' active' : '') + '" onclick="window.__emailSubTab(\'queue\')">Queue</button>';
  h += '<button class="email-subtab' + (emailState.currentSubTab === 'sent' ? ' active' : '') + '" onclick="window.__emailSubTab(\'sent\')">Sent</button>';
  h += '</div>';

  // Filter chips (only on queue view)
  if (emailState.currentSubTab === 'queue') {
    h += '<div class="email-filter-chips">';
    var filters = [
      { key: 'awaiting', label: 'Awaiting Approval' },
      { key: 'approved', label: 'Approved' },
      { key: 'quality-hold', label: 'Quality Hold' },
      { key: 'failed', label: 'Failed' },
      { key: 'cancelled', label: 'Cancelled' },
      { key: 'all', label: 'All' },
    ];
    for (var i = 0; i < filters.length; i++) {
      var f = filters[i];
      var isActive = f.key === emailState.currentFilter;
      h += '<button class="email-chip' + (isActive ? ' active' : '') + '" onclick="window.__emailFilter(\'' + f.key + '\')">' + esc(f.label) + '</button>';
    }
    h += '</div>';
  }

  // Email list
  if (emailState.loading) {
    h += '<div class="dash-skeleton" style="height:60px;margin-bottom:8px"></div>';
    h += '<div class="dash-skeleton" style="height:60px;margin-bottom:8px"></div>';
    h += '<div class="dash-skeleton" style="height:60px"></div>';
  } else if (emailState.emails.length === 0) {
    var emptyText = emailState.currentSubTab === 'sent'
      ? 'No emails sent in the last 30 days.'
      : 'No emails in this queue.';
    h += '<div class="email-empty">' + esc(emptyText) + '</div>';
  } else {
    h += '<div class="email-table">';

    // Header row
    h += '<div class="email-row head">';
    h += '<div>Subject</div>';
    h += '<div>Audience</div>';
    if (emailState.currentSubTab === 'sent') {
      h += '<div>Opens</div><div>Clicks</div>';
    } else {
      h += '<div>Status</div><div>Scheduled</div>';
    }
    h += '<div></div>';
    h += '</div>';

    for (var j = 0; j < emailState.emails.length; j++) {
      var email = emailState.emails[j];
      var statusClass = 'email-status-' + (email.status || 'draft').toLowerCase().replace(/\s+/g, '-');
      var dateText = '';
      if (emailState.currentSubTab === 'sent') {
        dateText = email.sentAt ? formatDate(email.sentAt) : '';
      } else {
        dateText = email.scheduledSend ? formatDate(email.scheduledSend) : 'Not set';
      }

      h += '<div class="email-row" onclick="window.__emailOpen(\'' + email.id + '\')">';
      h += '<div>';
      h += '<div class="email-row-subject">' + esc(email.subject) + '</div>';
      if (email.previewText) {
        h += '<div class="email-row-preview">' + esc(email.previewText) + '</div>';
      }
      h += '</div>';
      h += '<div class="email-row-meta">' + esc(email.audience || '—') + '</div>';
      if (emailState.currentSubTab === 'sent') {
        h += '<div class="email-row-meta">' + (email.opens || 0) + (email.openRate ? ' (' + email.openRate + '%)' : '') + '</div>';
        h += '<div class="email-row-meta">' + (email.clicks || 0) + '</div>';
      } else {
        h += '<div><span class="email-row-status ' + statusClass + '">' + esc(email.status) + '</span></div>';
        h += '<div class="email-row-meta">' + esc(dateText) + '</div>';
      }
      h += '<div class="email-row-meta" style="text-align:right;color:var(--tg-text-tertiary)">›</div>';
      h += '</div>';
    }

    h += '</div>';
  }

  el.innerHTML = h;
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var now = new Date();
  var sameYear = d.getFullYear() === now.getFullYear();
  var opts = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
  if (!sameYear) opts.year = 'numeric';
  return d.toLocaleString('en-GB', opts);
}

function drawEmailDrawer() {
  var email = emailState.currentEmail;
  if (!email) return;

  var bodyHTML = '';

  // Quality issues warning (if any)
  if (email.qualityIssues) {
    bodyHTML += '<div class="email-quality-warning">';
    bodyHTML += '<strong>⚠ Quality issues</strong>';
    bodyHTML += esc(email.qualityIssues);

  }

  // Metadata grid
  bodyHTML += '<div class="email-drawer-meta-grid">';
  bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Status</div><div class="email-drawer-value"><span class="email-row-status email-status-' + (email.status || 'draft').toLowerCase().replace(/\s+/g, '-') + '">' + esc(email.status) + '</span></div></div>';
  bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Audience</div><div class="email-drawer-value">' + esc(email.audience || '—') + '</div></div>';
  bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Recipient</div><div class="email-drawer-value">' + esc(email.recipientEmail || email.audienceSegment || '—') + '</div></div>';
  bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Recipients</div><div class="email-drawer-value">' + (email.recipientsCount || 0) + '</div></div>';
  if (email.scheduledSend) {
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Scheduled</div><div class="email-drawer-value">' + esc(formatDate(email.scheduledSend)) + '</div></div>';
  }
  if (email.sentAt) {
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Sent</div><div class="email-drawer-value">' + esc(formatDate(email.sentAt)) + '</div></div>';
  }
  if (email.opens || email.clicks) {
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Opens</div><div class="email-drawer-value">' + (email.opens || 0) + '</div></div>';
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Clicks</div><div class="email-drawer-value">' + (email.clicks || 0) + '</div></div>';
  }
  bodyHTML += '</div>';

  // Subject and preview text
  if (emailState.editing) {
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Subject</div>';
    bodyHTML += '<input type="text" id="emailEditSubject" value="' + esc(email.subject) + '" style="width:100%;padding:var(--space-2);border:1px solid var(--tg-border);border-radius:var(--radius-md);font-family:var(--tg-font-body);font-size:var(--text-sm)" /></div>';
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Preview text</div>';
    bodyHTML += '<input type="text" id="emailEditPreview" value="' + esc(email.previewText) + '" style="width:100%;padding:var(--space-2);border:1px solid var(--tg-border);border-radius:var(--radius-md);font-family:var(--tg-font-body);font-size:var(--text-sm)" /></div>';
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Body (plain text)</div>';
    bodyHTML += '<textarea id="emailEditPlain" rows="10" style="width:100%;padding:var(--space-2);border:1px solid var(--tg-border);border-radius:var(--radius-md);font-family:var(--tg-font-mono);font-size:var(--text-xs);resize:vertical">' + esc(email.bodyPlain) + '</textarea></div>';
  } else {
    bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Subject</div><div class="email-drawer-value" style="font-weight:600;font-size:var(--text-base)">' + esc(email.subject) + '</div></div>';
    if (email.previewText) {
      bodyHTML += '<div class="email-drawer-section"><div class="email-drawer-label">Preview text</div><div class="email-drawer-value" style="color:var(--tg-text-secondary);font-style:italic">' + esc(email.previewText) + '</div></div>';
    }

    bodyHTML += '<div class="email-drawer-section">';
    bodyHTML += '<div class="email-drawer-label">Body</div>';
    bodyHTML += '<div class="email-preview-toggle">';
    bodyHTML += '<button class="' + (emailState.previewMode === 'html' ? 'active' : '') + '" onclick="window.__emailPreview(\'html\')">HTML</button>';
    bodyHTML += '<button class="' + (emailState.previewMode === 'plain' ? 'active' : '') + '" onclick="window.__emailPreview(\'plain\')">Plain text</button>';
    bodyHTML += '</div>';
    if (emailState.previewMode === 'html') {
      bodyHTML += '<div class="email-preview-frame">' + (email.bodyHTML || '<em style="color:#999">No HTML body</em>') + '</div>';
    } else {
      bodyHTML += '<div class="email-preview-frame plain">' + esc(email.bodyPlain || '(no plain text fallback)') + '</div>';
    }
    bodyHTML += '</div>';
  }

  // Audit trail
  if (emailState.auditTrail && emailState.auditTrail.length > 0) {
    bodyHTML += '<div class="email-drawer-section">';
    bodyHTML += '<div class="email-drawer-label">History</div>';
    bodyHTML += '<div class="email-audit-list">';
    for (var i = 0; i < emailState.auditTrail.length; i++) {

      bodyHTML += '<div class="email-audit-item">';

    bodyHTML += '<div class="email-actions">';

    bodyHTML += '<button class="email-action-reject" onclick="window.__emailReject()">Reject</button>';
    bodyHTML += '<button class="email-action-approve" onclick="window.__emailApprove()">Approve</button>';

    // Sent / Failed / other terminal states — still allow re-testing.
    // No Delete button: Sent emails are part of the compliance audit trail.
    bodyHTML += '<div class="email-actions">';
    bodyHTML += testBtn;
    bodyHTML += '</div>';
  }

  $('emailDrawerBody').innerHTML = bodyHTML;
}

window.__emailPreview = function(mode) {

  drawEmailDrawer();
};

window.__emailEdit = function() {
  var email = emailState.currentEmail;
  if (!email) return;

  // If the email was built via the section builder OR the AI composer,
  // it has a Sections JSON blob. Branch to the section builder pre-loaded
  // with those sections (as a NEW draft — saves create a fresh record,
  // the original is untouched).
  //
  // If no Sections JSON, fall through to the legacy plain-text editor.
  // That editor was the only way to edit older emails that pre-date the
  // section system, and it still works for those.
  if (email.sectionsJson && typeof email.sectionsJson === 'string') {
    var parsed = null;
    try {
      parsed = JSON.parse(email.sectionsJson);
    } catch (e) {
      // Malformed — fall through to legacy editor as a safe default.
      console.warn('[__emailEdit] sectionsJson failed to parse, using legacy editor:', e);
    }

    if (Array.isArray(parsed) && parsed.length > 0) {
      // Hydrate sections — each section needs an `id` for the builder's
      // selection/reorder logic. Stored JSON only has {type, props}, so
      // we mint fresh IDs here.
      var hydrated = parsed
        .filter(function(s) { return s && typeof s.type === 'string'; })
        .map(function(s) {
          return {
            id: (typeof genSectionId === 'function' ? genSectionId() : ('sec-' + Math.random().toString(36).slice(2))),
            type: s.type,
            props: s.props || {},
          };
        });

      if (hydrated.length === 0) {
        // Sections JSON was present but empty/invalid — fall through.
        emailState.editing = true;
        drawEmailDrawer();
        return;
      }

      // Pre-fill compose data from this email. Don't carry recipientEmail
      // or scheduledSend over — the duplicate is a fresh draft.
      emailState.composeData = {
        subject: email.subject || '',
        previewText: email.previewText || '',
        bodyHTML: '',
        bodyPlain: '',
        audience: email.audience || 'Client',
        audienceSegment: email.audienceSegment || '',
        recipientEmail: '',
        scheduledSend: '',
        emailType: email.emailType || 'Newsletter',
      };
      emailState.builderSections = hydrated;
      emailState.selectedSectionId = hydrated[0].id;
      emailState.builderInitialised = true;
      emailState.previewHTML = '';

      // Track that we duplicated from an existing email — used to show
      // a banner in the builder so the user understands save creates new.
      emailState.duplicatedFromEmailId = email.id;
      emailState.duplicatedFromSubject = email.subject || '';

      // Close the drawer + open compose
      closeEmailDrawer();
      emailState.composeOpen = true;
      drawEmails();
      return;
    }
  }

  // Legacy fallback — plain-text editor for older emails
  emailState.editing = true;
  drawEmailDrawer();
};

window.__emailCancelEdit = function() {
  emailState.editing = false;
  drawEmailDrawer();
};

window.__emailSaveEdit = async function() {
  var subject = $('emailEditSubject').value.trim();
  var previewText = $('emailEditPreview').value.trim();
  var bodyPlain = $('emailEditPlain').value;

  if (!subject) { alert('Subject cannot be empty'); return; }

  try {
    var r = await fetch('/api/email-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        emailId: emailState.currentEmail.id,
        action: 'edit',
        edits: { subject: subject, previewText: previewText, bodyPlain: bodyPlain },
      }),
    });
    var d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed to save');
    // Reload the email
    emailState.editing = false;
    window.__emailOpen(emailState.currentEmail.id);
    loadEmails();  // refresh list
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
};

window.__emailApprove = async function() {
  if (!confirm('Approve this email for sending?')) return;
  try {
    var r = await fetch('/api/email-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        emailId: emailState.currentEmail.id,
        action: 'approve',
      }),
    });
    var d = await r.json();
    if (!d.success) throw new Error(d.error || 'Approve failed');
    closeEmailDrawer();
    loadEmails();
  } catch (e) {
    alert('Approve failed: ' + e.message);
  }
};

window.__emailReject = async function() {
  var reason = prompt('Why are you rejecting this email? (optional)');
  if (reason === null) return;  // cancelled
  try {
    var r = await fetch('/api/email-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        emailId: emailState.currentEmail.id,
        action: 'reject',
        rejectionReason: reason,
      }),
    });
    var d = await r.json();
    if (!d.success) throw new Error(d.error || 'Reject failed');
    closeEmailDrawer();
    loadEmails();
  } catch (e) {
    alert('Reject failed: ' + e.message);
  }
};

window.__emailCancel = async function() {
  if (!confirm('Cancel this approved email? It will not be sent.')) return;
  try {
    var r = await fetch('/api/email-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        emailId: emailState.currentEmail.id,
        action: 'cancel',
      }),
    });
    var d = await r.json();
    if (!d.success) throw new Error(d.error || 'Cancel failed');
    closeEmailDrawer();
    loadEmails();
  } catch (e) {
    alert('Cancel failed: ' + e.message);
  }
};

// Hard-delete an email record. Used to clean up draft duplicates left
// over from the edit-as-duplicate flow. Server-side guardrails refuse
// to delete Sent emails (compliance audit trail). Server writes an
// audit log entry BEFORE the record is removed so the trail survives.
window.__emailDelete = async function() {
  var email = emailState.currentEmail;
  if (!email) return;

  // Double-confirm. The subject is shown so the user can sanity-check
  // they're deleting the right one. Hard delete is non-recoverable.
  var subjLabel = email.subject ? '"' + email.subject + '"' : 'this email';
  if (!confirm('Permanently delete ' + subjLabel + '?\n\nThis cannot be undone. The record will be removed from Airtable. An audit log entry will be kept.')) {
    return;
  }

  try {
    var r = await fetch('/api/email-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: state.profile.id,
        emailId: email.id,
      }),
    });
    var d = await r.json();
    if (!d.success) throw new Error(d.error || 'Delete failed');
    showEmailToast('Email deleted', 'success');
    closeEmailDrawer();
    loadEmails();
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
};

window.__emailComposeClose = function() {

  emailState.composeOpen = false;
  emailState.composeData = {
    subject: '',

    bodyHTML: '',
    bodyPlain: '',

    audienceSegment: '',

    emailType: 'Newsletter',
  };
  emailState.builderInitialised = false;
  emailState.builderSections = null;
  emailState.selectedSectionId = null;
  emailState.previewHTML = '';
  // Clear duplicate-from state too — a fresh compose shouldn't show
  // the banner that says "duplicated from..."
  emailState.duplicatedFromEmailId = null;
  emailState.duplicatedFromSubject = '';
  drawEmails();
};

function hasComposeContent() {
  var d = emailState.composeData;
  if (d.subject || d.previewText || d.recipientEmail) return true;
  // Builder content: more than just defaults?
  var s = emailState.builderSections;
  if (!s || s.length === 0) return false;
  // Anything added beyond the 4 starter sections counts
  if (s.length > 4) return true;
  // If user customised hero/text props beyond defaults
  for (var i = 0; i < s.length; i++) {
    var p = s[i].props || {};
    if (s[i].type === 'hero' && p.headline && p.headline !== 'Your headline here') return true;
    if (s[i].type === 'text' && p.body && p.body !== 'Write your main content here. Keep it short, friendly and human. Aim for two or three short paragraphs.') return true;
    if (s[i].type === 'cta' && p.headline && p.headline !== 'Ready to get started?') return true;
  }
  return false;
}

function initBuilder() {
  emailState.builderInitialised = true;
  emailState.builderSections = emailState.builderSections || defaultStarterSections();
  emailState.selectedSectionId = emailState.selectedSectionId || (emailState.builderSections[0] && emailState.builderSections[0].id) || null;
  emailState.previewMode = emailState.previewMode || 'desktop';
  emailState.previewHTML = '';

  // Load templates if we haven't yet
  if (!emailState.templates) {
    loadEmailTemplates();
  }
}

function genSectionId() {
  return 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function defaultStarterSections() {
  return [
    { id: genSectionId(), type: 'header', props: { logoAlt: 'Travelgenix', logoLinkUrl: 'https://travelgenix.io' } },
    { id: genSectionId(), type: 'hero', props: { headline: 'Your headline here', subhead: 'A short supporting line that draws the reader in.', ctaText: 'Read more', ctaUrl: 'https://travelgenix.io', accent: 'teal' } },
    { id: genSectionId(), type: 'text', props: { body: 'Write your main content here. Keep it short, friendly and human. Aim for two or three short paragraphs.', align: 'left' } },
    { id: genSectionId(), type: 'footer', props: { showUnsub: true } },
  ];
}

function sectionMeta(type) {
  return SECTION_META[type] || { label: type, description: '', fields: [] };
}

function sectionSummary(section) {
  var p = section.props || {};
  switch (section.type) {
    case 'header': return p.logoAlt || 'Travelgenix logo';
    case 'hero': return p.headline || '(no headline)';
    case 'text': return (p.headline || p.body || '(empty)').slice(0, 50);
    case 'two-column': return ((p.left && p.left.headline) || 'Left') + ' | ' + ((p.right && p.right.headline) || 'Right');
    case 'cta': return p.headline || '(no headline)';
    case 'divider': return p.style || 'thin';
    case 'footer': return p.tagline || 'Footer + unsubscribe';
    // ── Offer sections — summary surfaces the active filter ─────────
    case 'offers-hero':
    case 'offers-three-up':
    case 'offers-urgency':
    case 'offers-list':
    case 'offers-two-up':
    case 'offers-editorial': {
      var f = p.fetch || {};
      var bits = [];
      if (Array.isArray(f.destinations) && f.destinations.length) bits.push(f.destinations.join(','));
      if (f.sort) bits.push(f.sort);
      if (f.minRating) bits.push(f.minRating + '★');
      return bits.length ? 'Live · ' + bits.join(' · ') : 'Live offers · auto';
    }
    // ── Transactional ───────────────────────────────────────────────
    case 'top-bar': return p.metaValue || p.businessName || 'Top bar';
    case 'confirmation-block': return p.headline || p.eyebrow || 'Confirmation';
    case 'trip-card': return p.image_name || 'Trip card';
    case 'cost-summary': {
      var lineCount = Array.isArray(p.line_items) ? p.line_items.length : 0;
      var total = (p.total && p.total.amount) || '';
      return lineCount + ' line' + (lineCount === 1 ? '' : 's') + (total ? ' · ' + total : '');
    }
    case 'next-steps': {
      var stepCount = Array.isArray(p.steps) ? p.steps.length : 0;
      return stepCount + ' step' + (stepCount === 1 ? '' : 's');
    }
    case 'help-block': {
      var contactCount = Array.isArray(p.contacts) ? p.contacts.length : 0;
      return p.title || (contactCount + ' contact' + (contactCount === 1 ? '' : 's'));
    }
    case 'footer-meta': {
      var lineCount2 = Array.isArray(p.lines) ? p.lines.filter(function(l) { return l && String(l).trim(); }).length : 0;
      return lineCount2 + ' legal line' + (lineCount2 === 1 ? '' : 's');
    }
    // ── Marketing ───────────────────────────────────────────────────
    case 'hero-image': return p.headline || '(no headline)';
    case 'destination-grid': {
      var cardCount = Array.isArray(p.cards) ? p.cards.length : 0;
      return p.title || (cardCount + ' card' + (cardCount === 1 ? '' : 's'));
    }
    case 'feature-story': return p.body_title || p.title || 'Feature story';
    case 'pull-quote': {
      var q = (p.quote || '').trim();
      return q ? '"' + q.slice(0, 40) + (q.length > 40 ? '…' : '') + '"' : '(empty quote)';
    }
    case 'cta-banner': return p.title || (p.cta && p.cta.text) || 'CTA banner';
    case 'footer-light': return p.logo_text || p.tagline || 'Light footer';
    // ── Colour-aware sections ────────────────────────────────────────
    case 'hero-coloured': {
      var h = (p.headline || '').split(/\r?\n/)[0] || 'Hero';
      return h.slice(0, 50);
    }
    case 'story-numbered': {
      var prefix = p.number_label ? p.number_label + ' · ' : '';
      return (prefix + (p.headline || 'Story')).slice(0, 60);
    }
    // ── Daily-Beacon-style sections ──────────────────────────────────
    case 'masthead-bar': return (p.wordmark || 'Masthead bar').slice(0, 40);
    case 'headline-duotone': {
      var l1 = p.line_one || '';
      var l2 = p.line_two || '';
      return (l1 + ' ' + l2).trim().slice(0, 50) || 'Duotone headline';
    }
    case 'image-duo': {
      if (p.image_one_url || p.image_two_url) {
        return (p.caption || 'Two-up image').slice(0, 50);
      }
      return '(no images)';
    }
    case 'product-cards-3up': {
      var cardCount = Array.isArray(p.cards) ? p.cards.length : 0;
      return cardCount + ' card' + (cardCount === 1 ? '' : 's');
    }
    case 'cta-pill': return (p.text || 'CTA pill').slice(0, 40);
    case 'image-full-bleed': {
      if (p.image_url) return (p.image_alt || p.caption || 'Full-bleed image').slice(0, 50);
      return '(no image)';
    }
    case 'image': {
      if (p.image_url) return (p.image_alt || p.caption || 'Image').slice(0, 50);
      return '(no image)';
    }
    case 'footer-icons': {
      var iconCount = Array.isArray(p.icons) ? p.icons.length : 0;
      return iconCount > 0 ? iconCount + ' icon' + (iconCount === 1 ? '' : 's') : 'Icon footer (auto)';
    }
    // ── Generated image (Stage C) ────────────────────────────────────
    case 'generated-image': {
      if (p.imageUrl) return (p.imageAlt || 'Generated image').slice(0, 50);
      return '(not yet generated)';
    }
    // ── B2B Weekly ──────────────────────────────────────────────────
    case 'masthead': return p.title || 'Masthead';
    case 'toc': {
      var tocCount = Array.isArray(p.items) ? p.items.length : 0;
      return tocCount + ' item' + (tocCount === 1 ? '' : 's');
    }
    case 'lead-story': return (p.headline || '(no headline)').slice(0, 50);
    case 'duo-grid': return ((p.left && p.left.headline) || 'Left') + ' | ' + ((p.right && p.right.headline) || 'Right');
    case 'pulse-stats': return (p.title || (Array.isArray(p.stats) ? p.stats.length + ' stats' : 'Pulse')).slice(0, 50);
    case 'numbered-list': {
      var nlCount = Array.isArray(p.items) ? p.items.length : 0;
      return (p.title ? p.title + ' · ' : '') + nlCount + ' item' + (nlCount === 1 ? '' : 's');
    }
    case 'calendar-grid': {
      var cgCount = Array.isArray(p.items) ? p.items.length : 0;
      return (p.title ? p.title + ' · ' : '') + cgCount + ' event' + (cgCount === 1 ? '' : 's');
    }
    // ── Product Launch ──────────────────────────────────────────────
    case 'hero-dark': return ((p.headline || '').replace(/\*/g, '').replace(/\n/g, ' ') || '(no headline)').slice(0, 50);
    case 'product-mockup': {
      if (p.variant === 'dashboard') {
        var rowCount = Array.isArray(p.dashboard_rows) ? p.dashboard_rows.length : 0;
        return 'Dashboard · ' + rowCount + ' row' + (rowCount === 1 ? '' : 's');
      }
      var msgCount = Array.isArray(p.messages) ? p.messages.length : 0;
      return 'Chat · ' + msgCount + ' message' + (msgCount === 1 ? '' : 's');
    }
    case 'features-section': {
      var fcount = Array.isArray(p.features) ? p.features.length : 0;
      return (p.title ? p.title.slice(0, 30) + ' · ' : '') + fcount + ' feature' + (fcount === 1 ? '' : 's');
    }
    case 'stats-strip': {
      var sscount = Array.isArray(p.stats) ? p.stats.filter(function(s) { return s && (s.value || s.label); }).length : 0;
      return sscount + ' stat' + (sscount === 1 ? '' : 's');
    }
    case 'testimonial': {
      var q = (p.quote || '').trim();
      var who = (p.author && p.author.name) || '';
      if (q && who) return who + ' · "' + q.slice(0, 30) + (q.length > 30 ? '…' : '') + '"';
      if (q) return '"' + q.slice(0, 50) + (q.length > 50 ? '…' : '') + '"';
      return '(empty quote)';
    }
    case 'cta-dark': return p.title || (p.cta && p.cta.text) || 'Final CTA';
    case 'footer-dark': return p.logo_text || 'Dark footer';
    default: return '';
  }
}

function getNestedValue(obj, path) {
  var parts = path.split('.');
  var v = obj;
  for (var i = 0; i < parts.length; i++) {
    if (v == null) return undefined;
    v = v[parts[i]];
  }
  return v;
}

function setNestedValue(obj, path, value) {
  // Path segments that look like positive integers (e.g. "0", "12") cause
  // the parent container to be created as a real Array; otherwise as an
  // object. This is essential for builder array fields (cards.0.name etc)
  // so the rendered props serialise as `cards: [...]` not `cards: {0:...}`.
  var parts = path.split('.');
  var cursor = obj;
  for (var i = 0; i < parts.length - 1; i++) {
    var key = parts[i];
    var nextKey = parts[i + 1];
    var nextIsArrayIndex = /^\d+$/.test(nextKey);
    var existing = cursor[key];
    var existingIsRightShape = nextIsArrayIndex
      ? Array.isArray(existing)
      : (existing != null && typeof existing === 'object' && !Array.isArray(existing));
    if (!existingIsRightShape) {
      cursor[key] = nextIsArrayIndex ? [] : {};
    }
    cursor = cursor[key];
  }
  var lastKey = parts[parts.length - 1];
  if (Array.isArray(cursor) && /^\d+$/.test(lastKey)) {
    cursor[parseInt(lastKey, 10)] = value;
  } else {
    cursor[lastKey] = value;
  }
}

// Remove a nested value at path. If the parent is an array, splice the
// index out so subsequent indices renumber correctly. If the parent is an
// object, delete the key.
function removeNestedValue(obj, path) {
  var parts = path.split('.');
  var cursor = obj;
  for (var i = 0; i < parts.length - 1; i++) {
    if (cursor == null || typeof cursor !== 'object') return;
    cursor = cursor[parts[i]];
  }
  if (cursor == null || typeof cursor !== 'object') return;
  var lastKey = parts[parts.length - 1];
  if (Array.isArray(cursor) && /^\d+$/.test(lastKey)) {
    cursor.splice(parseInt(lastKey, 10), 1);
  } else {
    delete cursor[lastKey];
  }
}

// Move an item within an array at a given path, by indices. Used by the
// up/down reorder buttons inside array fields. No-op if out of range.
function moveInNestedArray(obj, path, fromIdx, toIdx) {
  var arr = getNestedValue(obj, path);
  if (!Array.isArray(arr)) return;
  if (fromIdx < 0 || fromIdx >= arr.length) return;
  if (toIdx < 0) toIdx = 0;
  if (toIdx >= arr.length) toIdx = arr.length - 1;
  if (fromIdx === toIdx) return;
  var item = arr.splice(fromIdx, 1)[0];
  arr.splice(toIdx, 0, item);
}

// Render a single field. Supports the flat types (text, url, longText,
// select, boolean, offer-filter) plus 'group'/'object' (one level of
// nested fields) and 'array' (a list of items, each with a nested schema).
//
// Nesting depth in the wild is at most two (array of objects with
// primitive children; group containing primitives or a single sub-array).
// We don't recursively render groups inside groups inside groups.
//
// `basePath` is the dotted props path so far (empty string at top level).
// `field` is a normalised field record: { key, label, type, ... }. For
// items inside an array the synthetic `key` is the numeric index.
//
// Outer wrapper class for groups/arrays gives them visible chrome so
// the user can see the boundaries of nested data.
function renderField(section, basePath, field, depth) {
  depth = depth || 0;
  var path = basePath ? basePath + '.' + field.key : field.key;
  var val = getNestedValue(section.props || {}, path);
  if (val === undefined || val === null) val = '';
  var fid = 'prop_' + section.id + '_' + path.replace(/\./g, '_');
  var pathAttr = esc(path);
  var sidAttr = esc(section.id);

  // ── group / object: one level of nested fields ──
  if (field.type === 'group' || field.type === 'object') {
    var groupFields = field.fields || [];
    var h = '';
    h += '<div class="email-builder-prop-group" data-group-path="' + pathAttr + '">';
    h += '<div class="email-builder-prop-group-label">' + esc(field.label || '');
    if (field.required) h += ' <span style="color:var(--tg-error)">*</span>';
    h += '</div>';
    if (field.help) {
      h += '<div class="email-builder-prop-help" style="font-size:11px;color:var(--tg-text-muted);margin:0 0 8px 0;">' + esc(field.help) + '</div>';
    }
    h += '<div class="email-builder-prop-group-body">';
    groupFields.forEach(function(child) {
      h += renderField(section, path, child, depth + 1);
    });
    h += '</div></div>';
    return h;
  }

  // ── array: a list of repeating items ──
  if (field.type === 'array') {
    var items = Array.isArray(val) ? val : [];
    var itemFields = field.itemFields || [];
    // If itemFields is a single primitive descriptor (e.g. lines: [string]),
    // render each item as that primitive directly. We support this via
    // a one-field synthetic schema with key '' (empty).
    var maxItems = typeof field.max === 'number' ? field.max : null;
    var canAdd = maxItems == null || items.length < maxItems;
    var html = '';
    html += '<div class="email-builder-prop-array" data-array-path="' + pathAttr + '">';
    html += '<div class="email-builder-prop-array-label">' + esc(field.label || '');
    if (field.required) html += ' <span style="color:var(--tg-error)">*</span>';
    if (maxItems != null) html += ' <span class="email-builder-prop-array-meta">(max ' + maxItems + ')</span>';
    html += '</div>';
    if (field.help) {
      html += '<div class="email-builder-prop-help" style="font-size:11px;color:var(--tg-text-muted);margin:0 0 8px 0;">' + esc(field.help) + '</div>';
    }
    if (!items.length) {
      html += '<div class="email-builder-prop-array-empty">No items yet — click Add below.</div>';
    } else {
      items.forEach(function(item, idx) {
        html += '<div class="email-builder-prop-array-item">';
        html += '<div class="email-builder-prop-array-item-header">';
        html += '<span class="email-builder-prop-array-item-num">' + (idx + 1) + '</span>';
        html += '<div class="email-builder-prop-array-item-actions">';
        html += '<button type="button" class="email-builder-prop-array-btn" title="Move up"' + (idx === 0 ? ' disabled' : '') + ' onclick="window.__builderArrayMove(\'' + sidAttr + '\',\'' + pathAttr + '\',' + idx + ',' + (idx - 1) + ')">↑</button>';
        html += '<button type="button" class="email-builder-prop-array-btn" title="Move down"' + (idx === items.length - 1 ? ' disabled' : '') + ' onclick="window.__builderArrayMove(\'' + sidAttr + '\',\'' + pathAttr + '\',' + idx + ',' + (idx + 1) + ')">↓</button>';
        html += '<button type="button" class="email-builder-prop-array-btn email-builder-prop-array-btn-remove" title="Remove" onclick="window.__builderArrayRemove(\'' + sidAttr + '\',\'' + pathAttr + '\',' + idx + ')">×</button>';
        html += '</div>';
        html += '</div>';
        html += '<div class="email-builder-prop-array-item-body">';
        if (itemFields.length === 1 && itemFields[0].key === '') {
          // Primitive item — render the single anonymous field at this index
          var primField = Object.assign({}, itemFields[0], { key: String(idx), label: '' });
          html += renderField(section, path, primField, depth + 1);
        } else {
          // Object item — render each declared sub-field at this index
          itemFields.forEach(function(child) {
            var childAtIdx = Object.assign({}, child, { key: String(idx) + '.' + child.key });
            html += renderField(section, path, childAtIdx, depth + 1);
          });
        }
        html += '</div>';
        html += '</div>';
      });
    }
    if (canAdd) {
      html += '<button type="button" class="email-builder-prop-array-add" onclick="window.__builderArrayAdd(\'' + sidAttr + '\',\'' + pathAttr + '\')">+ Add ' + esc(field.itemLabel || 'item') + '</button>';
    }
    html += '</div>';
    return html;
  }

  // ── flat field types (the original switch) ──
  var h = '';
  h += '<div class="email-builder-prop-field">';
  // For array-item primitive children with no label, skip the label row.
  // For booleans, the inline checkbox label *is* the label (avoids dup).
  if (field.label && field.type !== 'boolean') {
    h += '<label for="' + fid + '" class="email-builder-prop-label">';
    h += esc(field.label);
    if (field.required) h += ' <span style="color:var(--tg-error)">*</span>';
    h += '</label>';
  }
  if (field.type === 'longText') {
    h += '<textarea id="' + fid + '" rows="3"' + (field.maxLength ? ' maxlength="' + field.maxLength + '"' : '') + ' class="email-builder-prop-input" oninput="window.__builderUpdateField(\'' + sidAttr + '\',\'' + pathAttr + '\',this.value)">' + esc(val) + '</textarea>';
  } else if (field.type === 'offer-filter') {
    h += renderOfferFilter(section, field, val);
  } else if (field.type === 'select') {
    h += '<select id="' + fid + '" class="email-builder-prop-input" onchange="window.__builderUpdateField(\'' + sidAttr + '\',\'' + pathAttr + '\',this.value)">';
    if (!field.required) {
      h += '<option value=""' + (val === '' ? ' selected' : '') + '>—</option>';
    }
    field.options.forEach(function(o) {
      h += '<option value="' + esc(o) + '"' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    });
    h += '</select>';
  } else if (field.type === 'boolean') {
    h += '<label class="email-builder-prop-checkbox"><input type="checkbox"' + (val ? ' checked' : '') + ' onchange="window.__builderUpdateField(\'' + sidAttr + '\',\'' + pathAttr + '\',this.checked)"> ' + esc(field.checkboxLabel || field.label) + '</label>';
  } else if (field.type === 'colour') {
    // Colour picker pair: native HTML5 picker + hex text input that stay in
    // sync. Either input updates the section prop on change. We default the
    // visible picker to white when val is empty (otherwise it'd flash
    // browser-default black during streaming) but write through an empty
    // string so the section file's brand-kit fallback still wins.
    var cid = fid;
    var pickerVal = (val && /^#[0-9A-Fa-f]{6}$/.test(val)) ? val : (field.defaultPreview || '#FFFFFF');
    var textVal = val || '';
    h += '<div style="display:flex;gap:6px;align-items:stretch">';
    h += '<input type="color" id="' + cid + '-picker" value="' + esc(pickerVal) + '" oninput="document.getElementById(\'' + cid + '\').value=this.value;window.__builderUpdateField(\'' + sidAttr + '\',\'' + pathAttr + '\',this.value)" style="width:42px;height:38px;padding:2px;border:1px solid var(--tg-border);border-radius:6px;background:var(--tg-bg-primary);cursor:pointer;flex:0 0 auto" aria-label="' + esc(field.label || 'Colour') + ' picker">';
    h += '<input type="text" id="' + cid + '" value="' + esc(textVal) + '" placeholder="' + esc(field.placeholder || '#1B2B5B (leave empty for default)') + '" maxlength="7" pattern="^#[0-9A-Fa-f]{6}$" class="email-builder-prop-input" style="flex:1;font-family:var(--tg-font-mono,monospace);letter-spacing:0.02em" oninput="if(/^#[0-9A-Fa-f]{6}$/.test(this.value)){document.getElementById(\'' + cid + '-picker\').value=this.value;}window.__builderUpdateField(\'' + sidAttr + '\',\'' + pathAttr + '\',this.value)">';
    h += '</div>';
    if (field.help) {
      h += '<div class="email-builder-prop-help" style="font-size:11px;color:var(--tg-text-tertiary);margin-top:4px">' + esc(field.help) + '</div>';
    }
  } else {
    var t = field.type === 'url' ? 'url' : 'text';
    // ── Stage C: image-field generate button ─────────────────────────
    // A url field whose key ends in imageUrl, image_url, logoUrl, etc. is
    // an image slot and gets a Generate button to its right that opens
    // the per-slot image-generate modal.
    var isImageField = field.type === 'url' && isImageFieldKey(field.key);
    var activeJob = isImageField ? getActiveImageJob(section.id, path) : null;
    if (isImageField) {
      h += '<div class="email-builder-image-field" style="display:flex;gap:6px;align-items:stretch">';
      h += '<input id="' + fid + '" type="url" value="' + esc(val) + '"' + (field.maxLength ? ' maxlength="' + field.maxLength + '"' : '') + ' class="email-builder-prop-input" style="flex:1;min-width:0" oninput="window.__builderUpdateField(\'' + sidAttr + '\',\'' + pathAttr + '\',this.value)">';
      if (activeJob) {
        h += '<button type="button" disabled class="email-builder-img-gen-btn email-builder-img-gen-btn-running" title="Generation in progress">';
        h += '<span class="email-builder-img-gen-spinner"></span>';
        h += '<span class="email-builder-img-gen-label">Generating' + (activeJob.elapsedSec ? ' ' + activeJob.elapsedSec + 's' : '') + '</span>';
        h += '</button>';
      } else {
        h += '<button type="button" class="email-builder-img-gen-btn" onclick="window.__imageGenerateOpen(\'' + sidAttr + '\',\'' + pathAttr + '\')" title="Generate a mockup with AI (slower, high quality)">';
        h += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>';
        h += '<span class="email-builder-img-gen-label">Generate</span>';
        h += '</button>';
        h += '<button type="button" class="email-builder-img-gen-btn" onclick="window.__photoGenerateOpen(\'' + sidAttr + '\',\'' + pathAttr + '\')" title="Generate a photo with Reactive (faster, photographic)">';
        h += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M7 5l1.5-2h7L17 5"/></svg>';
        h += '<span class="email-builder-img-gen-label">Photo</span>';
        h += '</button>';
        h += '<button type="button" class="email-builder-img-gen-btn" id="' + fid + '-upload-btn" onclick="window.__imageUploadOpen(\'' + sidAttr + '\',\'' + pathAttr + '\',\'' + fid + '\')" title="Upload an image from your computer (JPEG, PNG, GIF, WebP, max 4MB)">';
        h += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
        h += '<span class="email-builder-img-gen-label">Upload</span>';
        h += '</button>';
      }
      h += '</div>';
      // Preview thumbnail if URL set
      if (val && typeof val === 'string' && val.match(/^https?:\/\//)) {
        h += '<div class="email-builder-image-preview" style="margin-top:6px"><img src="' + esc(val) + '" alt="Preview" style="max-width:200px;max-height:120px;border-radius:6px;border:1px solid var(--tg-border);display:block;background:var(--tg-bg-secondary)"></div>';
      }
    } else {
      h += '<input id="' + fid + '" type="' + t + '" value="' + esc(val) + '"' + (field.maxLength ? ' maxlength="' + field.maxLength + '"' : '') + ' class="email-builder-prop-input" oninput="window.__builderUpdateField(\'' + sidAttr + '\',\'' + pathAttr + '\',this.value)">';
    }
  }
  if (field.help) {
    h += '<div class="email-builder-prop-help" style="font-size:11px;color:var(--tg-text-muted);margin-top:4px;">' + esc(field.help) + '</div>';
  }
  h += '</div>';
  return h;
}

function renderPropertiesForm(section) {
  var meta = sectionMeta(section.type);
  var h = '';
  h += '<div class="email-builder-prop-header">';
  h += '<div class="email-builder-prop-title">' + esc(meta.label) + '</div>';
  h += '<div class="email-builder-prop-desc">' + esc(meta.description) + '</div>';
  h += '</div>';
  h += '<div class="email-builder-prop-fields">';
  meta.fields.forEach(function(field) {
    h += renderField(section, '', field, 0);
  });
  h += '</div>';
  return h;
}

// Redraw just the properties panel without rebuilding the whole email
// builder DOM. Used after array add/remove/move, where we *do* want the
// panel to refresh (we'd lose track of which item index a button refers
// to otherwise) but we don't want to lose scroll or rerun preview.
function redrawPropertyPanel() {
  var host = document.getElementById('builderProperties');
  if (!host) return;
  var sid = emailState.selectedSectionId;
  var s = (emailState.builderSections || []).find(function(x) { return x.id === sid; });
  if (!s) {
    host.innerHTML = '';
    return;
  }
  host.innerHTML = renderPropertiesForm(s);
  // Re-hydrate the offer-filter editor if the section uses it
  if (typeof hydrateOfferFilters === 'function') hydrateOfferFilters();
}

function attachBuilderHandlers() {
  // Drag-to-reorder for section list
  var list = document.getElementById('builderSectionList');
  if (!list) return;
  var dragSrc = null;
  list.querySelectorAll('.email-builder-section-row').forEach(function(row) {
    row.addEventListener('dragstart', function(e) {
      dragSrc = row;
      row.style.opacity = '0.4';
      try { e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
    });
    row.addEventListener('dragend', function() {
      row.style.opacity = '1';
      list.querySelectorAll('.email-builder-section-row').forEach(function(r) {
        r.classList.remove('drop-target-above', 'drop-target-below');
      });
    });
    row.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!dragSrc || dragSrc === row) return;
      var rect = row.getBoundingClientRect();
      var midY = rect.top + rect.height / 2;
      row.classList.toggle('drop-target-above', e.clientY < midY);
      row.classList.toggle('drop-target-below', e.clientY >= midY);
    });
    row.addEventListener('dragleave', function() {
      row.classList.remove('drop-target-above', 'drop-target-below');
    });
    row.addEventListener('drop', function(e) {
      e.preventDefault();
      if (!dragSrc || dragSrc === row) return;
      var srcId = dragSrc.getAttribute('data-section-id');
      var dstId = row.getAttribute('data-section-id');
      var rect = row.getBoundingClientRect();
      var dropAfter = e.clientY > rect.top + rect.height / 2;
      window.__builderReorderSection(srcId, dstId, dropAfter);
    });
  });

  // Hydrate the offer-filter editor (chips, dropdowns, disclosure).
  // No-op if the selected section isn't an offers-* section.
  if (typeof hydrateOfferFilters === 'function') hydrateOfferFilters();
}

// ═════════════════════════════════════════════════════════════
// BUILDER WINDOW HANDLERS
// ═════════════════════════════════════════════════════════════

window.__builderSelectSection = function(id) {
  emailState.selectedSectionId = id;
  drawEmails();
};

// Sections that visually belong at the very top of the email, even
// when added later in the workflow.
var HEADER_TYPES = { 'header': true, 'top-bar': true };
// Sections that visually belong at the very bottom. When adding a
// non-footer/non-header section, slot it just above the first footer.
var FOOTER_TYPES = { 'footer': true, 'footer-light': true, 'footer-meta': true, 'footer-dark': true };

function isHeaderType(t) { return !!HEADER_TYPES[t]; }
function isFooterType(t) { return !!FOOTER_TYPES[t]; }

window.__builderAddSection = function(type) {
  var defaults = defaultPropsForType(type);
  var newSection = { id: genSectionId(), type: type, props: defaults };
  emailState.builderSections = emailState.builderSections || [];

  // Insert before the first footer if one exists, else append.
  // Headers always go to position 0 (or just after an existing header).
  var firstFooterIdx = emailState.builderSections.findIndex(function(s) { return isFooterType(s.type); });
  if (isHeaderType(type)) {
    // Place after any leading header sections so we don't break a
    // header + top-bar pair that's already at the top.
    var insertAt = 0;
    while (insertAt < emailState.builderSections.length && isHeaderType(emailState.builderSections[insertAt].type)) {
      insertAt++;
    }
    emailState.builderSections.splice(insertAt, 0, newSection);
  } else if (isFooterType(type)) {
    emailState.builderSections.push(newSection);
  } else if (firstFooterIdx >= 0) {
    emailState.builderSections.splice(firstFooterIdx, 0, newSection);
  } else {
    emailState.builderSections.push(newSection);
  }

  emailState.selectedSectionId = newSection.id;
  drawEmails();
};

window.__builderDeleteSection = function(id) {
  if (!confirm('Remove this section?')) return;
  emailState.builderSections = emailState.builderSections.filter(function(s) { return s.id !== id; });
  if (emailState.selectedSectionId === id) {
    emailState.selectedSectionId = (emailState.builderSections[0] || {}).id || null;
  }
  drawEmails();
};

window.__builderReorderSection = function(srcId, dstId, dropAfter) {
  var arr = emailState.builderSections;
  var srcIdx = arr.findIndex(function(s) { return s.id === srcId; });
  if (srcIdx < 0) return;
  var src = arr.splice(srcIdx, 1)[0];
  var dstIdx = arr.findIndex(function(s) { return s.id === dstId; });
  if (dstIdx < 0) {
    arr.push(src);
  } else {
    arr.splice(dropAfter ? dstIdx + 1 : dstIdx, 0, src);
  }
  drawEmails();
};

window.__builderUpdateField = function(sectionId, key, value) {
  var s = emailState.builderSections.find(function(x) { return x.id === sectionId; });
  if (!s) return;
  if (!s.props) s.props = {};
  setNestedValue(s.props, key, value);
  // Don't redraw the whole form (would lose focus). Just update the summary in left list and trigger preview.
  updateSectionSummaryInDOM(sectionId);
  window.__builderPreviewDebounced();
};

// JSON field handler. Parses the textarea on blur, stores parsed object
// on props. Empty input is stored as empty object. Invalid JSON keeps
// the previous value and visually flags the textarea.
window.__builderUpdateJsonField = function(sectionId, key, el) {
  var s = emailState.builderSections.find(function(x) { return x.id === sectionId; });
  if (!s) return;
  if (!s.props) s.props = {};
  var txt = (el && el.value || '').trim();
  if (!txt) {
    setNestedValue(s.props, key, {});
    el.style.borderColor = '';
    el.title = '';
    updateSectionSummaryInDOM(sectionId);
    window.__builderPreviewDebounced();
    return;
  }
  try {
    var parsed = JSON.parse(txt);
    if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
      throw new Error('Must be a JSON object, not an array or scalar');
    }
    setNestedValue(s.props, key, parsed);
    el.style.borderColor = '';
    el.title = '';
    updateSectionSummaryInDOM(sectionId);
    window.__builderPreviewDebounced();
  } catch (e) {
    // Invalid JSON — flag the textarea but don't lose what they typed
    el.style.borderColor = 'var(--tg-error,#dc2626)';
    el.title = 'Invalid JSON: ' + e.message;
  }
};

// ═════════════════════════════════════════════════════════════
// ARRAY FIELD HANDLERS
// ═════════════════════════════════════════════════════════════
//
// These power the +/- and ↑↓ buttons inside array-typed fields. They
// mutate the props array, then call redrawPropertyPanel() (which is the
// only safe way — we can't surgically update one row because the
// indices in subsequent items' button handlers would all be wrong).

// Walk the SECTION_META schema by props path. Returns the field
// descriptor for that path. Used to find the itemFields of an array we
// need to add a new row into.
//
// Path segments that look like array indices are skipped — the schema
// itself doesn't contain numeric children; the array's `itemFields`
// are reused for every index.
function findFieldDef(sectionType, path) {
  var meta = sectionMeta(sectionType);
  var fields = meta.fields || [];
  var parts = path.split('.');
  var current = null;
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i];
    if (/^\d+$/.test(part)) {
      // Array index — skip; the itemFields stay the same for every index
      continue;
    }
    var found = null;
    for (var j = 0; j < fields.length; j++) {
      if (fields[j].key === part) { found = fields[j]; break; }
    }
    if (!found) return null;
    current = found;
    if (current.type === 'group' || current.type === 'object') {
      fields = current.fields || [];
    } else if (current.type === 'array') {
      fields = current.itemFields || [];
    } else {
      fields = [];
    }
  }
  return current;
}

// Build a sensible empty item for an array field. Uses each itemField's
// `default` if set, otherwise an empty string. For nested groups/arrays
// inside an item, we recursively build empty containers so that adding a
// row produces a complete shape that won't crash the renderer.
function defaultArrayItem(arrField) {
  var itemFields = arrField.itemFields || [];
  // Primitive item shorthand: a single anonymous field
  if (itemFields.length === 1 && itemFields[0].key === '') {
    return itemFields[0].default != null ? itemFields[0].default : '';
  }
  var obj = {};
  itemFields.forEach(function(f) {
    if (f.type === 'array') {
      obj[f.key] = [];
    } else if (f.type === 'group' || f.type === 'object') {
      var nested = {};
      (f.fields || []).forEach(function(child) {
        nested[child.key] = child.default != null ? child.default
          : child.type === 'boolean' ? false
          : child.type === 'array' ? []
          : '';
      });
      obj[f.key] = nested;
    } else {
      obj[f.key] = f.default != null ? f.default
        : f.type === 'boolean' ? false
        : '';
    }
  });
  return obj;
}

window.__builderArrayAdd = function(sectionId, path) {
  var s = emailState.builderSections.find(function(x) { return x.id === sectionId; });
  if (!s) return;
  if (!s.props) s.props = {};
  var arr = getNestedValue(s.props, path);
  if (!Array.isArray(arr)) {
    arr = [];
    setNestedValue(s.props, path, arr);
  }
  var def = findFieldDef(s.type, path);
  if (!def || def.type !== 'array') return;
  if (typeof def.max === 'number' && arr.length >= def.max) return;
  arr.push(defaultArrayItem(def));
  redrawPropertyPanel();
  updateSectionSummaryInDOM(sectionId);
  window.__builderPreviewDebounced();
};

window.__builderArrayRemove = function(sectionId, path, idx) {
  var s = emailState.builderSections.find(function(x) { return x.id === sectionId; });
  if (!s || !s.props) return;
  var arr = getNestedValue(s.props, path);
  if (!Array.isArray(arr)) return;
  if (idx < 0 || idx >= arr.length) return;
  if (!confirm('Remove this item?')) return;
  arr.splice(idx, 1);
  redrawPropertyPanel();
  updateSectionSummaryInDOM(sectionId);
  window.__builderPreviewDebounced();
};

window.__builderArrayMove = function(sectionId, path, fromIdx, toIdx) {
  var s = emailState.builderSections.find(function(x) { return x.id === sectionId; });
  if (!s || !s.props) return;
  moveInNestedArray(s.props, path, fromIdx, toIdx);
  redrawPropertyPanel();
  updateSectionSummaryInDOM(sectionId);
  window.__builderPreviewDebounced();
};

function offerFilterFid(section, suffix) {
  return 'of_' + section.id + '_' + suffix;

function getFilter(section) {
  if (!section.props) section.props = {};
  if (!section.props.fetch || typeof section.props.fetch !== 'object') {
    section.props.fetch = {};
  }
  return section.props.fetch;
}

function renderOfferFilter(section, field, val) {
  var f = (val && typeof val === 'object') ? val : {};

  h += '<div class="of-editor" data-section-id="' + esc(section.id) + '" id="' + hostId + '">';
  h += '<div class="of-loading">Loading filter editor…</div>';
